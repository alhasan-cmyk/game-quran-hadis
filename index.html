ain":"Integritas adalah berbuat benar karena Allah, bukan karena pengawasan atau pujian. Ini inti kejujuran."},{"level":2,"type":"truefalse","q":"Kejujuran hanya penting saat ada orang yang melihat.","options":["Benar","Salah"],"answer":1,"explain":"Salah. Kejujuran adalah sikap yang harus dijaga meskipun tidak ada yang melihat. Itulah integritas."},{"level":2,"type":"match","q":"Cocokkan istilah dengan maknanya.","pairs":[{"a":"Adil","b":"Memberi hak kepada setiap pihak"},{"a":"Jujur","b":"Sesuai dengan kebenaran"},{"a":"Khianat","b":"Mengkhianati amanah"},{"a":"Amanah","b":"Menjaga titipan dengan benar"}],"explain":"Adil, jujur, amanah, dan tidak khianat adalah fondasi kehidupan yang saleh."}]}};
const GAME_DATA_X = {"surah":{"2":"Al-Baqarah","3":"Ali Imran","4":"An-Nisa","5":"Al-Ma'idah","7":"Al-A'raf","9":"At-Taubah","10":"Yunus","15":"Al-Hijr","16":"An-Nahl","17":"Al-Isra","21":"Al-Anbiya","25":"Al-Furqan","26":"Asy-Syu'ara","28":"Al-Qasas","30":"Ar-Rum","38":"Shad","42":"Asy-Syura","49":"Al-Hujurat","57":"Al-Hadid","96":"Al-Alaq","107":"Al-Ma'un"},"quran":{"25:67":{"surah":25,"start":67,"end":67,"arabic":["وَٱلَّذِينَ إِذَآ أَنفَقُوا۟ لَمْ يُسْرِفُوا۟ وَلَمْ يَقْتُرُوا۟ وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًۭا"],"id":["Dan orang-orang yang apabila membelanjakan (harta), mereka tidak berlebihan, dan tidak (pula) kikir, dan adalah (pembelanjaan itu) di tengah-tengah antara yang demikian."]},"17:26-27":{"surah":17,"start":26,"end":27,"arabic":["وَءَاتِ ذَا ٱلْقُرْبَىٰ حَقَّهُۥ وَٱلْمِسْكِينَ وَٱبْنَ ٱلسَّبِيلِ وَلَا تُبَذِّرْ تَبْذِيرًا","إِنَّ ٱلْمُبَذِّرِينَ كَانُوٓا۟ إِخْوَٰنَ ٱلشَّيَٰطِينِ ۖ وَكَانَ ٱلشَّيْطَٰنُ لِرَبِّهِۦ كَفُورًۭا"],"id":["Dan berikanlah kepada keluarga-keluarga yang dekat akan haknya, kepada orang miskin dan orang yang dalam perjalanan dan janganlah kamu menghambur-hamburkan (hartamu) secara boros.","Sesungguhnya pemboros-pemboros itu adalah saudara-saudara syaitan dan syaitan itu adalah sangat ingkar kepada Tuhannya."]},"28:79-80":{"surah":28,"start":79,"end":80,"arabic":["فَخَرَجَ عَلَىٰ قَوْمِهِۦ فِى زِينَتِهِۦ ۖ قَالَ ٱلَّذِينَ يُرِيدُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا يَٰلَيْتَ لَنَا مِثْلَ مَآ أُوتِىَ قَٰرُونُ إِنَّهُۥ لَذُو حَظٍّ عَظِيمٍۢ","وَقَالَ ٱلَّذِينَ أُوتُوا۟ ٱلْعِلْمَ وَيْلَكُمْ ثَوَابُ ٱللَّهِ خَيْرٌۭ لِّمَنْ ءَامَنَ وَعَمِلَ صَٰلِحًۭا وَلَا يُلَقَّىٰهَآ إِلَّا ٱلصَّٰبِرُونَ"],"id":["Maka keluarlah Karun kepada kaumnya dalam kemegahannya. Berkatalah orang-orang yang menghendaki kehidupan dunia: \"Moga-moga kiranya kita mempunyai seperti apa yang telah diberikan kepada Karun; sesungguhnya ia benar-benar mempunyai keberuntungan yang besar\".","Berkatalah orang-orang yang dianugerahi ilmu: \"Kecelakaan yang besarlah bagimu, pahala Allah adalah lebih baik bagi orang-orang yang beriman dan beramal saleh, dan tidak diperoleh pahala itu, kecuali oleh orang-orang yang sabar\"."]},"107:1-7":{"surah":107,"start":1,"end":7,"arabic":["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَرَءَيْتَ ٱلَّذِى يُكَذِّبُ بِٱلدِّينِ","فَذَٰلِكَ ٱلَّذِى يَدُعُّ ٱلْيَتِيمَ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ","فَوَيْلٌۭ لِّلْمُصَلِّينَ","ٱلَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ","ٱلَّذِينَ هُمْ يُرَآءُونَ","وَيَمْنَعُونَ ٱلْمَاعُونَ"],"id":["Tahukah kamu (orang) yang mendustakan agama?","Itulah orang yang menghardik anak yatim,","dan tidak menganjurkan memberi makan orang miskin.","Maka kecelakaanlah bagi orang-orang yang shalat,","(yaitu) orang-orang yang lalai dari shalatnya,","orang-orang yang berbuat riya,","dan enggan (menolong dengan) barang berguna."]},"2:155-156":{"surah":2,"start":155,"end":156,"arabic":["وَلَنَبْلُوَنَّكُم بِشَىْءٍۢ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ وَنَقْصٍۢ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ ۗ وَبَشِّرِ ٱلصَّٰبِرِينَ","ٱلَّذِينَ إِذَآ أَصَٰبَتْهُم مُّصِيبَةٌۭ قَالُوٓا۟ إِنَّا لِلَّهِ وَإِنَّآ إِلَيْهِ رَٰجِعُونَ"],"id":["Dan sungguh akan Kami berikan cobaan kepadamu, dengan sedikit ketakutan, kelaparan, kekurangan harta, jiwa dan buah-buahan. Dan berikanlah berita gembira kepada orang-orang yang sabar.","(yaitu) orang-orang yang apabila ditimpa musibah, mereka mengucapkan: \"Inna lillaahi wa innaa ilaihi raaji'uun\"."]},"3:186":{"surah":3,"start":186,"end":186,"arabic":["۞ لَتُبْلَوُنَّ فِىٓ أَمْوَٰلِكُمْ وَأَنفُسِكُمْ وَلَتَسْمَعُنَّ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ مِن قَبْلِكُمْ وَمِنَ ٱلَّذِينَ أَشْرَكُوٓا۟ أَذًۭى كَثِيرًۭا ۚ وَإِن تَصْبِرُوا۟ وَتَتَّقُوا۟ فَإِنَّ ذَٰلِكَ مِنْ عَزْمِ ٱلْأُمُورِ"],"id":["Kamu sungguh-sungguh akan diuji terhadap hartamu dan dirimu. Dan (juga) kamu sungguh-sungguh akan mendengar dari orang-orang yang diberi kitab sebelum kamu dan dari orang-orang yang mempersekutukan Allah, gangguan yang banyak yang menyakitkan hati. Jika kamu bersabar dan bertakwa, maka sesungguhnya yang demikian itu termasuk urusan yang patut diutamakan."]},"57:22":{"surah":57,"start":22,"end":22,"arabic":["مَآ أَصَابَ مِن مُّصِيبَةٍۢ فِى ٱلْأَرْضِ وَلَا فِىٓ أَنفُسِكُمْ إِلَّا فِى كِتَٰبٍۢ مِّن قَبْلِ أَن نَّبْرَأَهَآ ۚ إِنَّ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٌۭ"],"id":["Tiada suatu bencanapun yang menimpa di bumi dan (tidak pula) pada dirimu sendiri melainkan telah tertulis dalam kitab (Lauhul Mahfuzh) sebelum Kami menciptakannya. Sesungguhnya yang demikian itu adalah mudah bagi Allah."]},"30:41":{"surah":30,"start":41,"end":41,"arabic":["ظَهَرَ ٱلْفَسَادُ فِى ٱلْبَرِّ وَٱلْبَحْرِ بِمَا كَسَبَتْ أَيْدِى ٱلنَّاسِ لِيُذِيقَهُم بَعْضَ ٱلَّذِى عَمِلُوا۟ لَعَلَّهُمْ يَرْجِعُونَ"],"id":["Telah nampak kerusakan di darat dan di laut disebabkan karena perbuatan tangan manusi, supay Allah merasakan kepada mereka sebahagian dari (akibat) perbuatan mereka, agar mereka kembali (ke jalan yang benar)."]},"7:56":{"surah":7,"start":56,"end":56,"arabic":["وَلَا تُفْسِدُوا۟ فِى ٱلْأَرْضِ بَعْدَ إِصْلَٰحِهَا وَٱدْعُوهُ خَوْفًۭا وَطَمَعًا ۚ إِنَّ رَحْمَتَ ٱللَّهِ قَرِيبٌۭ مِّنَ ٱلْمُحْسِنِينَ"],"id":["Dan janganlah kamu membuat kerusakan di muka bumi, sesudah (Allah) memperbaikinya dan berdoalah kepada-Nya dengan rasa takut (tidak akan diterima) dan harapan (akan dikabulkan). Sesungguhnya rahmat Allah amat dekat kepada orang-orang yang berbuat baik."]},"38:27":{"surah":38,"start":27,"end":27,"arabic":["وَمَا خَلَقْنَا ٱلسَّمَآءَ وَٱلْأَرْضَ وَمَا بَيْنَهُمَا بَٰطِلًۭا ۚ ذَٰلِكَ ظَنُّ ٱلَّذِينَ كَفَرُوا۟ ۚ فَوَيْلٌۭ لِّلَّذِينَ كَفَرُوا۟ مِنَ ٱلنَّارِ"],"id":["Dan Kami tidak menciptakan langit dan bumi dan apa yang ada antara keduanya tanpa hikmah. Yang demikian itu adalah anggapan orang-orang kafir, maka celakalah orang-orang kafir itu karena mereka akan masuk neraka."]},"2:204-205":{"surah":2,"start":204,"end":205,"arabic":["وَمِنَ ٱلنَّاسِ مَن يُعْجِبُكَ قَوْلُهُۥ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيُشْهِدُ ٱللَّهَ عَلَىٰ مَا فِى قَلْبِهِۦ وَهُوَ أَلَدُّ ٱلْخِصَامِ","وَإِذَا تَوَلَّىٰ سَعَىٰ فِى ٱلْأَرْضِ لِيُفْسِدَ فِيهَا وَيُهْلِكَ ٱلْحَرْثَ وَٱلنَّسْلَ ۗ وَٱللَّهُ لَا يُحِبُّ ٱلْفَسَادَ"],"id":["Dan di antara manusia ada orang yang ucapannya tentang kehidupan dunia menarik hatimu, dan dipersaksikannya kepada Allah (atas kebenaran) isi hatinya, padahal ia adalah penantang yang paling keras.","Dan apabila ia berpaling (dari kamu), ia berjalan di bumi untuk mengadakan kerusakan padanya, dan merusak tanam-tanaman dan binatang ternak, dan Allah tidak menyukai kebinasaan."]},"96:1-5":{"surah":96,"start":1,"end":5,"arabic":["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ","خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ","ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ","ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ","عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ"],"id":["Bacalah dengan (menyebut) nama Tuhanmu Yang menciptakan,","Dia telah menciptakan manusia dari segumpal darah.","Bacalah, dan Tuhanmulah Yang Maha Pemurah,","Yang mengajar (manusia) dengan perantaran kalam,","Dia mengajar kepada manusia apa yang tidak diketahuinya."]},"10:101":{"surah":10,"start":101,"end":101,"arabic":["قُلِ ٱنظُرُوا۟ مَاذَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَمَا تُغْنِى ٱلْءَايَٰتُ وَٱلنُّذُرُ عَن قَوْمٍۢ لَّا يُؤْمِنُونَ"],"id":["Katakanlah: \"Perhatikanlah apa yaag ada di langit dan di bumi. Tidaklah bermanfaat tanda kekuasaan Allah dan rasul-rasul yang memberi peringatan bagi orang-orang yang tidak beriman\"."]},"49:6":{"surah":49,"start":6,"end":6,"arabic":["يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍۢ فَتَبَيَّنُوٓا۟ أَن تُصِيبُوا۟ قَوْمًۢا بِجَهَٰلَةٍۢ فَتُصْبِحُوا۟ عَلَىٰ مَا فَعَلْتُمْ نَٰدِمِينَ"],"id":["Hai orang-orang yang beriman, jika datang kepadamu orang fasik membawa suatu berita, maka periksalah dengan teliti agar kamu tidak menimpakan suatu musibah kepada suatu kaum tanpa mengetahui keadaannya yang menyebabkan kamu menyesal atas perbuatanmu itu."]},"16:125":{"surah":16,"start":125,"end":125,"arabic":["ٱدْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِٱلْحِكْمَةِ وَٱلْمَوْعِظَةِ ٱلْحَسَنَةِ ۖ وَجَٰدِلْهُم بِٱلَّتِى هِىَ أَحْسَنُ ۚ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦ ۖ وَهُوَ أَعْلَمُ بِٱلْمُهْتَدِينَ"],"id":["Serulah (manusia) kepada jalan Tuhan-mu dengan hikmah dan pelajaran yang baik dan bantahlah mereka dengan cara yang baik. Sesungguhnya Tuhanmu Dialah yang lebih mengetahui tentang siapa yang tersesat dari jalan-Nya dan Dialah yang lebih mengetahui orang-orang yang mendapat petunjuk."]},"26:214-216":{"surah":26,"start":214,"end":216,"arabic":["وَأَنذِرْ عَشِيرَتَكَ ٱلْأَقْرَبِينَ","وَٱخْفِضْ جَنَاحَكَ لِمَنِ ٱتَّبَعَكَ مِنَ ٱلْمُؤْمِنِينَ","فَإِنْ عَصَوْكَ فَقُلْ إِنِّى بَرِىٓءٌۭ مِّمَّا تَعْمَلُونَ"],"id":["Dan berilah peringatan kepada kerabat-kerabatmu yang terdekat,","dan rendahkanlah dirimu terhadap orang-orang yang mengikutimu, yaitu orang-orang yang beriman.","Jika mereka mendurhakaimu maka katakanlah: \"Sesungguhnya aku tidak bertanggung jawab terhadap apa yang kamu kerjakan\";"]},"15:94-95":{"surah":15,"start":94,"end":95,"arabic":["فَٱصْدَعْ بِمَا تُؤْمَرُ وَأَعْرِضْ عَنِ ٱلْمُشْرِكِينَ","إِنَّا كَفَيْنَٰكَ ٱلْمُسْتَهْزِءِينَ"],"id":["Maka sampaikanlah olehmu secara terang-terangan segala apa yang diperintahkan (kepadamu) dan berpalinglah dari orang-orang yang musyrik.","Sesungguhnya Kami memelihara kamu daripada (kejahatan) orang-orang yang memperolok-olokkan (kamu),"]},"21:107":{"surah":21,"start":107,"end":107,"arabic":["وَمَآ أَرْسَلْنَٰكَ إِلَّا رَحْمَةًۭ لِّلْعَٰلَمِينَ"],"id":["Dan tiadalah Kami mengutus kamu, melainkan untuk (menjadi) rahmat bagi semesta alam."]},"3:104":{"surah":3,"start":104,"end":104,"arabic":["وَلْتَكُن مِّنكُمْ أُمَّةٌۭ يَدْعُونَ إِلَى ٱلْخَيْرِ وَيَأْمُرُونَ بِٱلْمَعْرُوفِ وَيَنْهَوْنَ عَنِ ٱلْمُنكَرِ ۚ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ"],"id":["Dan hendaklah ada di antara kamu segolongan umat yang menyeru kepada kebajikan, menyuruh kepada yang ma'ruf dan mencegah dari yang munkar; merekalah orang-orang yang beruntung."]},"3:110":{"surah":3,"start":110,"end":110,"arabic":["كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِٱلْمَعْرُوفِ وَتَنْهَوْنَ عَنِ ٱلْمُنكَرِ وَتُؤْمِنُونَ بِٱللَّهِ ۗ وَلَوْ ءَامَنَ أَهْلُ ٱلْكِتَٰبِ لَكَانَ خَيْرًۭا لَّهُم ۚ مِّنْهُمُ ٱلْمُؤْمِنُونَ وَأَكْثَرُهُمُ ٱلْفَٰسِقُونَ"],"id":["Kamu adalah umat yang terbaik yang dilahirkan untuk manusia, menyuruh kepada yang ma'ruf, dan mencegah dari yang munkar, dan beriman kepada Allah. Sekiranya Ahli Kitab beriman, tentulah itu lebih baik bagi mereka, di antara mereka ada yang beriman, dan kebanyakan mereka adalah orang-orang yang fasik."]},"5:78-79":{"surah":5,"start":78,"end":79,"arabic":["لُعِنَ ٱلَّذِينَ كَفَرُوا۟ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ عَلَىٰ لِسَانِ دَاوُۥدَ وَعِيسَى ٱبْنِ مَرْيَمَ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ","كَانُوا۟ لَا يَتَنَاهَوْنَ عَن مُّنكَرٍۢ فَعَلُوهُ ۚ لَبِئْسَ مَا كَانُوا۟ يَفْعَلُونَ"],"id":["Telah dilaknati orang-orang kafir dari Bani Israil dengan lisan Daud dan Isa putera Maryam. Yang demikian itu, disebabkan mereka durhaka dan selalu melampaui batas.","Mereka satu sama lain selalu tidak melarang tindakan munkar yang mereka perbuat. Sesungguhnya amat buruklah apa yang selalu mereka perbuat itu."]},"3:159":{"surah":3,"start":159,"end":159,"arabic":["فَبِمَا رَحْمَةٍۢ مِّنَ ٱللَّهِ لِنتَ لَهُمْ ۖ وَلَوْ كُنتَ فَظًّا غَلِيظَ ٱلْقَلْبِ لَٱنفَضُّوا۟ مِنْ حَوْلِكَ ۖ فَٱعْفُ عَنْهُمْ وَٱسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِى ٱلْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَوَكِّلِينَ"],"id":["Maka disebabkan rahmat dari Allah-lah kamu berlaku lemah lembut terhadap mereka. Sekiranya kamu bersikap keras lagi berhati kasar, tentulah mereka menjauhkan diri dari sekelilingmu. Karena itu maafkanlah mereka, mohonkanlah ampun bagi mereka, dan bermusyawaratlah dengan mereka dalam urusan itu. Kemudian apabila kamu telah membulatkan tekad, maka bertawakkallah kepada Allah. Sesungguhnya Allah menyukai orang-orang yang bertawakkal kepada-Nya."]},"42:38":{"surah":42,"start":38,"end":38,"arabic":["وَٱلَّذِينَ ٱسْتَجَابُوا۟ لِرَبِّهِمْ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَ"],"id":["Dan (bagi) orang-orang yang menerima (mematuhi) seruan Tuhannya dan mendirikan shalat, sedang urusan mereka (diputuskan) dengan musyawarat antara mereka; dan mereka menafkahkan sebagian dari rezeki yang Kami berikan kepada mereka."]},"49:13":{"surah":49,"start":13,"end":13,"arabic":["يَٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقْنَٰكُم مِّن ذَكَرٍۢ وَأُنثَىٰ وَجَعَلْنَٰكُمْ شُعُوبًۭا وَقَبَآئِلَ لِتَعَارَفُوٓا۟ ۚ إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَىٰكُمْ ۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٌۭ"],"id":["Hai manusia, sesungguhnya Kami menciptakan kamu dari seorang laki-laki dan seorang perempuan dan menjadikan kamu berbangsa-bangsa dan bersuku-suku supaya kamu saling kenal-mengenal. Sesungguhnya orang yang paling mulia diantara kamu disisi Allah ialah orang yang paling takwa diantara kamu. Sesungguhnya Allah Maha Mengetahui lagi Maha Mengenal."]},"5:8":{"surah":5,"start":8,"end":8,"arabic":["يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُونُوا۟ قَوَّٰمِينَ لِلَّهِ شُهَدَآءَ بِٱلْقِسْطِ ۖ وَلَا يَجْرِمَنَّكُمْ شَنَـَٔانُ قَوْمٍ عَلَىٰٓ أَلَّا تَعْدِلُوا۟ ۚ ٱعْدِلُوا۟ هُوَ أَقْرَبُ لِلتَّقْوَىٰ ۖ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا تَعْمَلُونَ"],"id":["Hai orang-orang yang beriman hendaklah kamu jadi orang-orang yang selalu menegakkan (kebenaran) karena Allah, menjadi saksi dengan adil. Dan janganlah sekali-kali kebencianmu terhadap sesuatu kaum, mendorong kamu untuk berlaku tidak adil. Berlaku adillah, karena adil itu lebih dekat kepada takwa. Dan bertakwalah kepada Allah, sesungguhnya Allah Maha Mengetahui apa yang kamu kerjakan."]},"9:119":{"surah":9,"start":119,"end":119,"arabic":["يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَكُونُوا۟ مَعَ ٱلصَّٰدِقِينَ"],"id":["Hai orang-orang yang beriman bertakwalah kepada Allah, dan hendaklah kamu bersama orang-orang yang benar."]},"16:90":{"surah":16,"start":90,"end":90,"arabic":["۞ إِنَّ ٱللَّهَ يَأْمُرُ بِٱلْعَدْلِ وَٱلْإِحْسَٰنِ وَإِيتَآئِ ذِى ٱلْقُرْبَىٰ وَيَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ وَٱلْبَغْىِ ۚ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ"],"id":["Sesungguhnya Allah menyuruh (kamu) berlaku adil dan berbuat kebajikan, memberi kepada kaum kerabat, dan Allah melarang dari perbuatan keji, kemungkaran dan permusuhan. Dia memberi pengajaran kepadamu agar kamu dapat mengambil pelajaran."]},"4:105":{"surah":4,"start":105,"end":105,"arabic":["إِنَّآ أَنزَلْنَآ إِلَيْكَ ٱلْكِتَٰبَ بِٱلْحَقِّ لِتَحْكُمَ بَيْنَ ٱلنَّاسِ بِمَآ أَرَىٰكَ ٱللَّهُ ۚ وَلَا تَكُن لِّلْخَآئِنِينَ خَصِيمًۭا"],"id":["Sesungguhnya Kami telah menurunkan kitab kepadamu dengan membawa kebenaran, supaya kamu mengadili antara manusia dengan apa yang telah Allah wahyukan kepadamu, dan janganlah kamu menjadi penantang (orang yang tidak bersalah), karena (membela) orang-orang yang khianat,"]}},"chapters":[{"id":1,"bab":"Bab I","title":"Al-Qur’an adalah Wahyu Allah","short":"Mengenal al-Qur’an dan mengamalkan petunjuknya.","island":"Rumah Wahyu","emoji":"📖","color":"#34d399","color2":"#065f46","teacher":"Ustadzah Laila","intro":"Sumber: Al-Qur’an Hadis MA Kelas X, KSKK Kemenag 2020, hlm. 2–11.","materi":[{"type":"inti","title":"Pokok materi 1","text":"Al-Qur’an merupakan firman Allah yang diturunkan kepada Nabi Muhammad saw. melalui malaikat Jibril. Al-Qur’an menjadi pedoman hidup dan membacanya bernilai ibadah."},{"type":"inti","title":"Pokok materi 2","text":"Ulama menyampaikan beragam pandangan mengenai asal kata dan definisi al-Qur’an. Al-Lihyani mengaitkannya dengan bacaan; Imam Syafi’i memandangnya sebagai nama khusus. Perbedaan sudut pandang dapat saling melengkapi."},{"type":"inti","title":"Pokok materi 3","text":"Dalam definisi yang dihimpun buku, al-Qur’an berbahasa Arab, ditulis dalam mushaf, dimulai dengan al-Fatihah dan diakhiri an-Nas, serta disampaikan secara mutawatir."},{"type":"inti","title":"Pokok materi 4","text":"Nama al-Kitab menunjukkan kitab yang ditulis; al-Furqan berarti pembeda antara hak dan batil; az-Zikr bermakna peringatan; at-Tanzil bermakna yang diturunkan."},{"type":"inti","title":"Pokok materi 5","text":"Berpegang pada al-Qur’an bukan hanya membaca, tetapi juga memahami dan menerapkan petunjuknya dalam akidah, ibadah, dan akhlak."}],"vocab":[{"term":"Al-Kitab","meaning":"Kitab yang ditulis."},{"term":"Al-Furqan","meaning":"Pembeda antara hak dan batil."},{"term":"Az-Zikr","meaning":"Peringatan."},{"term":"At-Tanzil","meaning":"Yang diturunkan."}],"values":[],"ujian":[]},{"id":2,"bab":"Bab II","title":"Kebenaran Penurunan Al-Qur’an","short":"Penurunan wahyu dan sejarah pengumpulan mushaf.","island":"Rumah Sejarah Wahyu","emoji":"📜","color":"#38bdf8","color2":"#075985","teacher":"Ustadz Fauzan","intro":"Sumber: Al-Qur’an Hadis MA Kelas X, KSKK Kemenag 2020, hlm. 15–21.","materi":[{"type":"inti","title":"Pokok materi 1","text":"Buku memaparkan beragam pendapat ulama mengenai tahapan turunnya al-Qur’an. Salah satu pendapat menyatakan bahwa al-Qur’an diturunkan ke langit dunia sekaligus, lalu diturunkan berangsur-angsur kepada Nabi Muhammad saw."},{"type":"inti","title":"Pokok materi 2","text":"Permulaan wahyu kepada Nabi Muhammad saw. terjadi ketika beliau beribadah di Gua Hira. Ayat pertama yang disebut buku ialah surah al-‘Alaq ayat 1–5."},{"type":"inti","title":"Pokok materi 3","text":"Pada masa Nabi, para sahabat menghafal wahyu dan menulisnya pada berbagai bahan yang tersedia. Catatan pada masa itu masih tersebar."},{"type":"inti","title":"Pokok materi 4","text":"Setelah sejumlah penghafal gugur dalam perang Yamamah, Umar mengusulkan pengumpulan. Abu Bakar menugaskan Zaid bin Tsabit mengumpulkan catatan al-Qur’an."},{"type":"inti","title":"Pokok materi 5","text":"Pada masa Usman, mushaf diperbanyak dan dikirim ke berbagai wilayah untuk membantu menyatukan umat pada mushaf standar. Pengumpulan masa Abu Bakar dan standardisasi masa Usman berkaitan, tetapi mempunyai penekanan tujuan yang berbeda."}],"vocab":[{"term":"Wahyu","meaning":"Pesan Allah yang disampaikan kepada nabi."},{"term":"Mushaf","meaning":"Kumpulan lembaran yang memuat tulisan al-Qur’an."},{"term":"Berangsur-angsur","meaning":"Bertahap dalam berbagai waktu."}],"values":[],"ujian":[]},{"id":3,"bab":"Bab III","title":"Menghayati Keotentikan Al-Qur’an","short":"Keaslian dan penjagaan al-Qur’an.","island":"Rumah Keotentikan","emoji":"🔎","color":"#4ade80","color2":"#14532d","teacher":"Ustadzah Maryam","intro":"Sumber: Al-Qur’an Hadis MA Kelas X, KSKK Kemenag 2020, hlm. 24–29.","materi":[{"type":"inti","title":"Pokok materi 1","text":"Keotentikan berarti keaslian. Buku menjelaskan keyakinan umat Islam bahwa Allah menjaga kemurnian al-Qur’an."},{"type":"inti","title":"Pokok materi 2","text":"QS al-Hijr 15:9 disebut dalam pembahasan sebagai dasar keyakinan akan penjagaan al-Qur’an. QS al-Isra 17:88 memuat tantangan untuk mendatangkan yang serupa dengan al-Qur’an."},{"type":"inti","title":"Pokok materi 3","text":"Buku membahas tantangan mendatangkan sepuluh surah dalam QS Hud 11:13 dan satu surah dalam QS al-Baqarah 2:23."},{"type":"inti","title":"Pokok materi 4","text":"Penjagaan juga dibahas melalui hafalan para penghafal, penyalinan mushaf, dan penyampaian yang berkesinambungan. Buku mengingatkan bahwa kekeliruan cetak dapat diperiksa dan diperbaiki."},{"type":"inti","title":"Pokok materi 5","text":"Ketelitian memeriksa sumber dan membandingkan cetakan membantu menghindari penyebaran kesalahan. Kesalahan pada suatu cetakan tidak otomatis menjadi perubahan dalam keseluruhan tradisi penjagaan."}],"vocab":[{"term":"Keotentikan","meaning":"Keaslian."},{"term":"Mushaf","meaning":"Kumpulan lembaran bertuliskan al-Qur’an."}],"values":[],"ujian":[]},{"id":4,"bab":"Bab IV","title":"Al-Qur’an Mukjizat Nabiku","short":"Mukjizat dan aspek kemukjizatan al-Qur’an.","island":"Rumah Mukjizat","emoji":"✨","color":"#a78bfa","color2":"#4c1d95","teacher":"Ustadz Ilham","intro":"Sumber: Al-Qur’an Hadis MA Kelas X KSKK 2020, hlm. 33–47.","materi":[{"type":"inti","title":"Pokok materi 1","text":"Buku mendefinisikan mukjizat sebagai kejadian luar biasa yang dikaruniakan Allah kepada nabi dan rasul untuk menjadi bukti kebenaran risalahnya."},{"type":"inti","title":"Pokok materi 2","text":"Mukjizat hissi dapat disaksikan melalui pancaindra dan terkait peristiwa tertentu. Mukjizat maknawi dipahami dengan akal dan pemikiran."},{"type":"inti","title":"Pokok materi 3","text":"I’jaz al-Qur’an berarti kemukjizatan al-Qur’an yang menunjukkan keterbatasan manusia untuk mendatangkan yang semisal dengannya."},{"type":"inti","title":"Pokok materi 4","text":"Dua aspek besar yang dibahas dalam buku ialah gaya bahasa (uslub) dan isi kandungan. Pembahasan perlu dilandasi sumber dan tidak menyamakan setiap peristiwa aneh dengan mukjizat nabi."},{"type":"inti","title":"Pokok materi 5","text":"Buku menyebut contoh mukjizat nabi terdahulu, termasuk Nabi Musa dan Nabi Isa. Mukjizat itu terjadi atas izin Allah."}],"vocab":[{"term":"Mukjizat hissi","meaning":"Mukjizat yang dapat disaksikan melalui pancaindra."},{"term":"Mukjizat maknawi","meaning":"Mukjizat yang dipahami melalui akal dan pemikiran."},{"term":"Uslub","meaning":"Gaya bahasa."}],"values":[],"ujian":[]},{"id":5,"bab":"Bab V","title":"Kebenaran Al-Qur’an pada Semua Aspek Kehidupan","short":"Kandungan al-Qur’an dalam kehidupan.","island":"Rumah Kehidupan","emoji":"🌿","color":"#fb7185","color2":"#881337","teacher":"Ustadzah Rahma","intro":"Sumber: Buku KSKK 2020 hlm. 52–64","materi":[{"type":"inti","title":"Pokok materi 1","text":"Buku membahas kandungan al-Qur’an meliputi akidah, ibadah dan muamalah, akhlak, hukum, kisah, serta dasar ilmu pengetahuan."},{"type":"inti","title":"Pokok materi 2","text":"Akidah berkaitan dengan keyakinan. Ibadah merupakan ketaatan kepada Allah; muamalah berkaitan dengan hubungan antarmanusia."},{"type":"inti","title":"Pokok materi 3","text":"Akhlak berkaitan dengan perilaku. Kisah umat terdahulu memberikan pelajaran, sedangkan dorongan membaca mendukung pencarian ilmu."},{"type":"inti","title":"Pokok materi 4","text":"Al-Qur’an menjadi pedoman yang perlu dipahami dan diterapkan secara bertanggung jawab dalam kehidupan pribadi maupun sosial."}],"vocab":[{"term":"Akidah","meaning":"Keyakinan."},{"term":"Muamalah","meaning":"Hubungan antarmanusia."},{"term":"Akhlak","meaning":"Perilaku dan budi pekerti."}],"values":[],"ujian":[]},{"id":6,"bab":"Bab VI","title":"Kebenaran Al-Qur’an Berlaku Sepanjang Zaman","short":"Struktur al-Qur’an dan cara mencari ayat.","island":"Rumah Struktur","emoji":"🧭","color":"#fbbf24","color2":"#92400e","teacher":"Ustadz Amar","intro":"Sumber: Buku KSKK 2020 hlm. 68–73","materi":[{"type":"inti","title":"Pokok materi 1","text":"Buku membahas struktur al-Qur’an untuk memudahkan pembacaan dan pembelajaran: 114 surah dan 30 juz."},{"type":"inti","title":"Pokok materi 2","text":"Menurut pembagian berdasarkan waktu hijrah, Makkiyah adalah wahyu sebelum hijrah dan Madaniyah sesudah hijrah. Buku juga menyebut adanya pendapat berdasarkan tempat."},{"type":"inti","title":"Pokok materi 3","text":"Manzil membagi bacaan menjadi tujuh bagian; maqra atau ruku menandai subpembahasan tertentu. Mu’jam membantu mencari ayat berdasarkan istilah."},{"type":"inti","title":"Pokok materi 4","text":"Surah at-Taubah tidak diawali basmalah; surah an-Naml memuat basmalah pada awal surah dan ayat 30."}],"vocab":[{"term":"Juz","meaning":"Pembagian bacaan al-Qur’an."},{"term":"Manzil","meaning":"Pembagian bacaan menjadi tujuh bagian."},{"term":"Mu’jam","meaning":"Kamus untuk mencari istilah."}],"values":[],"ujian":[]},{"id":7,"bab":"Bab VII","title":"Memahami Hadis, Sunah, Khabar dan Atsar","short":"Istilah hadis, sunah, khabar, dan atsar.","island":"Rumah Istilah Hadis","emoji":"📚","color":"#2dd4bf","color2":"#134e4a","teacher":"Ustadz Syura","intro":"Sumber: Buku KSKK 2020 hlm. 84–92","materi":[{"type":"inti","title":"Pokok materi 1","text":"Menurut ahli hadis dalam buku, hadis mencakup sesuatu yang disandarkan kepada Nabi Muhammad saw., seperti perkataan, perbuatan, takrir, dan sifat. Takrir adalah persetujuan Nabi atas sesuatu yang beliau ketahui."},{"type":"inti","title":"Pokok materi 2","text":"Definisi hadis dan sunah berbeda menurut sudut pandang dan disiplin ulama; buku juga menunjukkan kesamaan keduanya karena bersumber dari Nabi."},{"type":"inti","title":"Pokok materi 3","text":"Menurut sebagian ulama yang dikutip buku, khabar dapat dinisbahkan kepada Nabi, sahabat, atau tabiin; atsar sering digunakan untuk perkataan sahabat meski kadang dinisbahkan kepada Nabi."},{"type":"inti","title":"Pokok materi 4","text":"Saat menggunakan riwayat, penting menelusuri sumber, memahami konteks, dan memeriksa penilaian keabsahan dengan bimbingan guru."}],"vocab":[{"term":"Qauli","meaning":"Perkataan."},{"term":"Fi’li","meaning":"Perbuatan."},{"term":"Takrir","meaning":"Persetujuan Nabi."}],"values":[],"ujian":[]},{"id":8,"bab":"Bab VIII","title":"Hadis Sumber Ajaran Islam","short":"Sejarah penerimaan dan pembukuan hadis.","island":"Rumah Sejarah Hadis","emoji":"📜","color":"#f6c453","color2":"#78350f","teacher":"Ustadz Adil","intro":"Sumber: Buku KSKK 2020 hlm. 96–112","materi":[{"type":"inti","title":"Pokok materi 1","text":"Hadis dipelajari sebagai sumber ajaran Islam dan membantu menerangkan al-Qur’an. Buku menelusuri sejarah penerimaan, penyampaian, pengumpulan, penulisan, dan penelitian hadis."},{"type":"inti","title":"Pokok materi 2","text":"Pada masa Nabi, sahabat menerima hadis secara langsung atau melalui sahabat dan utusan. Pemahaman, hafalan, pengamalan, dan penyampaian berperan dalam penjagaan."},{"type":"inti","title":"Pokok materi 3","text":"Buku menyebut upaya resmi pembukuan hadis pada masa Khalifah Umar bin Abdul Aziz dan peran ulama seperti Ibn Syihab az-Zuhri."},{"type":"inti","title":"Pokok materi 4","text":"Ulama kemudian menyusun dan meneliti berbagai kitab hadis. Kita perlu memeriksa sumber dan penilaian kualitas hadis sebelum mengutip atau menyebarkannya."}],"vocab":[{"term":"Riwayat","meaning":"Penyampaian berita atau hadis."},{"term":"Pembukuan","meaning":"Penghimpunan dan penulisan."},{"term":"Az-Zuhri","meaning":"Ulama yang disebut dalam sejarah pembukuan hadis."}],"values":[],"ujian":[]},{"id":9,"bab":"Bab IX","title":"Menganalisis Unsur-Unsur Hadis","short":"Menganalisis Unsur-Unsur Hadis","island":"Papan Misi","emoji":"📚","color":"#70c1ff","color2":"#075985","teacher":"Guru Pustaka","intro":"Sumber: KSKK 2020 hlm. 115–125","materi":[{"type":"inti","title":"Pokok materi 1","text":"Buku membahas sanad, matan, dan rawi sebagai unsur yang dipelajari dalam sebuah riwayat. Sanad berkaitan dengan rangkaian periwayat; matan adalah isi teks; rawi adalah orang yang meriwayatkan."},{"type":"inti","title":"Pokok materi 2","text":"Penelitian sanad dan matan penting untuk menilai riwayat. Sifat adil dan ketelitian perawi (dabit) termasuk hal yang dipelajari oleh ahli hadis."},{"type":"inti","title":"Pokok materi 3","text":"Penilaian kualitas hadis memerlukan keahlian dan sumber; siswa perlu belajar memeriksa rujukan dan berdiskusi dengan guru."}],"vocab":[{"term":"Sanad","meaning":"rangkaian para periwayat yang menyampaikan hadis"},{"term":"Matan","meaning":"teks atau isi hadis yang diriwayatkan"},{"term":"Rawi","meaning":"orang yang meriwayatkan hadis"},{"term":"Dabit","meaning":"ketelitian atau kekuatan hafalan dan penjagaan catatan perawi"}],"values":[],"ujian":[]},{"id":10,"bab":"Bab X","title":"Menghayati Fungsi Hadis terhadap Al-Qur’an","short":"Menghayati Fungsi Hadis terhadap Al-Qur’an","island":"Papan Misi","emoji":"📚","color":"#70c1ff","color2":"#075985","teacher":"Guru Pustaka","intro":"Sumber: KSKK 2020 hlm. 129–135","materi":[{"type":"inti","title":"Pokok materi 1","text":"Buku menempatkan al-Qur’an sebagai sumber pokok dan hadis sebagai sumber ajaran kedua. Hadis berperan menerangkan dan menguatkan petunjuk al-Qur’an."},{"type":"inti","title":"Pokok materi 2","text":"Bayan taqrir berarti menguatkan ketentuan yang sudah ada; bayan tafsir menerangkan atau merinci ketentuan yang bersifat umum, misalnya penjelasan praktik salat."},{"type":"inti","title":"Pokok materi 3","text":"Buku membahas bayan nasakh dan menegaskan adanya perbedaan pendapat ulama mengenai fungsi tersebut."},{"type":"inti","title":"Pokok materi 4","text":"Mempelajari hubungan ayat dan hadis memerlukan pemeriksaan riwayat, konteks, dan bimbingan guru."}],"vocab":[{"term":"Bayan taqrir","meaning":"menegaskan atau menguatkan ketentuan dalam al-Qur’an"},{"term":"Bayan tafsir","meaning":"menjelaskan atau merinci ketentuan al-Qur’an yang bersifat umum"},{"term":"Hadis","meaning":"sumber ajaran Islam yang membantu memahami al-Qur’an"},{"term":"Bayan nasakh","meaning":"pembahasan perubahan ketentuan yang keberadaannya diperselisihkan ulama"}],"values":[],"ujian":[]},{"id":11,"bab":"Bab XI","title":"Hadis Sahih sebagai Dasar Hukum","short":"Hadis Sahih sebagai Dasar Hukum","island":"Papan Misi","emoji":"📚","color":"#70c1ff","color2":"#075985","teacher":"Guru Pustaka","intro":"Sumber: KSKK 2020 hlm. 139–157","materi":[{"type":"inti","title":"Pokok materi 1","text":"Buku membahas pengelompokan hadis berdasarkan kuantitas periwayatan dan kualitas riwayat. Mutawatir merupakan istilah kuantitas, sedangkan sahih, hasan, dan daif merupakan kategori kualitas."},{"type":"inti","title":"Pokok materi 2","text":"Penilaian kesahihan meninjau antara lain kesinambungan sanad, sifat dan ketelitian perawi, serta ada tidaknya syaz dan illat."},{"type":"inti","title":"Pokok materi 3","text":"Penggunaan hadis daif memiliki perbedaan pandangan dan syarat di kalangan ulama. Hindari menetapkan hukum atau kualitas hadis sendiri tanpa rujukan ahli."}],"vocab":[{"term":"Sahih","meaning":"kategori hadis yang memenuhi syarat kesahihan menurut ilmu hadis"},{"term":"Hasan","meaning":"kategori hadis yang diterima dengan ketentuan yang dibahas ulama hadis"},{"term":"Daif","meaning":"kategori riwayat yang tidak memenuhi syarat penerimaan tertentu"},{"term":"Mutawatir","meaning":"kategori berdasarkan banyaknya jalur periwayatan pada setiap tingkat"}],"values":[],"ujian":[]},{"id":12,"bab":"Bab XII","title":"Biografi Singkat Tokoh-Tokoh Ilmu Hadis dan Karyanya","short":"Biografi Singkat Tokoh-Tokoh Ilmu Hadis dan Karyanya","island":"Papan Misi","emoji":"📚","color":"#70c1ff","color2":"#075985","teacher":"Guru Pustaka","intro":"Sumber: KSKK 2020 hlm. 160–173","materi":[{"type":"inti","title":"Pokok materi 1","text":"Buku mengenalkan ulama hadis dan karya mereka. Imam Malik menyusun al-Muwatta’; Imam Bukhari terkenal dengan al-Jami’ as-Sahih."},{"type":"inti","title":"Pokok materi 2","text":"Imam Muslim dikenal dengan Sahih Muslim, dan Imam Abu Daud dengan Sunan Abu Daud. Para ulama menempuh perjalanan belajar, meneliti riwayat, dan menyusun karya."},{"type":"inti","title":"Pokok materi 3","text":"Kitab hadis tidak selalu mempunyai metode atau penilaian yang sama. Menyebut nama kitab saja tidak otomatis menggantikan pemeriksaan penilaian riwayat."},{"type":"inti","title":"Pokok materi 4","text":"Menghargai karya ulama dapat dilakukan dengan mempelajari sumber, mencantumkan rujukan, dan menghindari klaim yang belum diperiksa."}],"vocab":[{"term":"Imam Malik","meaning":"ulama yang menyusun kitab al-Muwatta’"},{"term":"Imam Bukhari","meaning":"ulama yang terkenal dengan kitab al-Jami’ as-Sahih"},{"term":"Imam Muslim","meaning":"ulama penyusun Sahih Muslim dan murid Imam Bukhari"},{"term":"Imam Abu Daud","meaning":"ulama penyusun Sunan Abu Daud dengan sistematika fikih"}],"values":[],"ujian":[]}],"teachers":{"1":{"name":"Ustadzah Laila","emoji":"🧕","color":"#34d399","greeting":"Assalamu'alaikum, Penjaga Hikmah. Selamat datang di Rumah Ilmu I.","snippet":"Al-Qur’an adalah wahyu Allah dan pedoman hidup."},"2":{"name":"Ustadz Fauzan","emoji":"🧑‍🏫","color":"#38bdf8","greeting":"Assalamu'alaikum. Rumah Ilmu II mengajarkan kesabaran.","snippet":"Sabar bukan pasrah tanpa usaha. QS al-Baqarah 2:155 mengajarkan sabar sambil berikhtiar dan tetap optimis."},"3":{"name":"Ustadzah Maryam","emoji":"👩‍🏫","color":"#4ade80","greeting":"Selamat datang di Rumah Ilmu III, rumah para penjaga bumi.","snippet":"Menjaga lingkungan adalah amanah. QS al-A'raf 7:56 melarang manusia berbuat kerusakan di muka bumi."},"4":{"name":"Ustadz Ilham","emoji":"🧑‍🔬","color":"#a78bfa","greeting":"Rumah Ilmu IV adalah rumah ilmu dan teknologi.","snippet":"Ilmu adalah cahaya. QS al-Alaq 96:1 memerintahkan membaca, dan QS al-Hujurat 49:6 mengajarkan tabayun."},"5":{"name":"Ustadzah Rahma","emoji":"🧕","color":"#fb7185","greeting":"Rumah Ilmu V mengajarkan keramahan Islam.","snippet":"Dakwah dilakukan dengan hikmah dan kelembutan. QS an-Nahl 16:125 dan hadis tentang kelembutan menjadi pegangan."},"6":{"name":"Ustadz Amar","emoji":"🧑‍🦱","color":"#fbbf24","greeting":"Rumah Ilmu VI mengajarkan keberanian yang bijak.","snippet":"Amar makruf nahi mungkar dilakukan sesuai kemampuan: dengan tangan, lisan, atau hati. Hadis Abu Sa'id menjelaskan tiga tingkatannya."},"7":{"name":"Ustadz Syura","emoji":"🧑‍💼","color":"#2dd4bf","greeting":"Rumah Ilmu VII adalah rumah musyawarah.","snippet":"Musyawarah adalah jalan orang mukmin. QS asy-Syura 42:38 menyebut urusan mereka diputuskan dengan musyawarah."},"8":{"name":"Ustadz Adil","emoji":"🧑‍⚖️","color":"#f6c453","greeting":"Rumah Ilmu VIII adalah rumah keadilan dan kejujuran.","snippet":"Keadilan dan kejujuran adalah fondasi. QS al-Ma'idah 5:8 memerintahkan bersaksi dengan adil, dan hadis menjelaskan kejujuran membawa kebaikan."},"9":{"name":"Guru Pustaka","emoji":"🧑‍🏫","color":"#70c1ff","greeting":"","snippet":""},"10":{"name":"Guru Pustaka","emoji":"🧑‍🏫","color":"#70c1ff","greeting":"","snippet":""},"11":{"name":"Guru Pustaka","emoji":"🧑‍🏫","color":"#70c1ff","greeting":"","snippet":""},"12":{"name":"Guru Pustaka","emoji":"🧑‍🏫","color":"#70c1ff","greeting":"","snippet":""}},"npcs":[{"id":"mentor","name":"Ustadz Hakim","role":"Guru Pembimbing","emoji":"🧑‍🏫","color":"#f6c453","x":30,"y":24,"type":"mentor","greeting":"Assalamu'alaikum, Penjaga Hikmah. Selamat datang di Desa Nusantara.","snippet":"Di kelas X ada 12 bab. Bab IX–XII dapat dibuka melalui Papan Misi. Baca materi, latihan dan lulus untuk membuka bab berikutnya."},{"id":"t1","name":"Ustadzah Laila","role":"Guru Bab I","emoji":"🧕","color":"#34d399","x":11,"y":13,"type":"teacher","chapterId":1,"greeting":"Selamat datang di Rumah Ilmu kelas X Bab I.","snippet":"Al-Qur’an adalah wahyu Allah. Mari belajar pengertian, nama, dan penerapannya."},{"id":"t2","name":"Ustadz Fauzan","role":"Guru Bab II","emoji":"🧑‍🏫","color":"#38bdf8","x":25,"y":11,"type":"teacher","chapterId":2,"greeting":"Selamat datang di Rumah Ilmu kelas X Bab II.","snippet":"Mari belajar tentang turunnya wahyu dan pengumpulan mushaf."},{"id":"t3","name":"Ustadzah Maryam","role":"Guru Bab III","emoji":"👩‍🏫","color":"#4ade80","x":39,"y":13,"type":"teacher","chapterId":3,"greeting":"Selamat datang di Rumah Ilmu kelas X Bab III.","snippet":"Mari belajar keotentikan dan penjagaan al-Qur’an."},{"id":"t4","name":"Ustadz Ilham","role":"Guru Bab IV","emoji":"🧑‍🔬","color":"#a78bfa","x":53,"y":15,"type":"teacher","chapterId":4,"greeting":"Selamat datang di Rumah Ilmu kelas X Bab IV.","snippet":"Mari memahami mukjizat dan aspek kemukjizatan al-Qur’an."},{"id":"t5","name":"Ustadzah Rahma","role":"Guru Bab V","emoji":"🧕","color":"#fb7185","x":11,"y":35,"type":"teacher","chapterId":5,"greeting":"Selamat datang di Rumah Ilmu kelas X Bab V.","snippet":"Mari mempelajari kandungan al-Qur’an dalam berbagai aspek kehidupan."},{"id":"t6","name":"Ustadz Amar","role":"Guru Bab VI","emoji":"🧑‍🦱","color":"#fbbf24","x":25,"y":37,"type":"teacher","chapterId":6,"greeting":"Selamat datang di Rumah Ilmu kelas X Bab VI.","snippet":"Mari mempelajari struktur al-Qur’an dan cara mencari ayat."},{"id":"t7","name":"Ustadz Syura","role":"Guru Bab VII","emoji":"🧑‍💼","color":"#2dd4bf","x":39,"y":35,"type":"teacher","chapterId":7,"greeting":"Selamat datang di Rumah Ilmu kelas X Bab VII.","snippet":"Mari membedakan istilah hadis, sunah, khabar, dan atsar."},{"id":"t8","name":"Ustadz Adil","role":"Guru Bab VIII","emoji":"🧑‍⚖️","color":"#f6c453","x":53,"y":37,"type":"teacher","chapterId":8,"greeting":"Selamat datang di Rumah Ilmu kelas X Bab VIII.","snippet":"Mari mempelajari sejarah perkembangan dan pembukuan hadis."},{"id":"shop","name":"Bu Rina","role":"Pemilik Warung","emoji":"👩‍🍳","color":"#fb7185","x":46,"y":22,"type":"shop","greeting":"Selamat datang di Warung Bu Rina! Ada benih, nasi bungkus, dan buku hikmah.","snippet":"Belanja dengan bijak, ya. Benih untuk bertani, nasi untuk energi, dan buku untuk menambah ilmu."},{"id":"library","name":"Bu Pustakawan","role":"Pustakawan Desa","emoji":"👩‍🏫","color":"#a78bfa","x":22,"y":22,"type":"library","greeting":"Selamat datang di Perpustakaan Desa. Buku adalah jendela dunia.","snippet":"Di sini kamu bisa membaca buku bab, membeli Buku Hikmah, atau membaca buku yang sudah kamu beli."},{"id":"farmer","name":"Pak Tani","role":"Petani Desa","emoji":"👨‍🌾","color":"#4ade80","x":19,"y":25,"type":"farmer","greeting":"Assalamu'alaikum, anak muda. Mau belajar bertani?","snippet":"Tanam benih di lahan, siram, lalu tidur. Tanaman tumbuh setelah beberapa hari. Panen hasilnya dan jual di warung. Menanam pohon adalah sedekah jariyah."},{"id":"student","name":"Kak Rani","role":"Siswa Desa","emoji":"👧","color":"#38bdf8","x":28,"y":23,"type":"student","greeting":"Hai! Aku Kak Rani. Aku juga sedang belajar untuk ujian Rumah Ilmu.","snippet":"Kata Ustadz Hakim, lulus ujian itu bukan karena hafal semua, tapi karena paham dan bisa mengamalkan. Ayo semangat!"},{"id":"chief","name":"Pak Kades","role":"Kepala Desa","emoji":"🧑‍💼","color":"#f59e0b","x":34,"y":24,"type":"chief","greeting":"Selamat datang di Desa Nusantara. Desa ini maju karena ilmu dan akhlak.","snippet":"Jangan lupa jaga lingkungan dan sayangi sesama. Kalau ada waktu, bantu petani di lahan pertanian."},{"id": sakata, dan penandaan 'sudah dipahami'.","output":"Pemahaman konsep dasar dan kosakata kunci setiap bab.","principle":"Micro-learning, dual coding, dan cognitive load theory."},{"no":2,"name":"Latihan Terbimbing","game":"Lapangan Latihan","icon":"🎯","color":"#34d399","desc":"Latihan singkat dengan umpan balik langsung. Salah bukan kegagalan, melainkan informasi untuk memperbaiki pemahaman.","activity":"Kuis cepat, cocokkan makna, dan latihan soal dengan pembahasan.","output":"Skor latihan terbaik dan daftar konsep yang perlu diulang.","principle":"Retrieval practice, formative assessment, dan feedback loop."},{"no":3,"name":"Misi RPG","game":"Peta Misi","icon":"🗺️","color":"#a78bfa","desc":"Delapan pulau mewakili delapan bab. Siswa berperan sebagai Penjaga Hikmah, berdialog dengan NPC, dan mengambil keputusan yang berdampak pada nilai karakter.","activity":"Misi bercabang 3 tahap, poin hikmah, XP, lencana, dan peta kemajuan.","output":"Keputusan bermakna, refleksi nilai, dan kemajuan yang terlihat.","principle":"Game-based learning, self-determination theory, dan situated learning."},{"no":4,"name":"Simulasi Sosial","game":"Studio Madinah","icon":"🏙️","color":"#fb7185","desc":"Empat simulasi lintas bab menempatkan siswa pada masalah nyata: kas kelas, rapat OSIS, kampanye lingkungan, dan dakwah digital.","activity":"Role-play dengan konsekuensi, debrief, dan penerapan nilai.","output":"Laporan simulasi dan kemampuan memindahkan nilai ke konteks baru.","principle":"Problem-based learning, authentic assessment, dan transfer of learning."},{"no":5,"name":"Asesmen Penguasaan","game":"Menara Ujian","icon":"🏆","color":"#f59e0b","desc":"Ujian bos per bab dengan ambang penguasaan 80%. Jika belum mencapai, siswa mengulang dengan soal baru dan mendapat rekomendasi belajar.","activity":"Boss quiz 5 soal, remedial terarah, dan portofolio nilai.","output":"Status tuntas per bab dan bukti penguasaan (mastery evidence).","principle":"Mastery learning, criterion-referenced assessment, dan feedback."},{"no":6,"name":"Refleksi & Sertifikasi","game":"Buku Hikmah","icon":"📜","color":"#2dd4bf","desc":"Siswa menutup perjalanan dengan jurnal refleksi, penilaian diri, lencana, dan sertifikat. Guru memantau seluruh proses melalui dasbor kelas.","activity":"Jurnal refleksi, self-assessment, sertifikat, dan ekspor nilai.","output":"Portofolio refleksi, sertifikat, dan rekomendasi tindak lanjut guru.","principle":"Metacognition, self-assessment, dan teacher dashboard."}],"questionBank":{"1":[{"level":1,"type":"mcq","q":"Dalam diskusi asal kata al-Qur’an, kelompok A menyampaikan pendapat al-Lihyani tentang bacaan; kelompok B menjelaskan pendapat asy-Syafi’i bahwa al-Qur’an adalah nama khusus. Simpulan yang tepat ialah ...","options":["Kedua tokoh pasti menggunakan alasan yang sama.","Kedua pendapat berbeda pada asal penamaan, sehingga perlu dijelaskan sebagai pandangan masing-masing.","Perbedaan asal kata membuktikan keduanya membahas kitab yang berbeda.","Pendapat asy-Syafi’i menyatakan nama itu berasal dari kata membaca."],"answer":1,"explain":"Buku memuat beberapa pandangan etimologis yang perlu dibedakan.","source":"Buku kelas X hlm. 4–5","bloom":"C4","domain":1},{"level":1,"type":"mcq","q":"Siswa mengatakan, “Semua ulama dalam buku sepakat bahwa kata al-Qur’an berasal dari kata membaca.” Bagaimana menguji pernyataan itu?","options":["Hanya membaca pendapat al-Lihyani.","Menghitung jumlah halaman buku.","Membandingkan pendapat al-Lihyani dengan pendapat asy-Syafi’i yang menyebutnya nama khusus.","Menganggap seluruh perbedaan tidak relevan."],"answer":2,"explain":"Adanya pandangan asy-Syafi’i dalam buku membatasi klaim bahwa semua ulama sepakat.","source":"Buku kelas X hlm. 4–5","bloom":"C5","domain":1},{"level":1,"type":"mcq","q":"Menurut buku, al-Asy’ari menghubungkan nama al-Qur’an dengan penggabungan, sedangkan al-Farra’ mengaitkannya dengan indikator yang saling membenarkan. Apa perbedaan alasan mereka?","options":["Keduanya hanya menekankan bentuk mushaf cetak modern.","Al-Asy’ari menolak adanya hubungan antarbagian.","Al-Farra’ menyatakan al-Qur’an bukan nama kitab.","Al-Asy’ari menekankan keterhimpunan, sementara al-Farra’ menekankan hubungan yang saling membenarkan."],"answer":3,"explain":"Perbandingan didasarkan pada alasan yang dikemukakan masing-masing dalam buku.","source":"Buku kelas X hlm. 4–5","bloom":"C4","domain":1},{"level":1,"type":"mcq","q":"Sebuah poster hanya menyebut satu pendapat asal kata dan menuliskan “tidak ada pendapat lain”. Revisi terbaik ialah ...","options":["Menjelaskan bahwa itu satu pandangan dan menambahkan ringkasan pendapat lain yang tercantum dalam buku.","Menghapus nama tokoh agar sulit diperiksa.","Menyatakan seluruh tokoh pasti sepakat.","Mencampur alasan para tokoh tanpa penjelasan."],"answer":0,"explain":"Perbedaan pendapat harus direpresentasikan secara akurat.","source":"Buku kelas X hlm. 4–5","bloom":"C5","domain":1},{"level":1,"type":"mcq","q":"Kelompok membandingkan pandangan az-Zujaj tentang kumpulan dengan pandangan al-Lihyani tentang bacaan. Pernyataan mana paling tepat?","options":["Keduanya pasti mengajukan argumen identik.","Keduanya menyoroti aspek kebahasaan yang berbeda dalam menjelaskan penamaan.","Perbedaan itu berarti al-Qur’an tidak dapat dibaca.","Kumpulan dan bacaan harus menjadi dua kitab berbeda."],"answer":1,"explain":"Buku menyajikan beberapa sudut pandang etimologis, bukan meniadakan salah satunya.","source":"Buku kelas X hlm. 4–5","bloom":"C4","domain":1},{"level":1,"type":"mcq","q":"Saat diskusi ada dua pendapat tentang asal kata yang berbeda. Cara paling bertanggung jawab menyajikannya ialah ...","options":["Memilih kutipan yang terpotong agar lawan tampak salah.","Mengatribusi kedua pendapat kepada satu tokoh.","Menyebut tokoh, inti alasan, dan sumber masing-masing tanpa mengubah isi pendapat.","Menghilangkan sumber perbedaan."],"answer":2,"explain":"Atribusi dan alasan yang akurat memungkinkan pembaca membandingkan pendapat.","source":"Buku kelas X hlm. 4–5","bloom":"C5","domain":1},{"level":2,"type":"mcq","q":"Definisi Khudari Beik menekankan bahasa Arab, tujuan dipahami, penyampaian mutawatir, dan mushaf; definisi Subhi Saleh menyebut mukjizat serta ibadah membacanya. Simpulan terbaik ialah ...","options":["Keduanya bertentangan karena tidak menggunakan kalimat identik.","Unsur yang tidak disebut satu definisi pasti ditolak penulisnya.","Kedua definisi menonjolkan unsur berbeda yang dapat dibandingkan dan saling melengkapi.","Keduanya tidak membahas al-Qur’an."],"answer":2,"explain":"Perbedaan penekanan tidak otomatis berarti pertentangan.","source":"Buku kelas X hlm. 6–7","bloom":"C4","domain":2},{"level":2,"type":"mcq","q":"Siswa menemukan terjemahan makna al-Qur’an dalam bahasa Indonesia dan menyebutnya identik dengan lafaz Arab dalam definisi buku. Apa yang perlu diperjelas?","options":["Terjemahan selalu tidak berguna untuk memahami.","Bahasa terjemahan otomatis menjadi lafaz Arab.","Mushaf tidak memiliki teks Arab.","Terjemahan membantu memahami makna, tetapi berbeda dari lafaz Arab al-Qur’an yang diterjemahkan."],"answer":3,"explain":"Buku menyebut lafaz berbahasa Arab; terjemahan merupakan penyampaian makna dalam bahasa lain.","source":"Buku kelas X hlm. 6–7","bloom":"C4","domain":2},{"level":2,"type":"mcq","q":"Seorang siswa menyusun definisi al-Qur’an tetapi hanya menyebut “buku yang dibaca”. Apa perbaikan paling tepat?","options":["Menambahkan unsur wahyu Allah kepada Nabi Muhammad dan unsur penting lain yang dijelaskan buku.","Menghapus semua ciri khusus agar lebih singkat.","Menganggap setiap buku yang dibaca adalah al-Qur’an.","Menyatakan kitab itu karya pengumpulnya."],"answer":0,"explain":"Definisi yang terlalu umum tidak membedakan al-Qur’an dari bacaan lain.","source":"Buku kelas X hlm. 6–7","bloom":"C5","domain":2},{"level":2,"type":"mcq","q":"Sebuah ringkasan menyatakan “mutawatir berarti satu orang saja yang menyampaikan seluruh riwayat”. Mengapa ringkasan itu harus diperbaiki?","options":["Mutawatir berarti tidak ada periwayatan.","Mutawatir merujuk periwayatan melalui banyak perawi pada setiap tingkatan, bukan hanya satu orang.","Satu orang selalu cukup untuk memenuhi makna mutawatir.","Mutawatir hanya berarti ditulis dengan huruf besar."],"answer":1,"explain":"Penyampaian mutawatir tidak sama dengan penyampaian oleh satu perawi.","source":"Buku kelas X hlm. 6–7; pengertian mutawatir memerlukan pendalaman guru","bloom":"C4","domain":2},{"level":2,"type":"mcq","q":"Seorang siswa menekankan hafalan, temannya menekankan penulisan dalam mushaf. Bagaimana menghubungkan keduanya dengan definisi dalam buku?","options":["Hafalan otomatis meniadakan mushaf.","Mushaf membuktikan hafalan tidak pernah ada.","Keduanya menggambarkan cara yang disebut buku dalam pemeliharaan dan penyampaian al-Qur’an.","Keduanya tidak berkaitan dengan pemeliharaan."],"answer":2,"explain":"Buku menyebut mushaf dan hafalan sebagai unsur yang terkait dengan terpeliharanya al-Qur’an.","source":"Buku kelas X hlm. 6–7","bloom":"C4","domain":2},{"level":2,"type":"mcq","q":"Tim ingin membuat kartu pembelajaran tentang definisi al-Qur’an. Rancangan yang paling tepat ialah ...","options":["Menyebut semua bacaan sebagai wahyu.","Menghilangkan penerima wahyu dan sumber definisi.","Menyalin satu frasa tanpa memahami maksudnya.","Menyebut beberapa unsur utama dan memberi rujukan, serta membedakan teks Arab dari terjemahan."],"answer":3,"explain":"Kartu yang jelas dan dapat ditelusuri membantu pemahaman definisi.","source":"Buku kelas X hlm. 6–7","bloom":"C5","domain":2},{"level":3,"type":"mcq","q":"Kelas membuat poster tentang nama al-Furqan. Pesan yang paling sesuai dengan makna nama itu adalah ...","options":["Setiap pendapat pribadi otomatis benar.","Perbedaan pendapat tidak perlu dipelajari.","Nama al-Furqan hanya menunjukkan urutan halaman mushaf.","Gunakan petunjuk untuk membedakan yang benar dan yang batil secara bertanggung jawab."],"answer":3,"explain":"Buku menjelaskan al nswer":0,"explain":"Durasi mendekati 23 tahun dapat diringkas sebagai sekitar 23 tahun, tetapi rinciannya perlu diperiksa.","source":"Buku kelas X hlm. 17, 21","bloom":"C4","domain":1},{"level":1,"type":"mcq","q":"Dalam presentasi, kelompok ingin menjelaskan bahwa wahyu diturunkan berangsur. Bagaimana penyajian yang paling tepat?","options":["Menganggap seluruh ayat diterima Nabi dalam satu hari.","Membedakan permulaan wahyu dan proses turunnya ayat sepanjang masa kenabian, dengan sumber yang jelas.","Tidak membedakan peristiwa pertama dari proses berikutnya.","Menyatakan urutan mushaf selalu identik dengan urutan turunnya tanpa bukti."],"answer":1,"explain":"Penurunan kepada Nabi dijelaskan berlangsung bertahap; urutan mushaf tidak otomatis urutan turunnya.","source":"Buku kelas X hlm. 17–18","bloom":"C5","domain":1},{"level":1,"type":"mcq","q":"Kelas membaca pendapat yang dikritik oleh Subhi Saleh dalam buku. Apa cara menyajikannya yang paling adil?","options":["Menuliskan bahwa tidak ada ulama yang berbeda pendapat.","Mengubah kritik menjadi kesepakatan.","Menyebut pendapat dan keberatannya sebagai pandangan yang berbeda tanpa menyembunyikan perbedaan.","Menghilangkan sumber dan alasan."],"answer":2,"explain":"Penyajian perbedaan perlu jelas tentang siapa menyatakan apa.","source":"Buku kelas X hlm. 17","bloom":"C5","domain":1},{"level":2,"type":"mcq","q":"Kelompok mengurutkan peristiwa: wahyu awal diterima, para sahabat menghafal dan menulis, kemudian dilakukan pengumpulan pada masa Abu Bakar. Mengapa urutan ini penting?","options":["Semua peristiwa terjadi pada satu saat yang sama.","Pengumpulan berarti wahyu baru dimulai setelah Nabi wafat.","Urutan membantu membedakan penerimaan wahyu dari usaha pemeliharaan dan pengumpulan setelahnya.","Hafalan tidak berperan pada masa Nabi."],"answer":2,"explain":"Proses penerimaan, penulisan, dan pengumpulan berlangsung pada tahap yang berbeda.","source":"Buku kelas X hlm. 17–19","bloom":"C4","domain":2},{"level":2,"type":"mcq","q":"Sebuah infografik menulis bahwa wahyu pertama dalam buku adalah al-‘Alaq 1–5, lalu menambahkan tanggal tepat tanpa menunjukkan rujukan. Apa yang perlu diperbaiki?","options":["Tanggal apa pun boleh dipastikan tanpa sumber.","Hapus semua rujukan agar infografik ringkas.","Anggap surah pertama dalam mushaf selalu wahyu pertama.","Cantumkan sumber tanggal dan bedakan informasi yang didukung buku dari klaim tambahan."],"answer":3,"explain":"Klaim tambahan memerlukan rujukan dan tidak boleh disamakan dengan susunan mushaf.","source":"Buku kelas X hlm. 17–18","bloom":"C5","domain":2},{"level":2,"type":"mcq","q":"Siswa menganggap karena al-Fatihah berada di awal mushaf, surah itu pasti yang pertama turun. Mengapa kesimpulannya lemah?","options":["Urutan penempatan dalam mushaf tidak dengan sendirinya menunjukkan urutan turunnya wahyu.","Semua urutan buku selalu sama dengan urutan peristiwa.","Letak di mushaf membuktikan tanggal turun.","Penurunan wahyu tidak memiliki sejarah."],"answer":0,"explain":"Buku menyebut al-‘Alaq 1–5 sebagai wahyu pertama, berbeda dari urutan awal mushaf.","source":"Buku kelas X hlm. 7, 17–18","bloom":"C4","domain":2},{"level":2,"type":"mcq","q":"Seorang siswa ingin menulis kisah wahyu pertama berdasarkan buku. Cara paling bertanggung jawab ialah ...","options":["Mengarang dialog tambahan dan menyebutnya fakta pasti.","Menyebut Gua Hira, Jibril dan al-‘Alaq 1–5 sesuai buku, serta menghindari menambah rincian tanpa sumber.","Mengganti lokasi tanpa alasan.","Menghapus perbedaan antara riwayat dan pendapat pribadi."],"answer":1,"explain":"Ringkasan sejarah harus sesuai sumber dan membedakan tambahan interpretasi.","source":"Buku kelas X hlm. 16–18","bloom":"C5","domain":2},{"level":2,"type":"mcq","q":"Buku menyebut tanda-tanda sebelum wahyu, termasuk mimpi yang benar. Siswa menyimpulkan semua mimpi siapa pun adalah wahyu. Apa kelemahannya?","options":["Semua mimpi otomatis menjadi wahyu kenabian.","Riwayat khusus selalu berlaku sama bagi setiap orang.","Ia menggeneralisasi riwayat khusus tentang Nabi kepada semua orang tanpa dasar.","Konteks kisah tidak memengaruhi penafsiran."],"answer":2,"explain":"Keterangan khusus dalam riwayat tidak membenarkan generalisasi demikian.","source":"Buku kelas X hlm. 18","bloom":"C4","domain":2},{"level":2,"type":"mcq","q":"Untuk mengajarkan penurunan bertahap, guru memilih antara garis waktu berlabel sumber dan daftar acak tanpa penanda. Mengapa garis waktu lebih membantu?","options":["Garis waktu menjamin seluruh tanggal tanpa penelitian.","Daftar acak selalu menunjukkan urutan yang jelas.","Rujukan tidak diperlukan jika ada gambar.","Urutan dan rujukan membantu siswa melihat hubungan peristiwa sekaligus memeriksa sumbernya."],"answer":3,"explain":"Visualisasi kronologi membantu analisis bila rincian dan sumbernya dijelaskan.","source":"Buku kelas X hlm. 17–18","bloom":"C5","domain":2},{"level":3,"type":"mcq","q":"Siswa menyatakan bahwa pada masa Nabi al-Qur’an hanya dihafal dan tidak pernah ditulis. Bukti dari buku yang membantah klaim itu ialah ...","options":["Buku menyebut penulisan baru ditemukan pada masa percetakan.","Buku menyebut tidak seorang pun menghafal.","Buku menyatakan semua catatan sudah menjadi satu mushaf cetak.","Buku menyebut para sahabat juga menulis pada bahan yang tersedia meski hafalan sangat berperan."],"answer":3,"explain":"Menurut buku, hafalan dan tulisan yang masih terpisah sama-sama berperan pada masa Nabi.","source":"Buku kelas X hlm. 18","bloom":"C4","domain":3},{"level":3,"type":"mcq","q":"Seorang kelompok membuat model sejarah dengan menulis bahwa wahyu dahulu dicatat pada pelepah kurma, kulit, dan bahan lain. Apa yang perlu ditambahkan agar tidak menyesatkan?","options":["Jelaskan bahwa catatan masih terpisah dan hafalan para sahabat juga berperan.","Klaim semua catatan telah menjadi mushaf cetak modern.","Hapus peran hafalan dari penjelasan.","Pastikan setiap sahabat menulis pada bahan yang persis sama."],"answer":0,"explain":"Buku menggambarkan penggunaan beragam bahan dan peran besar hafalan.","source":"Buku kelas X hlm. 18","bloom":"C5","domain":3},{"level":3,"type":"mcq","q":"Dua sumber menjelaskan media penulisan pada masa Nabi dengan daftar bahan berbeda. Langkah analisis yang tepat ialah ...","options":["Menyatakan kedua sumber pasti palsu.","Memeriksa konteks dan sumber masing-masing; daftar berbeda belum otomatis saling meniadakan.","Menganggap satu bahan yang disebut pasti satu-satunya bahan.","Menghapus seluruh sumber agar tidak ada perbedaan."],"answer":1,"explain":"Daftar contoh yang berbeda dapat bersifat saling melengkapi; kualitas sumber tetap perlu diperiksa.","source":"Buku kelas X hlm. 18","bloom":"C4","domain":3},{"level":3,"type":"mcq","q":"Sebuah poster menunjukkan satu lembar catatan dan menyatakan bahwa seluruh al-Qur’an pasti telah terkumpul dalam satu jilid pada masa Nabi. Apa kekurangan buktinya?","options":["Satu lembar selalu mewakili seluruh arsip.","Penulisan berarti pencetakan massal.","Satu contoh catatan tidak membuktikan bentuk dan kelengkapan seluruh kumpulan pada masa itu.","Bentuk kumpulan tidak perlu dibedakan dari satu catatan."],"answer":2,"explain":"Keberadaan catatan dan keadaan keseluruhan kumpulan merupakan klaim berbeda.","source":"Buku kelas X hlm. 18–19","bloom":"C4","domain":3},{"level":3,"type":"mcq","q":"Untuk membandingkan peran hafalan dan tulisan pada masa Nabi, pertanyaan penelitian paling relevan adalah ...","options":["Bahan mana yang warnanya paling menarik?","Berapa pengikut akun pembuat poster?","Mengapa semua sahabat pasti memakai media yang identik?","Bagaimana kedua cara itu membantu para sahabat menyimpan dan menyampaikan wahyu menurut sumber?"],"answer":3,"explain":"Pertanyaan tersebut langsung mengkaji fungsi dua cara pemeliharaan yang disebut buku.","source":"Buku kelas X hlm. 18","bloom":"C5","domain":3},{"level":3,"type":"mcq","q":"Siswa melihat ungkapan “hafalan lebih berperan daripada tulisan” dan menyimpulkan tulisan tidak memiliki peran sama sekali. Tanggapan paling tepat ialah ...","options":["Peran lebih besar tidak berarti cara lain tidak digunakan.","Lebih besar selalu berarti satu-satunya.","Tulisan dan hafalan pasti tidak dapat digunakan bersama.","Buku tidak menyebut adanya catatan."],"answer":0,"explain":"Perbandingan kadar peran berbeda dari klaim bahwa peran lain tidak ada.","source":"Buku kelas X hlm. 18","bloom":"C4","domain":3},{"level":4,"type":"mcq","q":"Setelah banyak penghafal wafat dalam peperangan, Umar mengusulkan pengumpulan catatan kepada Abu Bakar. Hubungan sebab dan tindakan yang paling tepat ialah ...","options":["Kekhawatiran kehilangan bagian yang tersebar mendorong upaya pengumpulan.","Pengumpulan dilakukan karena wahyu baru sedang turun kepada Abu Bakar.","Peperangan membuktikan tidak pernah ada hafalan.","Usulan itu bertujuan mengganti isi wahyu."],"answer":0,"explain":"Buku menghubungkan gugurnya penghafal dengan kekhawatiran dan usulan pengumpulan.","source":"Buku kelas X hlm. 18–19","bloom":"C4","domain":4},{"level":4,"type":"mcq","q":"Ketika membuat komik sejarah, siswa menggambarkan Abu Bakar langsung menyetujui usulan Umar tanpa diskusi. Apa koreksi menurut buku?","options":["Buku menyatakan Umar tidak pernah mengusulkan.","Buku menceritakan Abu Bakar awalnya keberatan, lalu menerima setelah Umar terus mengemukakan pandangan.","Buku menyatakan Abu Bakar tidak pernah berubah sikap.","Buku tidak menyebut adanya pengumpulan."],"answer":1,"explain":"Alur dalam buku mencakup keberatan awal, pembahasan, dan penerimaan.","source":"Buku kelas X hlm. 18–19","bloom":"C5","domain":4},{"level":4,"type":"mcq","q":"Sebuah bagan mencatat kumpulan pada masa Abu Bakar kemudian berada pada Umar dan Hafsah. Fungsi bagan tersebut ialah ...","options":["Membuktikan semua salinan berikutnya tidak pernah dibuat.","Menunjukkan turunnya wahyu baru setelah Nabi wafat.","Menunjukkan alur penyimpanan naskah menurut uraian buku.","Menggantikan kebutuhan membaca sumber sejarah."],"answer":2,"explain":"Buku menjelaskan perpindahan penyimpanan dari Abu Bakar ke Umar lalu Hafsah.","source":"Buku kelas X hlm. 19","bloom":"C4","domain":4},{"level":4,"type":"mcq","q":"Seorang siswa berkata pengumpulan pada masa Abu Bakar berarti sebelumnya tidak ada catatan wahyu sama sekali. Mengapa klaim itu tidak sesuai buku?","options":["Pengumpulan selalu berarti menciptakan teks baru.","Catatan terpisah mustahil dikumpulkan.","Tidak ada seorang pun yang mencatat pada masa Nabi.","Buku menyatakan catatan sebelumnya sudah ada tetapi masih terpisah-pisah."],"answer":3,"explain":"Mengumpulkan catatan yang sudah ada berbeda dari membuat wahyu baru.","source":"Buku kelas X hlm. 18–19","bloom":"C4","domain":4},{"level":4,"type":"mcq","q":"Dalam presentasi tentang Zaid bin Tsabit, informasi apa yang paling relevan untuk menjelaskan perannya menurut buku?","options":["Ia ditugasi menuliskan ulang dan mengumpulkan catatan al-Qur’an pada masa Abu Bakar.","Ia menerima wahyu baru setelah Nabi wafat.","Ia seorang diri membuat seluruh wahyu.","Ia menolak semua bentuk pencatatan selamanya."],"answer":0,"explain":"Buku menyebut penugasan Zaid dalam upaya pengumpulan.","source":"Buku kelas X hlm. 19","bloom":"C5","domain":4},{"level":4,"type":"mcq","q":"Dua catatan sejarah sama-sama menyebut pengumpulan pada masa Abu Bakar, tetapi rincian prosedurnya berbeda. Apa langkah yang tepat sebelum menentukan kesimpulan rinci?","options":["Memastikan rincian tanpa membaca sumber.","Memeriksa riwayat dan penjelasan sumber yang dapat dipertanggungjawabkan, lalu menyebut perbedaannya.","Mengabaikan semua catatan sejarah.","Mengubah rincian agar sesuai dugaan sendiri."],"answer":1,"explain":"Rincian sejarah memerlukan pemeriksaan sumber dan pengakuan atas perbedaan.","source":"Buku kelas X hlm. 18–19; pendalaman sumber diperlukan","bloom":"C5","domain":4},{"level":5,"type":"mcq","q":"Tim membuat tabel tujuan pengumpulan Abu Bakar dan usaha Utsman. Pasangan yang paling sesuai dengan uraian buku adalah ...","options":["Abu Bakar: mencetak mushaf digital; Utsman: menerima wahyu baru.","Abu Bakar: menghimpun catatan; Utsman: penyeragaman mushaf untuk meredakan perselisihan bacaan.","Abu Bakar: menghapus semua hafalan; Utsman: menghentikan pembelajaran.","Keduanya bertujuan menambahkan surah baru."],"answer":1,"explain":"Buku membedakan perhatian terhadap penghimpunan dan kebutuhan penyatuan mushaf.","source":"Buku kelas X hlm. 19–20","bloom":"C4","domain":5},{"level":5,"type":"mcq","q":"Siswa menyimpulkan bahwa pekerjaan Utsman tidak terkait dengan pengumpulan sebelumnya. Apa yang perlu ditinjau?","options":["Buku menyatakan tidak ada naskah sebelumnya.","Utsman menerima wahyu secara langsung.","Buku menyebut mushaf yang disimpan Hafsah digunakan lalu dikembalikan setelah penyalinan.","Pekerjaan Utsman dilakukan sebelum masa Nabi."],"answer":2,"explain":"Uraian buku menghubungkan mushaf Hafsah dengan proses penyalinan pada masa Utsman.","source":"Buku kelas X hlm. 19","bloom":"C4","domain":5},{"level":5,"type":"mcq","q":"Dalam perdebatan, seseorang mengatakan semua perbedaan bacaan pasti merupakan kesalahan yang disengaja. Tanggapan paling bertanggung jawab ialah ...","options":["Semua perbedaan selalu bukti niat buruk.","Tidak perlu membedakan bacaan yang diakui dan kesalahan penyalinan.","Setiap perbedaan dapat diputuskan tanpa ilmu.","Jangan menggeneralisasi; rincian bacaan dan sejarahnya perlu diperiksa bersama sumber dan guru."],"answer":3,"explain":"Topik ragam bacaan memerlukan penjelasan ahli dan tidak boleh direduksi menjadi tuduhan.","source":"Buku kelas X hlm. 19–20; perlu pendalaman qiraat","bloom":"C5","domain":5},{"level":5,"type":"mcq","q":"Poster sejarah menyatakan Utsman menulis semua mushaf sendirian. Apa perbaikan sesuai buku?","options":["Sebutkan adanya tim yang ditugasi, termasuk Zaid bin Tsabit dan anggota lain.","Hapus seluruh nama tim.","Nyatakan tidak ada proses penyalinan.","Ganti tim dengan tokoh yang tidak disebut sumber."],"answer":0,"explain":"Buku menyebut Zaid dan tiga anggota lain dalam tim penulisan.","source":"Buku kelas X hlm. 19","bloom":"C5","domain":5},{"level":5,"type":"mcq","q":"Mengapa buku menilai penyatuan mushaf pada masa Utsman terkait persatuan?","options":["Karena seluruh perbedaan bahasa di dunia hilang.","Upaya itu diarahkan untuk mengurangi perselisihan yang timbul terkait perbedaan bacaan.","Karena semua masyarakat berhenti belajar.","Karena sebelumnya tidak ada wahyu yang dihafal."],"answer":1,"explain":"Buku menghubungkan penyeragaman mushaf dengan pencegahan pertengkaran.","source":"Buku kelas X hlm. 19–20","bloom":"C4","domain":5},{"level":5,"type":"mcq","q":"Kelompok ingin mempresentasikan pengumpulan al-Qur’an. Rancangan mana yang paling membantu analisis?","options":["Mencampur semua peristiwa tanpa urutan.","Hanya menampilkan satu nama tanpa menjelaskan peran.","Membandingkan konteks, tujuan, tokoh, dan hasil tiap fase sambil mencantumkan sumber.","Menyajikan kesimpulan tanpa membedakan masa."],"answer":2,"explain":"Perbandingan antarfase menjelaskan kesinambungan dan perbedaan tujuan.","source":"Buku kelas X hlm. 18–20","bloom":"C5","domain":5}],"3":[{"level":1,"type":"mcq","q":"Dalam diskusi QS al-Hijr 15:9, siswa A menyatakan bahwa umat Islam meyakini Allah menjaga al-Qur’an; siswa B menganggap keyakinan tersebut berarti manusia tidak perlu memeriksa cetakan. Penilaian yang tepat ialah ...","options":["Keyakinan membuat pemeriksaan cetakan terlarang.","Keyakinan atas penjagaan Allah dapat berjalan bersama upaya manusia memeriksa dan memperbaiki kesalahan cetak.","Setiap kesalahan cetak membuktikan tidak ada upaya penjagaan.","Manusia harus menerima semua cetakan tanpa membaca."],"answer":1,"explain":"Buku mengaitkan keyakinan penjagaan dengan hafalan, penelitian, dan pemeriksaan cetakan.","source":"QS al-Hijr 15:9; buku kelas X hlm. 25–28","bloom":"C4","domain":1},{"level":1,"type":"mcq","q":"Kelas membuat peta konsep keotentikan. Hubungan yang paling sesuai dengan materi ialah ...","options":["Menghapus seluruh peran manusia dari sejarah.","Menyamakan seluruh berita tentang kesalahan cetak dengan perubahan wahyu.","Keyakinan atas penjagaan Allah dihubungkan dengan upaya hafalan dan pemeriksaan mushaf.","Menolak pemeriksaan sumber karena ada keyakinan."],"answer":2,"explain":"Peta konsep sebaiknya menunjukkan keyakinan sekaligus cara pemeliharaan yang dibahas buku.","source":"QS al-Hijr 15:9; buku kelas X hlm. 26–29","bloom":"C5","domain":1},{"level":1,"type":"mcq","q":"Seorang siswa melihat satu halaman buku yang salah cetak, lalu menyimpulkan semua mushaf di dunia berubah. Apa kelemahan argumennya?","options":["Satu halaman selalu mewakili semua cetakan.","Kesalahan cetak tidak mungkin terjadi.","Klaim tentang seluruh mushaf tidak perlu bukti.","Kesalahan pada satu cetakan tidak cukup membuktikan perubahan pada seluruh mushaf."],"answer":3,"explain":"Perlu membedakan kesalahan satu salinan dari klaim tentang keseluruhan teks.","source":"Buku kelas X hlm. 28","bloom":"C4","domain":1},{"level":1,"type":"mcq","q":"Unggahan menyebut “ada perbedaan pada halaman mushaf”, tetapi fotonya terpotong dan tidak mencantumkan penerbit. Langkah awal paling tepat ialah ...","options":["Memeriksa foto utuh dan membandingkan dengan mushaf tepercaya sebelum menarik kesimpulan.","Menganggap unggahan pasti benar karena viral.","Menyebarkannya dengan tuduhan tanpa pemeriksaan.","Menghapus bukti agar tidak ada pertanyaan."],"answer":0,"explain":"Verifikasi konteks, sumber, dan pembanding mencegah kesimpulan terburu-buru.","source":"Buku kelas X hlm. 28; praktik pemeriksaan","bloom":"C5","domain":1},{"level":1,"type":"mcq","q":"Siswa menyebut “keotentikan” hanya berarti sampul mushaf selalu sama di semua penerbit. Mengapa ini kurang tepat?","options":["Sampul berbeda otomatis mengubah seluruh isi.","Keotentikan teks tidak ditentukan oleh kesamaan sampul atau desain cetakan.","Semua penerbit wajib memakai warna sampul sama.","Isi teks tidak relevan untuk pemeriksaan."],"answer":1,"explain":"Bentuk fisik cetakan dan keaslian teks adalah hal yang berbeda.","source":"Buku kelas X hlm. 26–28","bloom":"C4","domain":1},{"level":1,"type":"mcq","q":"Tim ingin menjelaskan hubungan keyakinan dan penelitian sejarah secara jujur. Rancangan mana paling baik?","options":["Menyatakan semua kesimpulan sejarah tidak memerlukan sumber.","Mencampurkan dugaan pribadi dengan kutipan tanpa penanda.","Menyebut ajaran ayat sebagai dasar keyakinan dan menjelaskan bukti sejarah sebagai bahan kajian yang dapat ditelaah.","Melarang pertanyaan tentang metode pemeriksaan."],"answer":2,"explain":"Membedakan jenis dasar klaim membantu pembaca memahami dan menelaahnya.","source":"QS al-Hijr 15:9; buku kelas X hlm. 25–28","bloom":"C5","domain":1},{"level":2,"type":"mcq","q":"Tabel kelompok memasangkan QS Hud 11:13 dengan tantangan satu surah dan QS al-Baqarah 2:23 dengan sepuluh surah. Bagaimana memperbaikinya?","options":["Pertahankan karena keduanya memuat jumlah yang sama.","Ganti keduanya dengan nomor surah tanpa memeriksa.","Tukar pasangan: Hud 11:13 sepuluh surah dan al-Baqarah 2:23 satu surah.","Hapus jumlah dari seluruh penjelasan."],"answer":2,"explain":"Buku menjelaskan tantangan sepuluh surah dalam Hud dan satu surah dalam al-Baqarah.","source":"QS Hud 11:13 dan al-Baqarah 2:23; buku kelas X hlm. 27","bloom":"C5","domain":2},{"level":2,"type":"mcq","q":"Seorang siswa menyamakan seluruh tantangan al-Qur’an dalam buku dan mengatakan tidak ada perbedaan cakupan. Apa yang terlewat?","options":["Buku hanya menyebut tantangan menerbitkan buku.","Seluruh ayat menyebut jumlah surah yang sama.","Tantangan tidak memiliki kaitan dengan tuduhan dalam materi.","Buku menyajikan tantangan membuat semisal al-Qur’an, sepuluh surah, dan satu surah."],"answer":3,"explain":"Ayat-ayat yang dibahas memiliki cakupan tantangan yang berbeda.","source":"QS at-Tur 52:33–34, Hud 11:13, al-Baqarah 2:23; buku hlm. 26–27","bloom":"C4","doma function defaultState() {
  return {
    version: 1,
    playerName: 'Penjaga Hikmah',
    player: { x: START.x, y: START.y, dir: 'down', anim: 0 },
    stats: { xp: 0, energy: 100, coins: 50 },
    inventory: { seed: 3, food: 1, book: 0, crop: 0, water: 0 },
    exams: {}, latihan: {}, reflections: {}, reviews: {}, unlocked: 1, day: 1, time: 6 * 60,
    farm: Array.from({ length: 6 }, () => ({ planted: false, watered: false, growth: 0, ready: false })),
    talked: {}, read: {},
    quests: { planted: 0, harvested: 0, talked: 0, booksRead: 0, booksUsed: 0, examsPassed: 0, claimed: {}, notified: {} },
    flags: { tutorial: false, final: false },
    settings: { sound: true }
  };
}
function mergeState(parsed) {
  const def = defaultState();
  const s = Object.assign({}, def, parsed || {});
  s.playerName = (parsed && parsed.playerName) || def.playerName;
  s.player = Object.assign({}, def.player, (parsed && parsed.player) || {});
  s.stats = Object.assign({}, def.stats, (parsed && parsed.stats) || {});
  s.inventory = Object.assign({}, def.inventory, (parsed && parsed.inventory) || {});
  s.quests = Object.assign({}, def.quests, (parsed && parsed.quests) || {});
  s.quests.claimed = Object.assign({}, def.quests.claimed, (parsed && parsed.quests && parsed.quests.claimed) || {});
  s.quests.notified = Object.assign({}, def.quests.notified, (parsed && parsed.quests && parsed.quests.notified) || {});
  s.flags = Object.assign({}, def.flags, (parsed && parsed.flags) || {});
  s.settings = Object.assign({}, def.settings, (parsed && parsed.settings) || {});
  s.exams = (parsed && parsed.exams) || {};
  s.latihan = (parsed && parsed.latihan) || {};
  s.reflections = (parsed && parsed.reflections) || {};
  s.reviews = (parsed && parsed.reviews) || {};
  s.talked = (parsed && parsed.talked) || {};
  s.read = (parsed && parsed.read) || {};
  s.farm = Array.isArray(parsed && parsed.farm) && parsed.farm.length === 6 ? parsed.farm : def.farm;
  if (!s.player.x || !s.player.y || s.player.x < 0 || s.player.y < 0) { s.player.x = START.x; s.player.y = START.y; }
  s.unlocked = computeUnlocked(s);
  s.quests.examsPassed = Object.values(s.exams).filter(e => e && e.passed).length;
  return s;
}
function saveGame(silent = true) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  if (!silent) toast('Permainan disimpan.');
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    state = mergeState(JSON.parse(raw));
    return true;
  } catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function getSavedName() { try { const raw = localStorage.getItem(SAVE_KEY); if (!raw) return ''; const p = JSON.parse(raw); return p.playerName || ''; } catch (e) { return ''; } }
function newGame() { state = defaultState(); saveGame(true); }
function computeUnlocked(s = state) {
  let u = 1;
  for (let i = 1; i <= GAME_DATA.chapters.length; i++) if (s.exams[i] && s.exams[i].passed) u = Math.min(GAME_DATA.chapters.length, i + 1);
  return u;
}
function isUnlocked(id) { return Number(id) <= (state.unlocked || 1); }
function computeExamsPassed() { return Object.values(state.exams).filter(e => e && e.passed).length; }
function nextChapter() { return GAME_DATA.chapters.find(c => !(state.exams[c.id] && state.exams[c.id].passed)) || null; }
function levelInfo() {
  const level = Math.floor(state.stats.xp / 200) + 1;
  return { level, into: state.stats.xp % 200, need: 200, maxEnergy: 100 + (level - 1) * 10, title: LEVEL_TITLES[Math.min(level - 1, LEVEL_TITLES.length - 1)] };
}
function addXp(n) {
  if (!n) return;
  const before = levelInfo().level;
  state.stats.xp += n;
  const after = levelInfo().level;
  if (after > before) {
    state.stats.energy = levelInfo().maxEnergy;
    toast(`🎉 Naik level! Level ${after} · ${levelInfo().title}`);
    confetti(60); sfx('level');
  }
  saveGame(true); renderHUD();
}
function addCoins(n) { state.stats.coins += n; saveGame(true); renderHUD(); }
function spendCoins(n) { if (state.stats.coins < n) return false; state.stats.coins -= n; saveGame(true); renderHUD(); return true; }
function getObjective() {
  if (!state.talked['mentor']) return 'Bicara dengan Ustadz Hakim di plaza';
  const next = nextChapter();
  if (next) return `Lulus ujian ${next.bab} di ${next.island}`;
  return 'Semua ujian lulus! Jelajahi desa dan panen hasil.';
}
function getObjectiveTarget() {
  if (!state.talked['mentor']) { const m = npcs.find(n => n.id === 'mentor'); return m ? { x: m.px, y: m.py } : null; }
  const next = nextChapter();
  if (next) { const b = buildings.find(x => x.chapterId === next.id); return b ? { x: (b.doorX + 0.5) * TILE, y: (b.doorY + 1.5) * TILE } : null; }
  return { x: board.x, y: board.y };
}

/* ---------------- Toast / confetti / sound ---------------- */
function toast(msg) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
function confetti(n = 50) {
  const root = $('#confetti-root'); if (!root) return;
  const colors = ['#f6c453', '#34d399', '#38bdf8', '#fb7185', '#a78bfa', '#ffe6a8'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    root.appendChild(p);
    setTimeout(() => p.remove(), 3800);
  }
}
function sfx(kind) {
  if (!state || !state.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'ok' ? [523, 659] : kind === 'no' ? [220, 180] : kind === 'level' ? [523, 659, 784, 1047] : kind === 'coin' ? [880, 1175] : [440];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.05, audioCtx.currentTime + i * 0.08 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.08 + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + i * 0.08); o.stop(audioCtx.currentTime + i * 0.08 + 0.17);
    });
  } catch (e) { /* audio tidak tersedia */ }
}
function toggleSound() {
  state.settings.sound = !state.settings.sound;
  saveGame(true); renderHUD();
  toast(state.settings.sound ? 'Suara aktif.' : 'Suara dimatikan.');
  if (state.settings.sound) sfx('ok');
}

/* ---------------- Map & setup ---------------- */
function mulberry32(a) {

}
function setupNPCs() {

function setupInteractables() { /* dihitung dinamis di getNearbyInteractable */ }

function buildMap() {
  map = Array.from({ length: MAP_H }, () => Array(MAP_W).fill('G'));
  // sungai
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < 5; x++) map[y][x] = 'W';
  // jembatan
  for (let y = 21; y <= 23; y++) for (let x = 0; x <= 5; x++) map[y][x] = 'B';
  // danau
  for (let y = 30; y < 44; y++) for (let x = 0; x < 17; x++) {
    const dx = x - 8, dy = y - 37;
    if (dx * dx + dy * dy < 22) map[y][x] = 'W';
  }
  // jalan utama
  for (let x = 5; x <= 60; x++) { map[22][x] = 'P'; map[23][x] = 'P'; }
  // jalan vertikal
  for (const x of [11, 25, 39, 53]) for (let y = 10; y <= 36; y++) map[y][x] = 'P';
  // plaza
  for (let y = 18; y <= 26; y++) for (let x = 28; x <= 36; x++) map[y][x] = 'P';
  // lahan pertanian
  for (let y = 24; y <= 27; y++) for (let x = 14; x <= 18; x++) map[y][x] = 'S';
  // pagar lahan
  for (let x = 13; x <= 19; x++) { if (map[23][x] === 'G') map[23][x] = 'X'; if (map[28][x] === 'G') map[28][x] = 'X'; }
  for (let y = 23; y <= 28; y++) { if (map[y][13] === 'G') map[y][13] = 'X'; if (map[y][19] === 'G') map[y][19] = 'X'; }
  map[28][16] = 'G'; // gerbang lahan
  // papan misi
  map[17][32] = 'P';
  // mulai
  map[22][8] = 'P'; map[23][8] = 'P';
  // sebar pohon, batu, bunga, lampu
  const rng = mulberry32(20261104);
  for (let i = 0; i < 260; i++) {
    const x = 6 + Math.floor(rng() * 54), y = 2 + Math.floor(rng() * 40);
    if (!isFreeForScatter(x, y)) continue;
    const r = rng();
    if (r < 0.52) map[y][x] = 'T';
    else if (r < 0.66) map[y][x] = 'R';
    else if (r < 0.84) map[y][x] = 'F';
    else map[y][x] = 'L';
  }
  // lampu di sekitar jalan
  for (const [x, y] of [[6,21],[12,21],[20,21],[28,17],[36,17],[44,21],[52,21],[6,24],[12,24],[20,24],[28,27],[36,27],[44,24],[52,24],[16,29],[32,27]]) {
    if (map[y] && map[y][x] === 'G') map[y][x] = 'L';
  }
  // pagar tepi peta
  for (let x = 0; x < MAP_W; x++) { if (map[0][x] === 'G') map[0][x] = 'T'; if (map[MAP_H - 1][x] === 'G') map[MAP_H - 1][x] = 'T'; }
  for (let y = 0; y < MAP_H; y++) { if (map[y][MAP_W - 1] === 'G') map[y][MAP_W - 1] = 'T'; }
}
function isFreeForScatter(x, y) {
  if (map[y][x] !== 'G') return false;
  if (x < 6 || x > 58 || y < 2 || y > 41) return false;
  for (const b of buildings) {
    if (x >= b.x - 1 && x <= b.x + b.w && y >= b.y - 1 && y <= b.y + b.h + 1) return false;
    if (Math.abs(x - b.doorX) <= 1 && Math.abs(y - (b.doorY + 1)) <= 1) return false;
  }
  for (const n of npcs) if (Math.abs(x - n.x) <= 1 && Math.abs(y - n.y) <= 1) return false;
  if (Math.abs(x - 8) <= 2 && Math.abs(y - 23) <= 2) return false;
  if (Math.abs(x - 32) <= 2 && Math.abs(y - 17) <= 2) return false;
  if (Math.abs(x - 32) <= 3 && Math.abs(y - 22) <= 3) return false;
  if (x >= 12 && x <= 20 && y >= 22 && y <= 29) return false;
  if (y >= 21 && y <= 24 && x >= 5 && x <= 60) return false;
  for (const vx of [11, 25, 39, 53]) if (Math.abs(x - vx) <= 1 && y >= 9 && y <= 37) return false;
