<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b1a">
<title>Nusa Qur'an Quest — RPG Desa Nusantara</title>
<style>/* ============ Nusa Qur'an Quest — Game RPG ============ */
:root{
  --bg:#070b1a; --panel:rgba(17,26,51,.92); --panel2:rgba(23,34,64,.96);
  --line:rgba(148,163,184,.18); --line2:rgba(148,163,184,.32);
  --text:#eef2ff; --muted:#9aa8c7; --gold:#f6c453; --gold2:#e0a92e;
  --green:#34d399; --sky:#38bdf8; --rose:#fb7185; --violet:#a78bfa; --danger:#f87171;
  --radius:18px; --font:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  --arabic:'Traditional Arabic','Amiri','Scheherazade New','Noto Naskh Arabic',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font); color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit;text-decoration:none}
::selection{background:rgba(246,196,83,.3)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.28);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ============ Start screen ============ */
.start-screen{
  min-height:100vh; display:grid; place-items:center; padding:24px; position:relative; overflow:auto;
  background:
    radial-gradient(900px 600px at 15% 10%,rgba(52,211,153,.16),transparent 60%),
    radial-gradient(800px 600px at 90% 20%,rgba(246,196,83,.14),transparent 60%),
    radial-gradient(900px 700px at 50% 110%,rgba(56,189,248,.12),transparent 60%),
    linear-gradient(180deg,#070b1a,#0a1124 55%,#070b1a);
}
.start-screen::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.35;
  background-image:radial-gradient(rgba(148,163,184,.25) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse at 50% 20%,black,transparent 78%);
}
.start-card{
  position:relative; z-index:1; width:min(760px,100%); padding:clamp(24px,5vw,46px);
  border-radius:28px; border:1px solid rgba(246,196,83,.28);
  background:linear-gradient(160deg,rgba(23,34,64,.94),rgba(9,15,32,.98));
  box-shadow:0 30px 90px rgba(2,6,23,.65); text-align:center; overflow:hidden;
}
.start-card::before{
  content:""; position:absolute; width:260px;height:260px;border-radius:50%; right:-100px;top:-120px;
  border:1px solid rgba(246,196,83,.2); box-shadow:0 0 0 40px rgba(246,196,83,.04),0 0 0 80px rgba(246,196,83,.03);
}
.start-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:#f8d98d;background:rgba(246,196,83,.1);border:1px solid rgba(246,196,83,.3);margin-bottom:16px}
.start-title{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-1.4px;margin:0 0 8px;font-weight:900}
.start-title em{font-style:normal;background:linear-gradient(100deg,#ffe6a8,#f6c453 40%,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.start-sub{font-size:13px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 14px}
.start-desc{font-size:13.5px;line-height:1.75;color:#c3cee6;max-width:56ch;margin:0 auto 20px}
.start-scene{display:flex;justify-content:center;gap:10px;font-size:38px;margin:6px 0 18px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.start-scene span{animation:float 4.5s ease-in-out infinite}
.start-scene span:nth-child(2){animation-delay:.5s}
.start-scene span:nth-child(3){animation-delay:1s}
.start-scene span:nth-child(4){animation-delay:1.5s}
.start-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.start-features{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.start-note{font-size:10.5px;line-height:1.6;color:var(--muted2);border-top:1px solid var(--line);padding-top:14px}
.start-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* ============ Buttons / chips ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;
  border:1px solid var(--line2);background:rgba(148,163,184,.1);color:var(--text);
  font-size:13px;font-weight:800;transition:.18s;line-height:1.1;text-align:center;
}
.btn:hover{transform:translateY(-1px);background:rgba(148,163,184,.16);border-color:rgba(148,163,184,.45)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#f8d98d,#e0a92e);color:#211603;border-color:rgba(246,196,83,.5);box-shadow:0 10px 26px rgba(224,169,46,.22)}
.btn-primary:hover{background:linear-gradient(135deg,#ffe6a8,#eab63a)}
.btn-green{background:linear-gradient(135deg,#34d399,#0d9488);color:#04120d;border-color:rgba(52,211,153,.45)}
.btn-ghost{background:transparent}
.btn-danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35);color:#ffb4b4}
.btn-sm{padding:8px 12px;font-size:11.5px;border-radius:10px}
.btn-lg{padding:15px 26px;font-size:14.5px;border-radius:16px}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(148,163,184,.1);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.chip.gold{background:rgba(246,196,83,.12);border-color:rgba(246,196,83,.3);color:#f8d98d}
.chip.green{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3);color:#8ff0c9}
.chip.sky{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.3);color:#a5e4ff}
.chip.rose{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.3);color:#ffb3c0}
.chip.violet{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.3);color:#d3c4ff}

/* ============ Game screen / canvas ============ */
.game-screen{position:fixed;inset:0;overflow:hidden;background:#0a1124}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;z-index:10;padding:12px;display:flex;flex-direction:column;justify-content:flex-start}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.hud-left{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:rgba(7,11,26,.82);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(2,6,23,.35);pointer-events:auto;max-width:min(420px,calc(100vw - 24px))}
.hud-avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,rgba(246,196,83,.2),rgba(52,211,153,.16));border:1px solid rgba(246,196,83,.35);flex:none}
.hud-player{min-width:0;flex:1}
.hud-name{font-size:12.5px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-sub{font-size:9.5px;color:var(--muted);margin:2px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:99px;background:rgba(148,163,184,.18);overflow:hidden;margin-top:3px}
.bar > i{display:block;height:100%;border-radius:99px;transition:width .3s ease}
.bar.xp > i{background:linear-gradient(90deg,#38bdf8,#a78bfa)}
.bar.energy > i{background:linear-gradient(90deg,#34d399,#f6c453)}
.bar.energy.low > i{background:linear-gradient(90deg,#fb7185,#f6c453)}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;pointer-events:auto}
.hud-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hud-buttons{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.hud-btn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;
  background:rgba(7,11,26,.82);border:1px solid var(--line);color:var(--text);backdrop-filter:blur(12px);transition:.16s;
}
.hud-btn:hover{background:rgba(148,163,184,.16);border-color:var(--line2);transform:translateY(-1px)}
.objective{
  align-self:center;margin-top:8px;padding:7px 14px;border-radius:999px;font-size:11px;font-weight:800;
  background:rgba(7,11,26,.82);border:1px solid rgba(246,196,83,.3);color:#ffe6a8;backdrop-filter:blur(12px);
  box-shadow:0 8px 24px rgba(2,6,23,.35);max-width:calc(100vw - 24px);text-align:center;
}
.hud-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:auto}
.hud-tip{font-size:9.5px;color:rgba(238,242,255,.65);background:rgba(7,11,26,.65);padding:5px 9px;border-radius:8px;border:1px solid var(--line);backdrop-filter:blur(8px)}

/* ============ Interaction prompt ============ */
.prompt{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:12;
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  background:rgba(7,11,26,.9);border:1px solid rgba(246,196,83,.4);color:#ffe6a8;
  font-size:11.5px;font-weight:800;box-shadow:0 12px 30px rgba(2,6,23,.45);backdrop-filter:blur(12px);
  animation:pop .2s ease;max-width:calc(100vw - 24px);text-align:center;
}
.prompt .key{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;background:linear-gradient(135deg,#f8d98d,#e0a92e);color:#211603;font-size:10px;font-weight:900}

/* ============ Dialogue ============ */
.dialogue{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:14;width:min(860px,calc(100vw - 24px));
  display:flex;gap:12px;padding:14px;border-radius:18px;background:rgba(7,11,26,.95);
  border:1px solid rgba(246,196,83,.35);box-shadow:0 24px 60px rgba(2,6,23,.6);backdrop-filter:blur(16px);
  animation:slideUp .22s ease;
}
.dialogue-portrait{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,rgba(246,196,83,.2),rgba(52,211,153,.14));border:1px solid rgba(246,196,83,.35);flex:none}
.dialogue-main{flex:1;min-width:0}
.dialogue-name{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;font-weight:900}
.dialogue-role{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);background:rgba(246,196,83,.1);border:1px solid rgba(246,196,83,.25);padding:2px 6px;border-radius:999px}
.dialogue-text{font-size:12px;line-height:1.7;color:#dbe4f7;margin:6px 0 10px;white-space:pre-line;min-height:38px}
.dialogue-choices{display:flex;gap:6px;flex-wrap:wrap}
.choice{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;
  background:rgba(148,163,184,.08);border:1px solid var(--line2);color:var(--text);
  font-size:11px;font-weight:800;transition:.16s;text-align:left;
}
.choice:hover{background:rgba(246,196,83,.1);border-color:rgba(246,196,83,.4);transform:translateY(-1px)}
.choice.primary{background:linear-gradient(135deg,rgba(246,196,83,.22),rgba(246,196,83,.08));border-color:rgba(246,196,83,.45);color:#ffe6a8}
.dialogue-close{position:absolute;right:10px;top:8px;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(148,163,184,.08);color:var(--muted);font-size:14px;display:grid;place-items:center}
.dialogue-close:hover{color:var(--text);background:rgba(148,163,184,.16)}

/* ============ Touch controls ============ */
.touch-controls{position:absolute;inset:auto 0 0 0;z-index:13;display:none;justify-content:space-between;align-items:flex-end;padding:0 16px 16px;pointer-events:none}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;pointer-events:auto}
.dpad button{
  border-radius:12px;border:1px solid var(--line2);background:rgba(7,11,26,.82);color:var(--text);
  font-size:17px;display:grid;place-items:center;backdrop-filter:blur(10px);touch-action:none;user-select:none;
}
.dpad button:active{background:rgba(246,196,83,.25);border-color:rgba(246,196,83,.5)}
.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
.action-btn{
  width:64px;height:64px;border-radius:50%;border:1px solid rgba(246,196,83,.5);
  background:linear-gradient(145deg,rgba(246,196,83,.28),rgba(224,169,46,.12));color:#ffe6a8;
  font-size:20px;font-weight:900;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1;gap:3px;pointer-events:auto;backdrop-filter:blur(10px);
  box-shadow:0 10px 26px rgba(2,6,23,.4);touch-action:none;user-select:none;
}
.action-btn small{font-size:9px;font-weight:700;line-height:1}
.action-btn:active{transform:scale(.96);background:rgba(246,196,83,.4)}

/* ============ Modal ============ */
.modal-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(2,6,23,.78);backdrop-filter:blur(7px);animation:fade .18s ease;overflow:auto}
.modal-card{
  width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;position:relative;
  border-radius:22px;border:1px solid var(--line2);background:linear-gradient(160deg,#141f3d,#0b1226);
  box-shadow:0 30px 90px rgba(0,0,0,.65);padding:22px;animation:pop .22s ease;
}
.modal-card.wide{max-width:900px}
.modal-card.narrow{max-width:440px}
.modal-close{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(148,163,184,.08);color:var(--muted);font-size:15px;display:grid;place-items:center;z-index:2}
.modal-close:hover{color:var(--text);background:rgba(148,163,184,.16)}
.modal-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;padding-right:30px}
.modal-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:rgba(246,196,83,.12);border:1px solid rgba(246,196,83,.25);flex:none}
.modal-title{font-size:18px;font-weight:900;line-height:1.2;margin:0}
.modal-sub{font-size:10.5px;color:var(--muted);margin-top:3px}
.modal-body{font-size:12px;line-height:1.7;color:#c8d3ea}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.modal-section{margin-top:14px}
.modal-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:900;margin-bottom:7px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.stat{padding:11px 13px;border-radius:12px;background:rgba(148,163,184,.06);border:1px solid var(--line)}
.stat b{display:block;font-size:18px;line-height:1.1}
.stat small{display:block;font-size:9.5px;color:var(--muted);margin-top:3px}
.note{padding:11px 13px;border-radius:12px;background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.2);font-size:11px;line-height:1.65;color:#bfe9ff}
.note.gold{background:rgba(246,196,83,.06);border-color:rgba(246,196,83,.22);color:#ffe9b0}
.note.rose{background:rgba(251,113,133,.06);border-color:rgba(251,113,133,.22);color:#ffd0d6}
.note.green{background:rgba(52,211,153,.06);border-color:rgba(52,211,153,.22);color:#c9f7e5}
.progress{height:7px;border-radius:99px;background:rgba(148,163,184,.16);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#f6c453);transition:width .35s ease}
.progress-label{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--muted);margin-top:5px}

/* ============ Exam ============ */
.exam-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.exam-q{font-size:15px;line-height:1.55;font-weight:800;margin:0 0 12px}
.options{display:flex;flex-direction:column;gap:7px}
.option{
  display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border-radius:11px;text-align:left;
  background:rgba(148,163,184,.06);border:1px solid var(--line);color:#dbe4f7;font-size:11.5px;line-height:1.5;transition:.15s;width:100%;
}
.option:hover:not(:disabled){background:rgba(148,163,184,.12);border-color:var(--line2);transform:translateX(2px)}
.option-letter{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;background:rgba(148,163,184,.14);border:1px solid var(--line);font-size:10px;font-weight:900;color:var(--muted)}
.option.correct{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.5)}
.option.correct .option-letter{background:rgba(52,211,153,.25);border-color:rgba(52,211,153,.5);color:#8ff0c9}
.option.wrong{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.45)}
.option.wrong .option-letter{background:rgba(248,113,113,.22);border-color:rgba(248,113,113,.5);color:#ffb4b4}
.option.dim{opacity:.55}
.option:disabled{cursor:default}
.exam-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.exam-dots{display:flex;gap:4px}
.exam-dots i{width:7px;height:7px;border-radius:50%;background:rgba(148,163,184,.25)}
.exam-dots i.ok{background:var(--green)}.exam-dots i.no{background:var(--danger)}.exam-dots i.now{background:var(--gold);box-shadow:0 0 0 3px rgba(246,196,83,.18)}
.result-ring{width:112px;height:112px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p,0)*1%),rgba(148,163,184,.14) 0);position:relative}
.result-ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#0d1630}
.result-ring span{position:relative;font-size:24px;font-weight:900}
.result-ring small{position:relative;display:block;font-size:8.5px;color:var(--muted);text-align:center;margin-top:2px}
.review-item{padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(148,163,184,.05);margin-bottom:7px}
.review-item h5{margin:0 0 4px;font-size:11px;line-height:1.45}
.review-item p{margin:0;font-size:10.5px;line-height:1.6;color:var(--muted)}

/* ============ Shop / items ============ */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.item-card{padding:12px;border-radius:13px;border:1px solid var(--line);background:rgba(148,163,184,.05);display:flex;flex-direction:column;gap:6px}
.item-icon{font-size:24px}
.item-card h5{margin:0;font-size:12px}
.item-card p{margin:0;font-size:10.5px;line-height:1.55;color:var(--muted);flex:1}
.item-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px}
.price{font-size:11px;font-weight:900;color:var(--gold)}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.inv-card{padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(148,163,184,.05);display:flex;gap:8px;align-items:center}
.inv-card .ico{font-size:22px}
.inv-card b{display:block;font-size:11px}
.inv-card small{display:block;font-size:9.5px;color:var(--muted)}
.inv-card .count{margin-left:auto;font-size:14px;font-weight:900;color:var(--gold)}

/* ============ Quest / book / certificate ============ */
.quest-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(148,163,184,.05);border:1px solid var(--line);margin-bottom:6px}
.quest-row .ico{font-size:16px}
.quest-row .q-main{flex:1;min-width:0}
.quest-row b{display:block;font-size:11px;line-height:1.3}
.quest-row small{display:block;font-size:9.5px;color:var(--muted);line-height:1.4}
.chapter-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(148,163,184,.05);border:1px solid var(--line);margin-bottom:6px}
.chapter-row .emoji{font-size:17px}
.chapter-row .c-main{flex:1;min-width:0}
.chapter-row b{display:block;font-size:11px;line-height:1.3}
.chapter-row small{display:block;font-size:9.5px;color:var(--muted)}
.chapter-row .c-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.book-card{padding:13px;border-radius:13px;border:1px solid var(--line);background:rgba(148,163,184,.05);margin-bottom:9px}
.book-card h4{margin:0 0 4px;font-size:12px}
.book-card p{margin:0;font-size:11px;line-height:1.65;color:#c8d3ea}
.arabic{font-family:var(--arabic);font-size:clamp(20px,2.6vw,26px);line-height:2;text-align:right;direction:rtl;padding:10px 12px;border-radius:11px;background:rgba(246,196,83,.06);border:1px solid rgba(246,196,83,.18);margin:6px 0;color:#ffe9b0}
.translation{font-size:11px;line-height:1.7;color:#dbe4f7;font-style:italic;border-left:2px solid rgba(246,196,83,.4);padding-left:10px;margin:6px 0}
.tafsir{font-size:10.5px;line-height:1.65;color:var(--muted);background:rgba(56,189,248,.05);border:1px dashed rgba(56,189,248,.2);padding:8px 10px;border-radius:10px;margin-top:6px}
.hadis-box{padding:9px 11px;border-radius:10px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.18);margin:6px 0}
.hadis-box p{margin:0 0 4px;font-size:11px;line-height:1.7;color:#d9f7ea}
.hadis-box .source{font-size:9.5px;font-weight:800;color:#8ff0c9}
.value-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
.value-list li{display:flex;gap:6px;font-size:10.5px;line-height:1.55;color:#c8d3ea}
.value-list li::before{content:"✦";color:var(--gold);font-size:9px;line-height:1.7}
.certificate{
  position:relative;border-radius:18px;padding:clamp(18px,4vw,30px);text-align:center;
  background:radial-gradient(500px 260px at 50% 0%,rgba(246,196,83,.16),transparent 60%),linear-gradient(160deg,#0f1a33,#0a1124);
  border:1px solid rgba(246,196,83,.4);overflow:hidden;
}
.certificate::before,.certificate::after{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(246,196,83,.2);transform:rotate(45deg)}
.certificate::before{left:-80px;top:-80px}.certificate::after{right:-80px;bottom:-80px}
.cert-seal{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;margin:0 auto 10px;background:radial-gradient(circle at 35% 30%,rgba(246,196,83,.3),rgba(246,196,83,.08));border:1px solid rgba(246,196,83,.5);box-shadow:0 0 0 7px rgba(246,196,83,.05)}
.cert-title{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:900;margin-bottom:5px}
.cert-name{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin:4px 0;background:linear-gradient(100deg,#ffe6a8,#f6c453,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.cert-sub{font-size:10.5px;color:var(--muted);line-height:1.65;max-width:52ch;margin:0 auto 12px}
.cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
.cert-cell{padding:8px;border-radius:9px;background:rgba(148,163,184,.06);border:1px solid var(--line)}
.cert-cell b{display:block;font-size:15px;color:var(--gold)}
.cert-cell small{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.help-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.help-card{padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(148,163,184,.05)}
.help-card b{display:block;font-size:11px;margin-bottom:3px}
.help-card span{font-size:10px;line-height:1.55;color:var(--muted)}
.keycap{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:rgba(148,163,184,.16);border:1px solid var(--line2);font-size:9px;font-weight:900;color:var(--text);margin-right:3px}

/* ============ Toast / confetti / fade ============ */
.toast{
  position:fixed;left:50%;top:18px;transform:translate(-50%,-14px);z-index:120;
  padding:10px 16px;border-radius:12px;background:rgba(17,26,51,.97);border:1px solid rgba(246,196,83,.4);
  color:var(--text);font-size:11.5px;font-weight:800;box-shadow:0 18px 50px rgba(2,6,23,.6);
  opacity:0;pointer-events:none;transition:.22s;max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti-root{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.confetti-piece{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;animation:fall linear forwards}
.fade{position:fixed;inset:0;z-index:100;background:#02040c;opacity:0;pointer-events:none;transition:opacity .45s ease}
.fade.on{opacity:1}

/* ============ Animations ============ */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ Responsive ============ */
@media (max-width:900px){
  .touch-controls{display:flex}
  .dialogue{bottom:96px}
  .prompt{bottom:170px}
  .hud{padding:8px}
  .hud-left{max-width:calc(100vw - 16px);padding:7px 9px}
  .hud-avatar{width:36px;height:36px;font-size:19px}
  .hud-name{font-size:11px}
  .hud-sub{font-size:8.5px}
  .hud-btn{min-width:40px;height:40px;font-size:16px}
  .objective{font-size:9.5px;padding:6px 10px}
  .hud-tip{display:none}
  .start-card{padding:22px}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .grid-2{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr}
  .modal-card{padding:16px;border-radius:18px}
  .modal-title{font-size:16px}
  .dialogue{padding:10px;gap:8px}
  .dialogue-portrait{width:44px;height:44px;font-size:24px;border-radius:12px}
  .dialogue-text{font-size:11px;min-height:32px}
  .choice{font-size:10px;padding:7px 9px}
  .start-title{font-size:34px}
  .start-scene{font-size:30px}
  .hud-chips .chip{font-size:9px;padding:4px 7px}
  .cert-grid{grid-template-columns:1fr 1fr}
  .dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
  .action-btn{width:58px;height:58px;font-size:18px}
}
@media print{
  body{overflow:visible;background:#fff}
  .game-screen,.hud,.touch-controls,.dialogue,.prompt,.toast,#confetti-root,.modal-close,.no-print{display:none!important}
  .modal-overlay{position:static;background:#fff;padding:0;display:block}
  .modal-card{max-width:none;max-height:none;box-shadow:none;border:2px solid #b8860b;background:#fff;color:#111}
  .cert-name{color:#111;background:none;-webkit-text-fill-color:#111}
  .cert-sub,.cert-cell small{color:#444}
  .cert-cell{background:#f8f5ec;border-color:#ddd}
  .cert-cell b{color:#8a6508}
  .cert-title{color:#8a6508}
}

/* ============ Start name input ============ */
.start-name{max-width:340px;margin:0 auto 14px;text-align:left}
.start-name label{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:900;margin-bottom:5px}
.start-input{
  width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line2);
  background:rgba(6,10,24,.65);color:var(--text);font-size:12.5px;font-family:inherit;transition:.16s;
}
.start-input:focus{outline:none;border-color:rgba(246,196,83,.55);box-shadow:0 0 0 3px rgba(246,196,83,.12)}
.start-input::placeholder{color:var(--muted2)}
.option.selected{background:rgba(246,196,83,.12);border-color:rgba(246,196,83,.5)}
.exam-dots i.done{background:rgba(246,196,83,.55)}

@media (pointer:coarse){ .touch-controls{display:flex} }
</style>

<script>
/* ============================================================

   Player, NPC guru, ujian penguasa level, pertanian, warung, siklus hari.
