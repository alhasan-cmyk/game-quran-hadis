const GAME_DATA = {"surah":{"2":"Al-Baqarah","3":"Ali Imran","4":"An-Nisa","5":"Al-Ma'idah","7":"Al-A'raf","9":"At-Taubah","10":"Yunus","15":"Al-Hijr","16":"An-Nahl","17":"Al-Isra","21":"Al-Anbiya","25":"Al-Furqan","26":"Asy-Syu'ara","28":"Al-Qasas","30":"Ar-Rum","38":"Shad","42":"Asy-Syura","49":"Al-Hujurat","57":"Al-Hadid","96":"Al-Alaq","107":"Al-Ma'un"},"quran":{"25:67":{"surah":25,"start":67,"end":67,"arabic":["وَٱلَّذِينَ إِذَآ أَنفَقُوا۟ لَمْ يُسْرِفُوا۟ وَلَمْ يَقْتُرُوا۟ وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًۭا"],"id":["Dan orang-orang yang apabila membelanjakan (harta), mereka tidak berlebihan, dan tidak (pula) kikir, dan adalah (pembelanjaan itu) di tengah-tengah antara yang demikian."]},"17:26-27":{"surah":17,"start":26,"end":27,"arabic":["وَءَاتِ ذَا ٱلْقُرْبَىٰ حَقَّهُۥ وَٱلْمِسْكِينَ وَٱبْنَ ٱلسَّبِيلِ وَلَا تُبَذِّرْ تَبْذِيرًا","إِنَّ ٱلْمُبَذِّرِينَ كَانُوٓا۟ إِخْوَٰنَ ٱلشَّيَٰطِينِ ۖ وَكَانَ ٱلشَّيْطَٰنُ لِرَبِّهِۦ كَفُورًۭا"],"id":["Dan berikanlah kepada keluarga-keluarga yang dekat akan haknya, kepada orang miskin dan orang yang dalam perjalanan dan janganlah kamu menghambur-hamburkan (hartamu) secara boros.","Sesungguhnya pemboros-pemboros itu adalah saudara-saudara syaitan dan syaitan itu adalah sangat ingkar kepada Tuhannya."]},"28:79-80":{"surah":28,"start":79,"end":80,"arabic":["فَخَرَجَ عَلَىٰ قَوْمِهِۦ فِى زِينَتِهِۦ ۖ قَالَ ٱلَّذِينَ يُرِيدُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا يَٰلَيْتَ لَنَا مِثْلَ مَآ أُوتِىَ قَٰرُونُ إِنَّهُۥ لَذُو حَظٍّ عَظِيمٍۢ","وَقَالَ ٱلَّذِينَ أُوتُوا۟ ٱلْعِلْمَ وَيْلَكُمْ ثَوَابُ ٱللَّهِ خَيْرٌۭ لِّمَنْ ءَامَنَ وَعَمِلَ صَٰلِحًۭا وَلَا يُلَقَّىٰهَآ إِلَّا ٱلصَّٰبِرُونَ"],"id":["Maka keluarlah Karun kepada kaumnya dalam kemegahannya. Berkatalah orang-orang yang menghendaki kehidupan dunia: \"Moga-moga kiranya kita mempunyai seperti apa yang telah diberikan kepada Karun; sesungguhnya ia benar-benar mempunyai keberuntungan yang besar\".","Berkatalah orang-orang yang dianugerahi ilmu: \"Kecelakaan yang besarlah bagimu, pahala Allah adalah lebih baik bagi orang-orang yang beriman dan beramal saleh, dan tidak diperoleh pahala itu, kecuali oleh orang-orang yang sabar\"."]},"107:1-7":{"surah":107,"start":1,"end":7,"arabic":["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ أَرَءَيْتَ ٱلَّذِى يُكَذِّبُ بِٱلدِّينِ","فَذَٰلِكَ ٱلَّذِى يَدُعُّ ٱلْيَتِيمَ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ","فَوَيْلٌۭ لِّلْمُصَلِّينَ","ٱلَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ","ٱلَّذِينَ هُمْ يُرَآءُونَ","وَيَمْنَعُونَ ٱلْمَاعُونَ"],"id":["Tahukah kamu (orang) yang mendustakan agama?","Itulah orang yang menghardik anak yatim,","dan tidak menganjurkan memberi makan orang miskin.","Maka kecelakaanlah bagi orang-orang yang shalat,","(yaitu) orang-orang yang lalai dari shalatnya,","orang-orang yang berbuat riya,","dan enggan (menolong dengan) barang berguna."]},"2:155-156":{"surah":2,"start":155,"end":156,"arabic":["وَلَنَبْلُوَنَّكُم بِشَىْءٍۢ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ وَنَقْصٍۢ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ ۗ وَبَشِّرِ ٱلصَّٰبِرِينَ","ٱلَّذِينَ إِذَآ أَصَٰبَتْهُم مُّصِيبَةٌۭ قَالُوٓا۟ إِنَّا لِلَّهِ وَإِنَّآ إِلَيْهِ رَٰجِعُونَ"],"id":["Dan sungguh akan Kami berikan cobaan kepadamu, dengan sedikit ketakutan, kelaparan, kekurangan harta, jiwa dan buah-buahan. Dan berikanlah berita gembira kepada orang-orang yang sabar.","(yaitu) orang-orang yang apabila ditimpa musibah, mereka mengucapkan: \"Inna lillaahi wa innaa ilaihi raaji'uun\"."]},"3:186":{"surah":3,"start":186,"end":186,"arabic":["۞ لَتُبْلَوُنَّ فِىٓ أَمْوَٰلِكُمْ وَأَنفُسِكُمْ وَلَتَسْمَعُنَّ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ مِن قَبْلِكُمْ وَمِنَ ٱلَّذِينَ أَشْرَكُوٓا۟ أَذًۭى كَثِيرًۭا ۚ وَإِن تَصْبِرُوا۟ وَتَتَّقُوا۟ فَإِنَّ ذَٰلِكَ مِنْ عَزْمِ ٱلْأُمُورِ"],"id":["Kamu sungguh-sungguh akan diuji terhadap hartamu dan dirimu. Dan (juga) kamu sungguh-sungguh akan mendengar dari orang-orang yang diberi kitab sebelum kamu dan dari orang-orang yang mempersekutukan Allah, gangguan yang banyak yang menyakitkan hati. Jika kamu bersabar dan bertakwa, maka sesungguhnya yang demikian itu termasuk urusan yang patut diutamakan."]},"57:22":{"surah":57,"start":22,"end":22,"arabic":["مَآ أَصَابَ مِن مُّصِيبَةٍۢ فِى ٱلْأَرْضِ وَلَا فِىٓ أَنفُسِكُمْ إِلَّا فِى كِتَٰبٍۢ مِّن قَبْلِ أَن نَّبْرَأَهَآ ۚ إِنَّ ذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٌۭ"],"id":["Tiada suatu bencanapun yang menimpa di bumi dan (tidak pula) pada dirimu sendiri melainkan telah tertulis dalam kitab (Lauhul Mahfuzh) sebelum Kami menciptakannya. Sesungguhnya yang demikian itu adalah mudah bagi Allah."]},"30:41":{"surah":30,"start":41,"end":41,"arabic":["ظَهَرَ ٱلْفَسَادُ فِى ٱلْبَرِّ وَٱلْبَحْرِ بِمَا كَسَبَتْ أَيْدِى ٱلنَّاسِ لِيُذِيقَهُم بَعْضَ ٱلَّذِى عَمِلُوا۟ لَعَلَّهُمْ يَرْجِعُونَ"],"id":["Telah nampak kerusakan di darat dan di laut disebabkan karena perbuatan tangan manusi, supay Allah merasakan kepada mereka sebahagian dari (akibat) perbuatan mereka, agar mereka kembali (ke jalan yang benar)."]},"7:56":{"surah":7,"start":56,"end":56,"arabic":["وَلَا تُفْسِدُوا۟ فِى ٱلْأَرْضِ بَعْدَ إِصْلَٰحِهَا وَٱدْعُوهُ خَوْفًۭا وَطَمَعًا ۚ إِنَّ رَحْمَتَ ٱللَّهِ قَرِيبٌۭ مِّنَ ٱلْمُحْسِنِينَ"],"id":["Dan janganlah kamu membuat kerusakan di muka bumi, sesudah (Allah) memperbaikinya dan berdoalah kepada-Nya dengan rasa takut (tidak akan diterima) dan harapan (akan dikabulkan). Sesungguhnya rahmat Allah amat dekat kepada orang-orang yang berbuat baik."]},"38:27":{"surah":38,"start":27,"end":27,"arabic":["وَمَا خَلَقْنَا ٱلسَّمَآءَ وَٱلْأَرْضَ وَمَا بَيْنَهُمَا بَٰطِلًۭا ۚ ذَٰلِكَ ظَنُّ ٱلَّذِينَ كَفَرُوا۟ ۚ فَوَيْلٌۭ لِّلَّذِينَ كَفَرُوا۟ مِنَ ٱلنَّارِ"],"id":["Dan Kami tidak menciptakan langit dan bumi dan apa yang ada antara keduanya tanpa hikmah. Yang demikian itu adalah anggapan orang-orang kafir, maka celakalah orang-orang kafir itu karena mereka akan masuk neraka."]},"2:204-205":{"surah":2,"start":204,"end":205,"arabic":["وَمِنَ ٱلنَّاسِ مَن يُعْجِبُكَ قَوْلُهُۥ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيُشْهِدُ ٱللَّهَ عَلَىٰ مَا فِى قَلْبِهِۦ وَهُوَ أَلَدُّ ٱلْخِصَامِ","وَإِذَا تَوَلَّىٰ سَعَىٰ فِى ٱلْأَرْضِ لِيُفْسِدَ فِيهَا وَيُهْلِكَ ٱلْحَرْثَ وَٱلنَّسْلَ ۗ وَٱللَّهُ لَا يُحِبُّ ٱلْفَسَادَ"],"id":["Dan di antara manusia ada orang yang ucapannya tentang kehidupan dunia menarik hatimu, dan dipersaksikannya kepada Allah (atas kebenaran) isi hatinya, padahal ia adalah penantang yang paling keras.","Dan apabila ia berpaling (dari kamu), ia berjalan di bumi untuk mengadakan kerusakan padanya, dan merusak tanam-tanaman dan binatang ternak, dan Allah tidak menyukai kebinasaan."]},"96:1-5":{"surah":96,"start":1,"end":5,"arabic":["بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ","خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ","ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ","ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ","عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ"],"id":["Bacalah dengan (menyebut) nama Tuhanmu Yang menciptakan,","Dia telah menciptakan manusia dari segumpal darah.","Bacalah, dan Tuhanmulah Yang Maha Pemurah,","Yang mengajar (manusia) dengan perantaran kalam,","Dia mengajar kepada manusia apa yang tidak diketahuinya."]},"10:101":{"surah":10,"start":101,"end":101,"arabic":["قُلِ ٱنظُرُوا۟ مَاذَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَمَا تُغْنِى ٱلْءَايَٰتُ وَٱلنُّذُرُ عَن قَوْمٍۢ لَّا يُؤْمِنُونَ"],"id":["Katakanlah: \"Perhatikanlah apa yaag ada di langit dan di bumi. Tidaklah bermanfaat tanda kekuasaan Allah dan rasul-rasul yang memberi peringatan bagi orang-orang yang tidak beriman\"."]},"49:6":{"surah":49,"start":6,"end":6,"arabic":["يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍۢ فَتَبَيَّنُوٓا۟ أَن تُصِيبُوا۟ قَوْمًۢا بِجَهَٰلَةٍۢ فَتُصْبِحُوا۟ عَلَىٰ مَا فَعَلْتُمْ نَٰدِمِينَ"],"id":["Hai orang-orang yang beriman, jika datang kepadamu orang fasik membawa suatu berita, maka periksalah dengan teliti agar kamu tidak menimpakan suatu musibah kepada suatu kaum tanpa mengetahui keadaannya yang menyebabkan kamu menyesal atas perbuatanmu itu."]},"16:125":{"surah":16,"start":125,"end":125,"arabic":["ٱدْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِٱلْحِكْمَةِ وَٱلْمَوْعِظَةِ ٱلْحَسَنَةِ ۖ وَجَٰدِلْهُم بِٱلَّتِى هِىَ أَحْسَنُ ۚ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦ ۖ وَهُوَ أَعْلَمُ بِٱلْمُهْتَدِينَ"],"id":["Serulah (manusia) kepada jalan Tuhan-mu dengan hikmah dan pelajaran yang baik dan bantahlah mereka dengan cara yang baik. Sesungguhnya Tuhanmu Dialah yang lebih mengetahui tentang siapa yang tersesat dari jalan-Nya dan Dialah yang lebih mengetahui orang-orang yang mendapat petunjuk."]},"26:214-216":{"surah":26,"start":214,"end":216,"arabic":["وَأَنذِرْ عَشِيرَتَكَ ٱلْأَقْرَبِينَ","وَٱخْفِضْ جَنَاحَكَ لِمَنِ ٱتَّبَعَكَ مِنَ ٱلْمُؤْمِنِينَ","فَإِنْ عَصَوْكَ فَقُلْ إِنِّى بَرِىٓءٌۭ مِّمَّا تَعْمَلُونَ"],"id":["Dan berilah peringatan kepada kerabat-kerabatmu yang terdekat,","dan rendahkanlah dirimu terhadap orang-orang yang mengikutimu, yaitu orang-orang yang beriman.","Jika mereka mendurhakaimu maka katakanlah: \"Sesungguhnya aku tidak bertanggung jawab terhadap apa yang kamu kerjakan\";"]},"15:94-95":{"surah":15,"start":94,"end":95,"arabic":["فَٱصْدَعْ بِمَا تُؤْمَرُ وَأَعْرِضْ عَنِ ٱلْمُشْرِكِينَ","إِنَّا كَفَيْنَٰكَ ٱلْمُسْتَهْزِءِينَ"],"id":["Maka sampaikanlah olehmu secara terang-terangan segala apa yang diperintahkan (kepadamu) dan berpalinglah dari orang-orang yang musyrik.","Sesungguhnya Kami memelihara kamu daripada (kejahatan) orang-orang yang memperolok-olokkan (kamu),"]},"21:107":{"surah":21,"start":107,"end":107,"arabic":["وَمَآ أَرْسَلْنَٰكَ إِلَّا رَحْمَةًۭ لِّلْعَٰلَمِينَ"],"id":["Dan tiadalah Kami mengutus kamu, melainkan untuk (menjadi) rahmat bagi semesta alam."]},"3:104":{"surah":3,"start":104,"end":104,"arabic":["وَلْتَكُن مِّنكُمْ أُمَّةٌۭ يَدْعُونَ إِلَى ٱلْخَيْرِ وَيَأْمُرُونَ بِٱلْمَعْرُوفِ وَيَنْهَوْنَ عَنِ ٱلْمُنكَرِ ۚ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ"],"id":["Dan hendaklah ada di antara kamu segolongan umat yang menyeru kepada kebajikan, menyuruh kepada yang ma'ruf dan mencegah dari yang munkar; merekalah orang-orang yang beruntung."]},"3:110":{"surah":3,"start":110,"end":110,"arabic":["كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِٱلْمَعْرُوفِ وَتَنْهَوْنَ عَنِ ٱلْمُنكَرِ وَتُؤْمِنُونَ بِٱللَّهِ ۗ وَلَوْ ءَامَنَ أَهْلُ ٱلْكِتَٰبِ لَكَانَ خَيْرًۭا لَّهُم ۚ مِّنْهُمُ ٱلْمُؤْمِنُونَ وَأَكْثَرُهُمُ ٱلْفَٰسِقُونَ"],"id":["Kamu adalah umat yang terbaik yang dilahirkan untuk manusia, menyuruh kepada yang ma'ruf, dan mencegah dari yang munkar, dan beriman kepada Allah. Sekiranya Ahli Kitab beriman, tentulah itu lebih baik bagi mereka, di antara mereka ada yang beriman, dan kebanyakan mereka adalah orang-orang yang fasik."]},"5:78-79":{"surah":5,"start":78,"end":79,"arabic":["لُعِنَ ٱلَّذِينَ كَفَرُوا۟ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ عَلَىٰ لِسَانِ دَاوُۥدَ وَعِيسَى ٱبْنِ مَرْيَمَ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ","كَانُوا۟ لَا يَتَنَاهَوْنَ عَن مُّنكَرٍۢ فَعَلُوهُ ۚ لَبِئْسَ مَا كَانُوا۟ يَفْعَلُونَ"],"id":["Telah dilaknati orang-orang kafir dari Bani Israil dengan lisan Daud dan Isa putera Maryam. Yang demikian itu, disebabkan mereka durhaka dan selalu melampaui batas.","Mereka satu sama lain selalu tidak melarang tindakan munkar yang mereka perbuat. Sesungguhnya amat buruklah apa yang selalu mereka perbuat itu."]},"3:159":{"surah":3,"start":159,"end":159,"arabic":["فَبِمَا رَحْمَةٍۢ مِّنَ ٱللَّهِ لِنتَ لَهُمْ ۖ وَلَوْ كُنتَ فَظًّا غَلِيظَ ٱلْقَلْبِ لَٱنفَضُّوا۟ مِنْ حَوْلِكَ ۖ فَٱعْفُ عَنْهُمْ وَٱسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِى ٱلْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَوَكِّلِينَ"],"id":["Maka disebabkan rahmat dari Allah-lah kamu berlaku lemah lembut terhadap mereka. Sekiranya kamu bersikap keras lagi berhati kasar, tentulah mereka menjauhkan diri dari sekelilingmu. Karena itu maafkanlah mereka, mohonkanlah ampun bagi mereka, dan bermusyawaratlah dengan mereka dalam urusan itu. Kemudian apabila kamu telah membulatkan tekad, maka bertawakkallah kepada Allah. Sesungguhnya Allah menyukai orang-orang yang bertawakkal kepada-Nya."]},"42:38":{"surah":42,"start":38,"end":38,"arabic":["وَٱلَّذِينَ ٱسْتَجَابُوا۟ لِرَبِّهِمْ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَ"],"id":["Dan (bagi) orang-orang yang menerima (mematuhi) seruan Tuhannya dan mendirikan shalat, sedang urusan mereka (diputuskan) dengan musyawarat antara mereka; dan mereka menafkahkan sebagian dari rezeki yang Kami berikan kepada mereka."]},"49:13":{"surah":49,"start":13,"end":13,"arabic":["يَٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقْنَٰكُم مِّن ذَكَرٍۢ وَأُنثَىٰ وَجَعَلْنَٰكُمْ شُعُوبًۭا وَقَبَآئِلَ لِتَعَارَفُوٓا۟ ۚ إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَىٰكُمْ ۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٌۭ"],"id":["Hai manusia, sesungguhnya Kami menciptakan kamu dari seorang laki-laki dan seorang perempuan dan menjadikan kamu berbangsa-bangsa dan bersuku-suku supaya kamu saling kenal-mengenal. Sesungguhnya orang yang paling mulia diantara kamu disisi Allah ialah orang yang paling takwa diantara kamu. Sesungguhnya Allah Maha Mengetahui lagi Maha Mengenal."]},"5:8":{"surah":5,"start":8,"end":8,"arabic":["يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُونُوا۟ قَوَّٰمِينَ لِلَّهِ شُهَدَآءَ بِٱلْقِسْطِ ۖ وَلَا يَجْرِمَنَّكُمْ شَنَـَٔانُ قَوْمٍ عَلَىٰٓ أَلَّا تَعْدِلُوا۟ ۚ ٱعْدِلُوا۟ هُوَ أَقْرَبُ لِلتَّقْوَىٰ ۖ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا تَعْمَلُونَ"],"id":["Hai orang-orang yang beriman hendaklah kamu jadi orang-orang yang selalu menegakkan (kebenaran) karena Allah, menjadi saksi dengan adil. Dan janganlah sekali-kali kebencianmu terhadap sesuatu kaum, mendorong kamu untuk berlaku tidak adil. Berlaku adillah, karena adil itu lebih dekat kepada takwa. Dan bertakwalah kepada Allah, sesungguhnya Allah Maha Mengetahui apa yang kamu kerjakan."]},"9:119":{"surah":9,"start":119,"end":119,"arabic":["يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَكُونُوا۟ مَعَ ٱلصَّٰدِقِينَ"],"id":["Hai orang-orang yang beriman bertakwalah kepada Allah, dan hendaklah kamu bersama orang-orang yang benar."]},"16:90":{"surah":16,"start":90,"end":90,"arabic":["۞ إِنَّ ٱللَّهَ يَأْمُرُ بِٱلْعَدْلِ وَٱلْإِحْسَٰنِ وَإِيتَآئِ ذِى ٱلْقُرْبَىٰ وَيَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ وَٱلْبَغْىِ ۚ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ"],"id":["Sesungguhnya Allah menyuruh (kamu) berlaku adil dan berbuat kebajikan, memberi kepada kaum kerabat, dan Allah melarang dari perbuatan keji, kemungkaran dan permusuhan. Dia memberi pengajaran kepadamu agar kamu dapat mengambil pelajaran."]},"4:105":{"surah":4,"start":105,"end":105,"arabic":["إِنَّآ أَنزَلْنَآ إِلَيْكَ ٱلْكِتَٰبَ بِٱلْحَقِّ لِتَحْكُمَ بَيْنَ ٱلنَّاسِ بِمَآ أَرَىٰكَ ٱللَّهُ ۚ وَلَا تَكُن لِّلْخَآئِنِينَ خَصِيمًۭا"],"id":["Sesungguhnya Kami telah menurunkan kitab kepadamu dengan membawa kebenaran, supaya kamu mengadili antara manusia dengan apa yang telah Allah wahyukan kepadamu, dan janganlah kamu menjadi penantang (orang yang tidak bersalah), karena (membela) orang-orang yang khianat,"]}},"chapters":[{"id":1,"bab":"Bab I","title":"Pola Hidup Sederhana & Menyantuni Dhuafa","short":"Hidup sederhana, tidak boros, tidak kikir, peduli yang lemah.","island":"Pulau Qana'ah","emoji":"🌾","color":"#34d399","color2":"#065f46","intro":"Di Pulau Qana'ah, harta bukan ukuran kemuliaan. Wali Qana'ah mengajakmu memahami sikap moderat dalam membelanja dan peduli kepada yang lemah.","teacher":"Ustadzah Laila","materi":[{"type":"inti","title":"Inti Materi","text":"Islam mengajarkan pola hidup sederhana: tidak boros (israf), tidak kikir (qatr), dan tidak memamerkan harta. Harta adalah amanah yang harus dikelola dan dibagikan. Kisah Qarun dalam QS al-Qasas 28:79-80 menjadi peringatan bahwa kemegahan dunia bisa menyesatkan."},{"type":"ayat","title":"Kesederhanaan dalam membelanja","quran":"25:67","tafsir":"Hamba Rahman membelanjakan harta secara moderat: tidak berlebih-lebihan dan tidak kikir. Kunci hidup sederhana adalah menjaga keseimbangan sesuai kebutuhan dan syariat."},{"type":"ayat","title":"Hak keluarga dan orang lemah","quran":"17:26-27","tafsir":"Berikan hak kerabat, orang miskin, dan ibnu sabil. Jangan menghamburkan harta karena pemboros adalah saudara syaitan. Kepedulian harus nyata, bukan hanya retorika."},{"type":"ayat","title":"Mendustakan agama dan sikap pelit","quran":"107:1-7","tafsir":"Mendustakan agama tampak dari sikap menghardik anak yatim dan tidak memberi makan orang miskin. Shalat yang lalai, riya, dan enggan menolong tidak mendatangkan kebaikan."},{"type":"hadis","title":"Sedekah tidak mengurangi harta","text":"Sedekah tidak mengurangi harta, dan hamba yang memaafkan akan ditambah kehormatan oleh Allah, dan tidak ada seorang pun yang merendahkan diri karena Allah melainkan Allah akan mengangkatnya.","source":"HR. Muslim","tafsir":"Memberi tidak membuat miskin. Justru harta yang dibagikan mendatangkan berkah, kehormatan, dan pertumbuhan jiwa."},{"type":"hadis","title":"Jangan berlebih-lebihan","text":"Makanlah, minumlah, dan berpakaianlah, dan janganlah kamu berlebih-lebihan.","source":"HR. Ahmad","tafsir":"Islam tidak melarang menikmati nikmat, tetapi melarang pemborosan. Ukuran kebutuhan dan kemampuan menjadi patokan."},{"type":"nilai","title":"Nilai & Amalan","items":["Qana'ah: cukup dengan yang ada dan tidak memamerkan.","Tidak israf: membelanja sesuai kebutuhan, bukan gengsi.","Tidak qitr: tidak kikir dan tetap menyantuni dhuafa.","Peduli: memberi makan, memberi manfaat, dan menghormati yang lemah."]}],"vocab":[{"term":"Israf","meaning":"Berlebih-lebihan dalam membelanja atau memakai sesuatu."},{"term":"Qatr","meaning":"Kikir, menahan harta yang seharusnya dibelanjakan."},{"term":"Qana'ah","meaning":"Merasa cukup dengan rezeki yang ada."},{"term":"Dhuafa","meaning":"Orang-orang lemah yang membutuhkan pertolongan."}],"ujian":[{"q":"Mendustakan agama dalam QS al-Ma'un 107:1-7 dikaitkan dengan ...","options":["tidak menyantuni yatim dan miskin","tidak memiliki harta banyak","tidak pandai berbicara","tidak tinggal di kota"],"answer":0,"explain":"Ayat 2-3 menyebut penghardik terhadap anak yatim dan tidak menganjurkan memberi makan orang miskin."},{"q":"Sikap sederhana menurut QS al-Isra 17:26-27 adalah ...","options":["memberi hak kerabat dan miskin tanpa berlebih-lebihan","membelanjakan seluruh harta untuk diri sendiri","menimbun harta agar tidak habis","menghindari semua kegiatan sosial"],"answer":0,"explain":"Ayat memerintahkan memberi hak kerabat, miskin, dan ibnu sabil, serta melarang pemborosan."},{"q":"Hadis 'sedekah tidak mengurangi harta' mengajarkan bahwa ...","options":["berbagi mendatangkan berkah dan kehormatan","harta akan berkurang secara fisik","sedekah hanya untuk orang kaya","pemberian harus selalu diumumkan"],"answer":0,"explain":"Hadis menegaskan bahwa sedekah menambah kehormatan dan tidak mengurangi harta secara hakiki."},{"q":"Contoh israf dalam kehidupan remaja adalah ...","options":["membeli barang bermerek melebihi kebutuhan untuk pamer","membeli buku untuk belajar","menabung untuk kebutuhan sekolah","memberi makan teman yang lapar"],"answer":0,"explain":"Israf adalah membelanjakan melebihi kebutuhan, apalagi untuk pamer. Membeli buku dan menabung justru bijak."},{"q":"Yang bukan termasuk golongan dhuafa adalah ...","options":["orang kaya yang menyembunyikan hartanya","anak yatim yang tidak punya keluarga","orang miskin yang kekurangan makan","orang yang kehilangan pekerjaan"],"answer":0,"explain":"Dhuafa adalah orang lemah dan kekurangan. Orang kaya yang menyembunyikan harta bukan dhuafa, tetapi bisa menjadi pelaku kesalahan."}],"values":["Qana'ah: cukup dengan yang ada dan tidak memamerkan.","Tidak israf: membelanja sesuai kebutuhan, bukan gengsi.","Tidak qitr: tidak kikir dan tetap menyantuni dhuafa.","Peduli: memberi makan, memberi manfaat, dan menghormati yang lemah."]},{"id":2,"bab":"Bab II","title":"Bersabar & Berpikir Positif dalam Ujian","short":"Sabar, ikhtiar, optimis, dan tawakal menghadapi ujian.","island":"Pulau Sabr","emoji":"⛵","color":"#38bdf8","color2":"#075985","intro":"Lautan ujian tidak selalu tenang. Nakhoda Sabr mengajarkan cara menghadapi badai dengan sabar, berikhtiar, dan tetap optimis.","teacher":"Ustadz Fauzan","materi":[{"type":"inti","title":"Inti Materi","text":"Ujian adalah sunnatullah. Sabar bukan pasrah tanpa usaha, melainkan menahan diri, berikhtiar, dan tetap optimis. Orang mukmin memandang ujian sebagai jalan menuju kebaikan dan penghapus dosa."},{"type":"ayat","title":"Macam-macam ujian","quran":"2:155-156","tafsir":"Ujian datang dalam bentuk ketakutan, kelaparan, kekurangan harta, jiwa, dan buah-buahan. Orang sabar mendapat berita gembira dan mengucapkan istirja saat ditimpa musibah."},{"type":"ayat","title":"Keniscayaan ujian","quran":"3:186","tafsir":"Setiap orang pasti diuji dengan harta dan jiwa. Ujian menguji keimanan, kesabaran, dan ketawakalan."},{"type":"ayat","title":"Takdir dan ikhtiar","quran":"57:22","tafsir":"Tidak ada musibah yang menimpa di bumi atau pada diri manusia melainkan telah tertulis dalam Kitab. Keyakinan ini menumbuhkan ketenangan, tetapi tidak mematikan ikhtiar."},{"type":"hadis","title":"Sikap orang mukmin","text":"Keadaan orang mukmin itu menakjubkan, karena setiap urusannya bernilai baik. Jika mendapat kesenangan, ia bersyukur, dan itu baik baginya. Jika mendapat kesusahan, ia bersabar, dan itu baik baginya.","source":"HR. Muslim dari Suhaib","tafsir":"Orang beriman tidak kehilangan makna dalam keadaan apa pun. Syukur dan sabar adalah dua sayap yang membuat hidupnya tetap bernilai."},{"type":"hadis","title":"Ujian menghapus dosa","text":"Tidaklah seorang mukmin terkena lelah, sakit, cemas, sedih, bahkan duri, melainkan Allah menghapus sebagian dosanya.","source":"HR. Bukhari dan Muslim","tafsir":"Penderitaan tidak sia-sia. Bagi orang beriman, ujian menjadi sarana pembersihan dan pendewasaan."},{"type":"nilai","title":"Nilai & Amalan","items":["Sabar: menahan diri dari keluh kesah dan tindakan melampaui batas.","Ikhtiar: berusaha dengan strategi, doa, dan bantuan yang sah.","Optimis: melihat ujian sebagai peluang tumbuh.","Syukur dan tawakal: menerima hasil dengan hati yang lapang."]}],"vocab":[{"term":"Sabar","meaning":"Menahan diri dari hal yang tidak disukai karena mengharap rida Allah."},{"term":"Istirja","meaning":"Ucapan 'Inna lillahi wa inna ilaihi raji'un' saat ditimpa musibah."},{"term":"Tawakal","meaning":"Berserah kepada Allah setelah berikhtiar."},{"term":"Optimis","meaning":"Berharap baik dan melihat peluang di balik kesulitan."}],"ujian":[{"q":"Makna sabar yang paling tepat adalah ...","options":["menahan diri dari hal yang tidak disukai karena mengharap rida Allah","tidak pernah merasa sedih","menerima semua tanpa usaha","menyimpan marah sampai meledak"],"answer":0,"explain":"Sabar adalah menahan diri dengan kesadaran beribadah, bukan membekukan perasaan atau berhenti berusaha."},{"q":"QS Ali Imran 3:186 menegaskan bahwa ...","options":["setiap orang pasti diuji dengan harta dan jiwa","hanya orang kaya yang diuji","ujian hanya datang sekali","orang beriman tidak pernah diuji"],"answer":0,"explain":"Ayat menegaskan keniscayaan ujian bagi setiap orang, dengan harta dan jiwa."},{"q":"Contoh ikhtiar dalam menghadapi ujian adalah ...","options":["belajar dengan strategi, menjaga kesehatan, dan berdoa","hanya berdoa tanpa belajar","menyontek agar lulus","menyalahkan guru saat gagal"],"answer":0,"explain":"Ikhtiar adalah usaha nyata. Doa dan strategi belajar berjalan bersama."},{"q":"Hadis tentang orang mukmin yang bersyukur dan bersabar menunjukkan bahwa ...","options":["setiap keadaan bernilai baik bagi orang beriman","orang mukmin tidak pernah susah","syukur hanya untuk orang kaya","sabar hanya untuk orang miskin"],"answer":0,"explain":"Dalam hadis Suhaib, suka dan duka sama-sama bernilai baik karena disikapi dengan syukur atau sabar."},{"q":"Yang bukan sikap optimis adalah ...","options":["menyalahkan takdir tanpa berusaha","melihat kesulitan sebagai peluang belajar","mencari solusi bersama","tetap berharap dan berikhtiar"],"answer":0,"explain":"Optimis bukan berarti tidak berusaha. Menyalahkan takdir tanpa ikhtiar justru menutup peluang."}],"values":["Sabar: menahan diri dari keluh kesah dan tindakan melampaui batas.","Ikhtiar: berusaha dengan strategi, doa, dan bantuan yang sah.","Optimis: melihat ujian sebagai peluang tumbuh.","Syukur dan tawakal: menerima hasil dengan hati yang lapang."]},{"id":3,"bab":"Bab III","title":"Menjaga Kelestarian Lingkungan","short":"Menjaga bumi, melarang kerusakan, dan menanam kebaikan.","island":"Pulau Hijau","emoji":"🌳","color":"#4ade80","color2":"#14532d","intro":"Pulau Hijau mulai kehilangan pohon dan sungainya keruh. Penjaga Rimba mengajakmu memahami bahwa merusak bumi adalah dosa, dan menanam adalah sedekah.","teacher":"Ustadzah Maryam","materi":[{"type":"inti","title":"Inti Materi","text":"Kerusakan alam adalah akibat perbuatan manusia. Islam melarang fasād (kerusakan) dan memerintahkan memelihara bumi. Menanam pohon dan menyedekahkan air adalah amal jariyah yang pahalanya terus mengalir."},{"type":"ayat","title":"Kerusakan di darat dan laut","quran":"30:41","tafsir":"Kerusakan tampak karena perbuatan tangan manusia. Allah memperlihatkan sebagian akibatnya agar manusia kembali ke jalan yang benar."},{"type":"ayat","title":"Larangan berbuat kerusakan","quran":"7:56","tafsir":"Jangan membuat kerusakan di muka bumi setelah Allah memperbaikinya. Berdoa dengan takut dan harap, karena rahmat Allah dekat bagi orang berbuat baik."},{"type":"ayat","title":"Penciptaan dengan hikmah","quran":"38:27","tafsir":"Langit dan bumi tidak diciptakan sia-sia. Menjaga lingkungan adalah bagian dari menghargai hikmah penciptaan."},{"type":"ayat","title":"Perilaku munafik terhadap alam","quran":"2:204-205","tafsir":"Ada orang yang ucapannya menarik, tetapi perbuatannya merusak tanaman dan ternak. Allah tidak menyukai kebinasaan."},{"type":"hadis","title":"Menanam adalah sedekah","text":"Tidaklah seorang mukmin menanam pohon atau menanam tanaman, lalu dimakan oleh manusia, burung, atau binatang, kecuali menjadi sedekah baginya.","source":"HR. Bukhari dan Muslim dari Anas bin Malik","tafsir":"Menanam memberi manfaat lintas generasi. Pahala mengalir selama tanaman itu memberi manfaat."},{"type":"nilai","title":"Nilai & Amalan","items":["Peduli: menjaga kebersihan lingkungan sekitar.","Tidak merusak: tidak membuang sampah sembarangan dan tidak menebang tanpa aturan.","Menanam: menghijaukan lingkungan dan menanam pohon.","Hemat energi: memakai air dan listrik sesuai kebutuhan."]}],"vocab":[{"term":"Fasād","meaning":"Kerusakan di muka bumi akibat perbuatan manusia."},{"term":"Amal jariyah","meaning":"Pahala yang terus mengalir karena manfaat yang ditinggalkan."},{"term":"Mafsadat","meaning":"Kerusakan atau kerugian yang ditimbulkan."},{"term":"Mushlih","meaning":"Orang yang memperbaiki dan mendatangkan maslahat."}],"ujian":[{"q":"Penyebab utama kerusakan alam menurut QS ar-Rum 30:41 adalah ...","options":["perbuatan tangan manusia","perubahan musim","kehendak makhluk halus","letusan gunung berapi"],"answer":0,"explain":"Ayat secara eksplisit menyebut 'perbuatan tangan manusia' sebagai sebab kerusakan."},{"q":"QS Shad 38:27 menegaskan bahwa penciptaan langit dan bumi ...","options":["tidak sia-sia, tetapi dengan hikmah","hanya untuk bersenang-senang","tidak bisa dipahami manusia","akan segera musnah tanpa sebab"],"answer":0,"explain":"Ayat menolak anggapan bahwa ciptaan Allah sia-sia. Ada hikmah yang harus dijaga."},{"q":"Contoh amal jariyah dari menanam pohon adalah ...","options":["membantu mengurangi polusi dan memberi naungan","menambah jumlah pohon untuk pamer","menanam tanpa merawat","menebang pohon untuk dijual"],"answer":0,"explain":"Manfaat pohon bagi lingkungan dan makhluk lain adalah amal jariyah yang terus mengalir."},{"q":"Sikap terhadap limbah plastik yang sesuai ajaran Islam adalah ...","options":["mengurangi, memilah, dan tidak membuang sembarangan","membakar di halaman rumah","membuang ke sungai agar hilang","menimbun di bawah tanah tanpa aturan"],"answer":0,"explain":"Prinsip tidak merusak dan menjaga maslahat mengharuskan pengelolaan limbah yang bertanggung jawab."},{"q":"Yang bukan termasuk tindakan merusak lingkungan adalah ...","options":["membuat kompos dari sisa makanan","membuang oli ke saluran air","menebang pohon tanpa izin","membakar sampah plastik"],"answer":0,"explain":"Membuat kompos adalah upaya memperbaiki lingkungan. Tiga pilihan lain jelas merusak."}],"values":["Peduli: menjaga kebersihan lingkungan sekitar.","Tidak merusak: tidak membuang sampah sembarangan dan tidak menebang tanpa aturan.","Menanam: menghijaukan lingkungan dan menanam pohon.","Hemat energi: memakai air dan listrik sesuai kebutuhan."]},{"id":4,"bab":"Bab IV","title":"Mengembangkan Ilmu & Teknologi","short":"Membaca, menuntut ilmu, dan selektif terhadap informasi.","island":"Pulau Nalar","emoji":"🧠","color":"#a78bfa","color2":"#4c1d95","intro":"Di Pulau Nalar, menara ilmu menjulang dan informasi mengalir deras. Cendekia Nalar mengajarkan bahwa ilmu adalah cahaya, tetapi harus dipakai dengan etika.","teacher":"Ustadz Ilham","materi":[{"type":"inti","title":"Inti Materi","text":"Islam memerintahkan membaca dan menuntut ilmu. Ilmu agama dan umum harus berjalan seiring. Informasi harus diseleksi dengan tabayun, dan teknologi digunakan untuk kebaikan."},{"type":"ayat","title":"Perintah membaca","quran":"96:1-5","tafsir":"Wahyu pertama adalah perintah membaca dengan nama Tuhan. Membaca membuka jalan menuju ilmu dan pemahaman."},{"type":"ayat","title":"Memperhatikan gejala alam","quran":"10:101","tafsir":"Perhatikan langit dan bumi serta pergantian malam dan siang. Di sana ada tanda bagi orang yang berakal."},{"type":"ayat","title":"Tabayun: periksa berita","quran":"49:6","tafsir":"Jika datang orang fasik membawa berita, periksa dengan teliti agar tidak menimpakan musibah kepada kaum yang tidak bersalah karena kesalahan informasi."},{"type":"hadis","title":"Keutamaan mencari ilmu","text":"Barangsiapa menempuh jalan untuk mencari ilmu, Allah akan memudahkan baginya jalan menuju surga. Sesungguhnya para malaikat menurunkan sayapnya bagi pencari ilmu, dan makhluk di langit dan bumi memohonkan ampun bagi orang berilmu. Keutamaan orang berilmu atas ahli ibadah seperti keutamaan bulan atas bintang.","source":"HR. Abu Dawud dan Tirmidzi dari Abu Darda","tafsir":"Ilmu memberi kemuliaan dan membuka jalan kebaikan. Pencari ilmu didukung oleh makhluk Allah."},{"type":"nilai","title":"Nilai & Amalan","items":["Tekun: membaca dan belajar secara konsisten.","Kritis: memeriksa sumber sebelum percaya dan menyebar.","Etis: memakai teknologi tanpa merugikan orang lain.","Integratif: menghubungkan ilmu agama dan umum untuk kebaikan."]}],"vocab":[{"term":"Tabayun","meaning":"Memeriksa dan memastikan kebenaran informasi."},{"term":"Hoaks","meaning":"Informasi bohong yang disebarkan seolah benar."},{"term":"Integrasi ilmu","meaning":"Menggabungkan ilmu agama dan umum secara seimbang."},{"term":"Etika digital","meaning":"Aturan santun dan tanggung jawab dalam memakai teknologi."}],"ujian":[{"q":"QS Yunus 10:101 memerintahkan manusia memperhatikan ...","options":["tanda-tanda kebesaran Allah di langit dan bumi","harta dan kekayaan","perbedaan suku","jumlah penduduk"],"answer":0,"explain":"Ayat mengajak memperhatikan ciptaan Allah sebagai sumber ilmu dan iman."},{"q":"Integrasi ilmu agama dan umum berarti ...","options":["keduanya saling mendukung dalam mencari kebenaran dan kebaikan","ilmu agama lebih rendah dari ilmu umum","ilmu umum tidak perlu etika","keduanya harus dipisahkan sepenuhnya"],"answer":0,"explain":"Integrasi berarti ilmu agama memberi nilai dan arah, ilmu umum memberi cara dan manfaat."},{"q":"Pemanfaatan AI yang sesuai etika Islam adalah ...","options":["membantu belajar dengan tetap memeriksa kebenarannya","menyalin tugas tanpa memahami","membuat konten bohong","menipu dengan hasil AI"],"answer":0,"explain":"Teknologi boleh membantu, tetapi kejujuran dan tanggung jawab tetap wajib."},{"q":"Tabayun artinya ...","options":["memeriksa dan memastikan kebenaran informasi","menyebar informasi dengan cepat","menghindari semua berita","membalas semua komentar"],"answer":0,"explain":"Tabayun adalah langkah verifikasi sebelum menerima atau menyebarkan informasi."},{"q":"Yang bukan sikap terhadap ilmu adalah ...","options":["malu bertanya karena takut dianggap bodoh","tekun membaca","kritis terhadap sumber","mengamalkan ilmu"],"answer":0,"explain":"Malu bertanya menghambat ilmu. Rasulullah menganjurkan bertanya dengan santun."}],"values":["Tekun: membaca dan belajar secara konsisten.","Kritis: memeriksa sumber sebelum percaya dan menyebar.","Etis: memakai teknologi tanpa merugikan orang lain.","Integratif: menghubungkan ilmu agama dan umum untuk kebaikan."]},{"id":5,"bab":"Bab V","title":"Mendakwahkan Keramahan Islam","short":"Dakwah dengan hikmah, lemah lembut, dan tanpa paksaan.","island":"Pulau Rahmah","emoji":"🕊️","color":"#fb7185","color2":"#881337","intro":"Pulau Rahmah adalah tempat orang-orang dari berbagai latar bertemu. Dai Rahmah mengajarkan bahwa dakwah bukan memenangkan debat, tetapi menanam cinta dan kebenaran.","teacher":"Ustadzah Rahma","materi":[{"type":"inti","title":"Inti Materi","text":"Dakwah adalah kewajiban, tetapi harus dengan hikmah, mau'idhah hasanah, dan mujadalah yang baik. Islam adalah rahmatan lil alamin dan tidak ada paksaan dalam beragama. Kelembutan adalah senjata dakwah yang paling kuat."},{"type":"ayat","title":"Metode dakwah","quran":"16:125","tafsir":"Serulah dengan hikmah, pelajaran yang baik, dan bantahlah dengan cara yang baik. Allah lebih tahu siapa yang tersesat dan siapa yang mendapat petunjuk."},{"type":"ayat","title":"Rahmat bagi seluruh alam","quran":"21:107","tafsir":"Rasulullah diutus sebagai rahmat bagi seluruh alam. Dakwah harus membawa manfaat bagi semua, bukan hanya untuk kelompok sendiri."},{"type":"ayat","title":"Dakwah terang-terangan","quran":"15:94-95","tafsir":"Sampaikan perintah Allah secara terang-terangan dan berpalinglah dari orang musyrik. Keberanian menyampaikan kebenaran tidak berarti menyerang pribadi."},{"type":"ayat","title":"Mulai dari keluarga terdekat","quran":"26:214-216","tafsir":"Berilah peringatan kepada kerabat terdekat dan rendahkanlah diri terhadap orang yang mengikutimu. Dakwah dimulai dari lingkungan terdekat dengan kelembutan."},{"type":"hadis","title":"Kelembutan menghiasi perbuatan","text":"Sesungguhnya kelembutan tidak diberikan kepada sesuatu melainkan akan menghiasinya, dan tidak dicabut dari sesuatu melainkan akan membuatnya cacat.","source":"HR. Muslim","tafsir":"Kelembutan memperindah dakwah dan hubungan sosial. Kekerasan justru merusak pesan yang ingin disampaikan."},{"type":"nilai","title":"Nilai & Amalan","items":["Hikmah: menyampaikan kebenaran dengan cara yang tepat.","Lembut: tidak menghina dan tidak memaksa.","Toleran: menghargai perbedaan dan menjaga kerukunan.","Jujur: tidak membesar-besarkan kebaikan sendiri."]}],"vocab":[{"term":"Hikmah","meaning":"Kebijaksanaan menyampaikan pesan sesuai konteks dan audiens."},{"term":"Mau'idhah hasanah","meaning":"Nasihat yang baik dan menyentuh hati."},{"term":"Mujadalah","meaning":"Debat atau bantahan dengan cara yang baik."},{"term":"Rahmatan lil alamin","meaning":"Rahmat bagi seluruh alam."}],"ujian":[{"q":"QS asy-Syu'ara 26:214-216 memerintahkan Nabi mengajak ...","options":["kerabat terdekat dengan cara yang lemah lembut","orang asing dengan paksaan","hanya orang kaya","hanya musuh"],"answer":0,"explain":"Ayat memerintahkan dakwah dimulai dari kerabat terdekat dengan kelembutan."},{"q":"Mujadalah yang baik artinya ...","options":["berdebat dengan cara santun dan berbasis dalil","menghina lawan bicara","memaksa agar diikuti","menghindari diskusi sama sekali"],"answer":0,"explain":"Mujadalah yang baik menjaga adab dan menggunakan argumen yang benar."},{"q":"Yang bukan ciri dakwah rahmatan lil alamin adalah ...","options":["menghina keyakinan orang lain","menjaga kerukunan","menyampaikan kebaikan","menghargai perbedaan"],"answer":0,"explain":"Menghina keyakinan orang lain bertentangan dengan rahmat dan akhlak Islam."},{"q":"Jika lawan bicara menolak dakwah, sikap yang tepat adalah ...","options":["tetap santun dan tidak memaksa","memaki dan mengancam","menyebar fitnah","memutus semua hubungan"],"answer":0,"explain":"Keberhasilan dakwah tidak diukur dari paksaan, tetapi dari kesantunan dan kebenaran pesan."},{"q":"Hadis tentang kelembutan mengajarkan bahwa ...","options":["kelembutan memperindah dan mendatangkan kebaikan","kelembutan hanya untuk orang lemah","kekerasan lebih efektif","kelembutan tidak perlu dalam dakwah"],"answer":0,"explain":"Hadis Muslim menegaskan bahwa kelembutan menghiasi perbuatan dan ketiadaannya membuat cacat."}],"values":["Hikmah: menyampaikan kebenaran dengan cara yang tepat.","Lembut: tidak menghina dan tidak memaksa.","Toleran: menghargai perbedaan dan menjaga kerukunan.","Jujur: tidak membesar-besarkan kebaikan sendiri."]},{"id":6,"bab":"Bab VI","title":"Membudayakan Amar Makruf Nahi Mungkar","short":"Berani menegakkan kebaikan dan mencegah keburukan.","island":"Pulau Amar","emoji":"🛡️","color":"#fbbf24","color2":"#92400e","intro":"Pulau Amar dijaga oleh Pembela Amar. Di sini, diam terhadap keburukan bukan tanda damai, melainkan membiarkan keburukan tumbuh. Keberanian harus dibarengi kebijaksanaan.","teacher":"Ustadz Amar","materi":[{"type":"inti","title":"Inti Materi","text":"Amar makruf nahi mungkar adalah kewajiban, tetapi harus sesuai kemampuan dan adab. Ada tiga tingkatan: dengan tangan, dengan lisan, dan dengan hati. Yang terlemah adalah dengan hati, yaitu membenci dan menghindari keburukan."},{"type":"ayat","title":"Kewajiban amar makruf nahi mungkar","quran":"3:104","tafsir":"Hendaklah ada di antara kamu segolongan umat yang menyeru kebajikan, menyuruh yang ma'ruf, dan mencegah yang munkar. Mereka adalah orang-orang yang beruntung."},{"type":"ayat","title":"Umat terbaik","quran":"3:110","tafsir":"Kamu adalah umat terbaik yang dilahirkan untuk manusia karena menyuruh yang ma'ruf, mencegah yang munkar, dan beriman kepada Allah."},{"type":"ayat","title":"Dampak diam terhadap mungkar","quran":"5:78-79","tafsir":"Bani Israil dilaknat karena durhaka dan melampaui batas, serta tidak saling melarang tindakan munkar. Diam terhadap keburukan dapat merusak masyarakat."},{"type":"hadis","title":"Tiga tingkatan mengubah mungkar","text":"Barangsiapa melihat kemungkaran, hendaklah mengubahnya dengan tangannya; jika tidak mampu, dengan lisannya; jika tidak mampu, dengan hatinya, dan itu selemah-lemah iman.","source":"HR. Muslim dari Abu Sa'id","tafsir":"Hadis memberi panduan bertingkat. Yang penting adalah tidak diam ketika mampu berbuat sesuatu."},{"type":"nilai","title":"Nilai & Amalan","items":["Berani: menegur keburukan dengan cara yang tepat.","Bijak: memilih tingkat yang sesuai kemampuan dan risiko.","Peduli: tidak membiarkan orang lain dirugikan.","Ikhlas: menegur karena Allah, bukan karena mencari sensasi."]}],"vocab":[{"term":"Ma'ruf","meaning":"Kebaikan yang dikenal dan disepakati secara syariat."},{"term":"Munkar","meaning":"Keburukan yang ditolak oleh syariat dan akal sehat."},{"term":"Amar makruf","meaning":"Menyuruh kepada kebaikan."},{"term":"Nahi mungkar","meaning":"Mencegah dari keburukan."}],"ujian":[{"q":"QS Ali Imran 3:104 menyebutkan bahwa umat yang menyeru kebaikan ...","options":["adalah orang-orang yang beruntung","akan selalu kaya","tidak pernah salah","cukup berdoa saja"],"answer":0,"explain":"Ayat menegaskan keberuntungan bagi mereka yang menyeru kebaikan dan mencegah keburukan."},{"q":"Tingkatan amar makruf nahi mungkar yang paling lemah adalah ...","options":["dengan hati","dengan tangan","dengan lisan","dengan tulisan"],"answer":0,"explain":"Hadis Abu Sa'id menyebut hati sebagai tingkat selemah-lemah iman."},{"q":"Contoh nahi mungkar dengan lisan adalah ...","options":["menegur teman yang berkata kasar dengan santun","memukul pelaku","diam tanpa berbuat apa pun","menyebar video pelaku"],"answer":0,"explain":"Nahi mungkar dengan lisan dilakukan melalui teguran, nasihat, atau klarifikasi yang santun."},{"q":"Syarat menegur kemungkaran adalah ...","options":["mengetahui keadaan, mampu, dan tidak menimbulkan kerusakan lebih besar","selalu dengan kekerasan","tanpa melihat risiko","hanya untuk orang yang tidak disukai"],"answer":0,"explain":"Prinsip fikih memperhatikan kemampuan, pengetahuan, dan akibat dari tindakan."},{"q":"Dampak diam terhadap kemungkaran adalah ...","options":["kemungkaran menyebar dan pelaku tidak sadar","masalah selesai dengan sendirinya","tidak ada dampak apa pun","semua orang menjadi kaya"],"answer":0,"explain":"Diam membuat keburukan dianggap wajar dan merusak nilai masyarakat."}],"values":["Berani: menegur keburukan dengan cara yang tepat.","Bijak: memilih tingkat yang sesuai kemampuan dan risiko.","Peduli: tidak membiarkan orang lain dirugikan.","Ikhlas: menegur karena Allah, bukan karena mencari sensasi."]},{"id":7,"bab":"Bab VII","title":"Membudayakan Musyawarah","short":"Mendengar semua suara, memutuskan dengan hikmah.","island":"Pulau Syura","emoji":"🤝","color":"#2dd4bf","color2":"#134e4a","intro":"Di Pulau Syura, setiap suara didengar. Bijak Syura mengajarkan bahwa keputusan terbaik lahir dari musyawarah, bukan dari suara paling keras.","teacher":"Ustadz Syura","materi":[{"type":"inti","title":"Inti Materi","text":"Musyawarah adalah jalan Islam dalam mengambil keputusan. Pemimpin harus lemah lembut, menghargai pendapat, dan amanah. Keputusan diambil setelah mendengar semua pihak, lalu dijalankan bersama."},{"type":"ayat","title":"Musyawarah dalam mengambil keputusan","quran":"3:159","tafsir":"Karena rahmat Allah, Nabi berlaku lemah lembut. Maafkan, mohon ampun, dan bermusyawaratlah dalam urusan. Setelah memutuskan, bertawakallah kepada Allah."},{"type":"ayat","title":"Urusan orang mukmin","quran":"42:38","tafsir":"Orang mukmin mendirikan shalat dan mengatur urusan mereka dengan musyawarah. Musyawarah adalah bagian dari gaya hidup beriman."},{"type":"ayat","title":"Kesetaraan di hadapan Allah","quran":"49:13","tafsir":"Manusia diciptakan dari laki-laki dan perempuan, berbangsa dan bersuku agar saling mengenal. Yang paling mulia adalah yang paling bertakwa. Perbedaan bukan alasan untuk tidak bermusyawarah."},{"type":"hadis","title":"Pemimpin yang dicintai rakyat","text":"Sebaik-baik pemimpin adalah yang dicintai rakyatnya dan rakyat mencintainya; ia melindungi mereka dan mereka melindunginya. Pemimpin yang buruk adalah yang dibenci rakyatnya dan rakyat membencinya.","source":"HR. Muslim dari Malik al-Asyja'i","tafsir":"Kepemimpinan yang baik lahir dari hubungan saling percaya dan melindungi, bukan dari ketakutan."},{"type":"hadis","title":"Setiap pemimpin adalah amanah","text":"Setiap kalian adalah pemimpin dan setiap pemimpin akan dimintai pertanggungjawaban atas yang dipimpinnya.","source":"HR. Bukhari dan Muslim","tafsir":"Musyawarah dan kepemimpinan adalah amanah. Setiap keputusan harus dapat dipertanggungjawabkan."},{"type":"nilai","title":"Nilai & Amalan","items":["Mendengar: memberi kesempatan kepada semua pihak.","Menghargai: tidak memotong pembicara dan tidak merendahkan pendapat.","Amanah: memimpin dengan jujur dan bertanggung jawab.","Keputusan bersama: menerima hasil musyawarah dengan lapang dada."]}],"vocab":[{"term":"Musyawarah","meaning":"Berdiskusi untuk mencapai keputusan terbaik bersama."},{"term":"Syura","meaning":"Istilah lain untuk musyawarah."},{"term":"Amanah","meaning":"Tanggung jawab yang harus dijalankan dengan jujur."},{"term":"Tawakal","meaning":"Berserah kepada Allah setelah berusaha dan bermusyawarah."}],"ujian":[{"q":"Keputusan musyawarah yang baik adalah ...","options":["keputusan yang terbaik untuk semua, bukan sekadar suara terbanyak","keputusan yang disukai pemimpin","keputusan yang paling cepat","keputusan yang menguntungkan kelompok sendiri"],"answer":0,"explain":"Musyawarah mencari maslahat bersama, bukan sekadar menang suara atau kepentingan pribadi."},{"q":"Jika pendapatmu tidak dipilih dalam musyawarah, sikap yang tepat adalah ...","options":["menerima dengan lapang dada dan mendukung keputusan","keluar dari kelompok","menyebar fitnah","memaksa agar pendapatmu dipakai"],"answer":0,"explain":"Setelah musyawarah, keputusan bersama harus dijalankan dengan ikhlas dan tanggung jawab."},{"q":"Contoh musyawarah di sekolah adalah ...","options":["rapat OSIS menentukan acara dengan mendengar semua perwakilan","ketua kelas memutuskan sendiri tanpa bertanya","guru memilih tanpa mendengar siswa","siswa memilih tanpa aturan"],"answer":0,"explain":"Musyawarah melibatkan semua pihak yang berkepentingan dan mendengar pendapat mereka."},{"q":"Sifat pemimpin yang disenangi rakyat menurut hadis adalah ...","options":["mencintai rakyatnya dan melindungi mereka","suka memerintah tanpa mendengar","mementingkan diri sendiri","menghukum tanpa alasan"],"answer":0,"explain":"Hadis Malik al-Asyja'i menggambarkan pemimpin yang dicintai karena melindungi rakyatnya."},{"q":"Yang bukan adab musyawarah adalah ...","options":["memaksakan pendapat sendiri","mendengar dengan sabar","menghargai perbedaan","menyampaikan pendapat dengan santun"],"answer":0,"explain":"Memaksakan pendapat menutup ruang dialog dan merusak semangat musyawarah."}],"values":["Mendengar: memberi kesempatan kepada semua pihak.","Menghargai: tidak memotong pembicara dan tidak merendahkan pendapat.","Amanah: memimpin dengan jujur dan bertanggung jawab.","Keputusan bersama: menerima hasil musyawarah dengan lapang dada."]},{"id":8,"bab":"Bab VIII","title":"Berperilaku Adil & Jujur","short":"Keadilan dan kejujuran adalah fondasi kehidupan.","island":"Pulau Adil","emoji":"⚖️","color":"#f6c453","color2":"#78350f","intro":"Pulau Adil punya istana keadilan. Hakim Adil mengajarkan bahwa kebenaran tidak boleh dipengaruhi kedekatan, ketakutan, atau keuntungan pribadi.","teacher":"Ustadz Adil","materi":[{"type":"inti","title":"Inti Materi","text":"Keadilan dan kejujuran adalah fondasi kehidupan. Islam melarang berkhianat, menipu, dan memihak karena kedekatan. Kejujuran membawa kebaikan; dusta membawa keburukan."},{"type":"ayat","title":"Bersaksi dengan adil","quran":"5:8","tafsir":"Jadilah orang yang menegakkan kebenaran karena Allah dan bersaksi dengan adil. Kebencian terhadap kaum tidak boleh mendorong berlaku tidak adil."},{"type":"ayat","title":"Bersama orang yang benar","quran":"9:119","tafsir":"Bertakwalah kepada Allah dan hendaklah kamu bersama orang-orang yang benar. Kejujuran menuntut lingkungan dan pilihan yang benar."},{"type":"ayat","title":"Perintah berlaku adil","quran":"16:90","tafsir":"Allah memerintahkan berlaku adil dan berbuat kebajikan, memberi kepada kerabat, serta melarang perbuatan keji, mungkar, dan permusuhan."},{"type":"ayat","title":"Jangan membela yang khianat","quran":"4:105","tafsir":"Kami menurunkan Kitab dengan kebenaran agar kamu mengadili dengan adil. Jangan menjadi penantang karena membela orang yang khianat."},{"type":"hadis","title":"Jujur membawa kebaikan","text":"Jujur itu membawa kepada kebaikan, dan kebaikan membawa ke surga. Seorang hamba terus jujur dan mencari kebenaran hingga dicatat di sisi Allah sebagai orang yang sangat jujur. Dusta membawa kepada keburukan, dan keburukan membawa ke neraka.","source":"HR. Muslim dari Abdullah","tafsir":"Kejujuran adalah jalan yang membentuk karakter. Dusta, sekecil apa pun, dapat menuntun pada keburukan."},{"type":"nilai","title":"Nilai & Amalan","items":["Adil: memberi hak kepada semua pihak tanpa memihak.","Jujur: mengatakan yang benar dan tidak menipu.","Amanah: menjaga titipan dan tanggung jawab.","Berani: mengakui kesalahan dan memperbaikinya."]}],"vocab":[{"term":"Adil","meaning":"Memberi hak kepada setiap pihak secara seimbang."},{"term":"Jujur","meaning":"Mengatakan dan berbuat sesuai kebenaran."},{"term":"Khianat","meaning":"Mengkhianati amanah atau kepercayaan."},{"term":"Amanah","meaning":"Tanggung jawab yang harus dijaga dengan benar."}],"ujian":[{"q":"QS an-Nahl 16:90 memerintahkan ...","options":["berlaku adil dan berbuat kebajikan","mementingkan diri sendiri","menimbun harta","menghindari orang lain"],"answer":0,"explain":"Ayat memerintahkan keadilan, kebajikan, memberi kepada kerabat, dan melarang keburukan."},{"q":"Dampak dusta adalah ...","options":["menyesatkan dan merusak kepercayaan","menambah ilmu","meningkatkan derajat","mendatangkan berkah"],"answer":0,"explain":"Dusta merusak kepercayaan dan menuntun pada keburukan, sebagaimana dijelaskan hadis."},{"q":"Amanah dalam menjawab ujian berarti ...","options":["menjawab dengan kemampuan sendiri","menyontek agar nilainya bagus","membeli jawaban","membiarkan teman menyontek"],"answer":0,"explain":"Amanah berarti menjaga kepercayaan dan menunjukkan kemampuan yang sebenarnya."},{"q":"Jika menemukan teman berbuat curang, sikap yang tepat adalah ...","options":["menegur dengan bijak dan melaporkan jika perlu","ikut berbuat curang","diam tanpa bertindak","menyebar fitnah"],"answer":0,"explain":"Kejujuran dan keadilan menuntut keberanian menegur dengan cara yang santun dan bertanggung jawab."},{"q":"Yang bukan sikap adil adalah ...","options":["memihak teman meskipun salah","memberi kesempatan kepada semua","mendengar kedua pihak","memutuskan dengan bukti"],"answer":0,"explain":"Keadilan tidak memihak karena kedekatan, tetapi berpegang pada bukti dan kebenaran."}],"values":["Adil: memberi hak kepada semua pihak tanpa memihak.","Jujur: mengatakan yang benar dan tidak menipu.","Amanah: menjaga titipan dan tanggung jawab.","Berani: mengakui kesalahan dan memperbaikinya."]}],"teachers":{"1":{"name":"Ustadzah Laila","emoji":"🧕","color":"#34d399","greeting":"Assalamu'alaikum, Penjaga Hikmah. Selamat datang di Rumah Ilmu I.","snippet":"Hidup sederhana bukan berarti miskin. QS al-Furqan 25:67 mengajarkan kita tidak boros dan tidak kikir, serta peduli kepada dhuafa."},"2":{"name":"Ustadz Fauzan","emoji":"🧑‍🏫","color":"#38bdf8","greeting":"Assalamu'alaikum. Rumah Ilmu II mengajarkan kesabaran.","snippet":"Sabar bukan pasrah tanpa usaha. QS al-Baqarah 2:155 mengajarkan sabar sambil berikhtiar dan tetap optimis."},"3":{"name":"Ustadzah Maryam","emoji":"👩‍🏫","color":"#4ade80","greeting":"Selamat datang di Rumah Ilmu III, rumah para penjaga bumi.","snippet":"Menjaga lingkungan adalah amanah. QS al-A'raf 7:56 melarang manusia berbuat kerusakan di muka bumi."},"4":{"name":"Ustadz Ilham","emoji":"🧑‍🔬","color":"#a78bfa","greeting":"Rumah Ilmu IV adalah rumah ilmu dan teknologi.","snippet":"Ilmu adalah cahaya. QS al-Alaq 96:1 memerintahkan membaca, dan QS al-Hujurat 49:6 mengajarkan tabayun."},"5":{"name":"Ustadzah Rahma","emoji":"🧕","color":"#fb7185","greeting":"Rumah Ilmu V mengajarkan keramahan Islam.","snippet":"Dakwah dilakukan dengan hikmah dan kelembutan. QS an-Nahl 16:125 dan hadis tentang kelembutan menjadi pegangan."},"6":{"name":"Ustadz Amar","emoji":"🧑‍🦱","color":"#fbbf24","greeting":"Rumah Ilmu VI mengajarkan keberanian yang bijak.","snippet":"Amar makruf nahi mungkar dilakukan sesuai kemampuan: dengan tangan, lisan, atau hati. Hadis Abu Sa'id menjelaskan tiga tingkatannya."},"7":{"name":"Ustadz Syura","emoji":"🧑‍💼","color":"#2dd4bf","greeting":"Rumah Ilmu VII adalah rumah musyawarah.","snippet":"Musyawarah adalah jalan orang mukmin. QS asy-Syura 42:38 menyebut urusan mereka diputuskan dengan musyawarah."},"8":{"name":"Ustadz Adil","emoji":"🧑‍⚖️","color":"#f6c453","greeting":"Rumah Ilmu VIII adalah rumah keadilan dan kejujuran.","snippet":"Keadilan dan kejujuran adalah fondasi. QS al-Ma'idah 5:8 memerintahkan bersaksi dengan adil, dan hadis menjelaskan kejujuran membawa kebaikan."}},"npcs":[{"id":"mentor","name":"Ustadz Hakim","role":"Guru Pembimbing","emoji":"🧑‍🏫","color":"#f6c453","x":30,"y":24,"type":"mentor","greeting":"Assalamu'alaikum, Penjaga Hikmah. Selamat datang di Desa Nusantara.","snippet":"Di desa ini, ilmu adalah cahaya dan akhlak adalah lentera. Delapan Rumah Ilmu menunggu. Setiap rumah punya guru dan ujian. Lulus ujian untuk membuka rumah berikutnya. Kamu juga bisa bercocok tanam, membeli buku, dan beristirahat."},{"id":"t1","name":"Ustadzah Laila","role":"Guru Bab I","emoji":"🧕","color":"#34d399","x":11,"y":13,"type":"teacher","chapterId":1,"greeting":"Assalamu'alaikum, Penjaga Hikmah. Selamat datang di Rumah Ilmu I.","snippet":"Hidup sederhana bukan berarti miskin. QS al-Furqan 25:67 mengajarkan kita tidak boros dan tidak kikir, serta peduli kepada dhuafa."},{"id":"t2","name":"Ustadz Fauzan","role":"Guru Bab II","emoji":"🧑‍🏫","color":"#38bdf8","x":25,"y":11,"type":"teacher","chapterId":2,"greeting":"Assalamu'alaikum. Selamat datang di Rumah Ilmu II.","snippet":"Sabar bukan pasrah tanpa usaha. QS al-Baqarah 2:155 mengajarkan sabar sambil berikhtiar dan tetap optimis."},{"id":"t3","name":"Ustadzah Maryam","role":"Guru Bab III","emoji":"👩‍🏫","color":"#4ade80","x":39,"y":13,"type":"teacher","chapterId":3,"greeting":"Selamat datang di Rumah Ilmu III, rumah para penjaga bumi.","snippet":"Menjaga lingkungan adalah amanah. QS al-A'raf 7:56 melarang manusia berbuat kerusakan di muka bumi."},{"id":"t4","name":"Ustadz Ilham","role":"Guru Bab IV","emoji":"🧑‍🔬","color":"#a78bfa","x":53,"y":15,"type":"teacher","chapterId":4,"greeting":"Rumah Ilmu IV adalah rumah ilmu dan teknologi.","snippet":"Ilmu adalah cahaya. QS al-Alaq 96:1 memerintahkan membaca, dan QS al-Hujurat 49:6 mengajarkan tabayun."},{"id":"t5","name":"Ustadzah Rahma","role":"Guru Bab V","emoji":"🧕","color":"#fb7185","x":11,"y":35,"type":"teacher","chapterId":5,"greeting":"Rumah Ilmu V mengajarkan keramahan Islam.","snippet":"Dakwah dilakukan dengan hikmah dan kelembutan. QS an-Nahl 16:125 dan hadis tentang kelembutan menjadi pegangan."},{"id":"t6","name":"Ustadz Amar","role":"Guru Bab VI","emoji":"🧑‍🦱","color":"#fbbf24","x":25,"y":37,"type":"teacher","chapterId":6,"greeting":"Rumah Ilmu VI mengajarkan keberanian yang bijak.","snippet":"Amar makruf nahi mungkar dilakukan sesuai kemampuan: dengan tangan, lisan, atau hati. Hadis Abu Sa'id menjelask . Jika belum mencapai, siswa mengulang dengan soal baru dan mendapat rekomendasi belajar.","activity":"Boss quiz 5 soal, remedial terarah, dan portofolio nilai.","output":"Status tuntas per bab dan bukti penguasaan (mastery evidence).","principle":"Mastery learning, criterion-referenced assessment, dan feedback."},{"no":6,"name":"Refleksi & Sertifikasi","game":"Buku Hikmah","icon":"📜","color":"#2dd4bf","desc":"Siswa menutup perjalanan dengan jurnal refleksi, penilaian diri, lencana, dan sertifikat. Guru memantau seluruh proses melalui dasbor kelas.","activity":"Jurnal refleksi, self-assessment, sertifikat, dan ekspor nilai.","output":"Portofolio refleksi, sertifikat, dan rekomendasi tindak lanjut guru.","principle":"Metacognition, self-assessment, dan teacher dashboard."}],"questionBank":{"1":[{"level":1,"type":"mcq","q":"QS al-Furqan 25:67 mengajarkan bahwa pembelanjaan harta yang baik adalah ...","options":["sebanyak mungkin untuk menimbun","di tengah-tengah antara boros dan kikir","hanya untuk kepentingan pribadi","tanpa memperhatikan kebutuhan"],"answer":1,"explain":"Ayat menyebut 'tidak berlebih-lebihan dan tidak kikir', lalu 'di tengah-tengah'. Itulah sikap moderat."},{"level":1,"type":"mcq","q":"Kata 'wa lam yaqturu' dalam QS al-Furqan 25:67 berarti ...","options":["dan tidak kikir","dan tidak marah","dan tidak lupa","dan tidak takut"],"answer":0,"explain":"'Yaqturu' berarti kikir atau meminimkan nafkah. Ayat melarang pemboros sekaligus kekikiran."},{"level":1,"type":"mcq","q":"QS al-Ma'un 107:1-7 mengkritik orang yang ...","options":["menghardik anak yatim dan tidak memberi makan miskin","tidak memiliki harta banyak","tidak pandai berbicara","tidak tinggal di kota"],"answer":0,"explain":"Ayat 2-3 menyebut penghardik terhadap anak yatim dan tidak menganjurkan memberi makan orang miskin."},{"level":1,"type":"mcq","q":"Hadis 'Sedekah tidak mengurangi harta...' riwayat ...","options":["Bukhari","Muslim","Abu Dawud","Tirmidzi"],"answer":1,"explain":"Hadis ini riwayat Muslim. Sedekah menambah kehormatan dan tidak mengurangi harta secara hakiki."},{"level":2,"type":"mcq","q":"Mengapa pemboros disebut sebagai 'saudara syaitan' dalam QS al-Isra 17:27?","options":["karena mengikuti jalan syaitan dalam membelanjakan harta","karena tidak memiliki harta","karena tidak mau bersedekah","karena tidak bekerja"],"answer":0,"explain":"Ayat menggambarkan pemboros sebagai orang yang mengikuti jalan syaitan dalam menghamburkan harta."},{"level":2,"type":"mcq","q":"Pesan utama kisah Qarun dalam QS al-Qasas 28:79-80 adalah ...","options":["harta selalu mendatangkan kebahagiaan","kemegahan harta yang dipamerkan dapat menyesatkan","orang kaya tidak perlu bersedekah","harta harus disembunyikan"],"answer":1,"explain":"Qarun memamerkan kekayaannya, lalu ditenggelamkan. Orang berilmu menegaskan pahala Allah lebih baik."},{"level":2,"type":"mcq","q":"Hadis 'Sedekah tidak mengurangi harta' mengajarkan bahwa ...","options":["berbagi mendatangkan berkah dan kehormatan","harta akan berkurang secara fisik","sedekah hanya untuk orang kaya","pemberian harus selalu diumumkan"],"answer":0,"explain":"Hadis menegaskan bahwa sedekah menambah kehormatan dan tidak mengurangi harta secara hakiki."},{"level":2,"type":"mcq","q":"'Hamba Rahman' dalam QS al-Furqan 25:67 digambarkan sebagai orang yang ...","options":["membelanjakan harta secara moderat","menimbun harta tanpa batas","tidak mau memberi apa pun","membelanjakan harta untuk pamer"],"answer":0,"explain":"Hamba Rahman membelanja harta secara moderat, tidak boros dan tidak kikir."},{"level":3,"type":"scenario","q":"Temanmu ingin membeli sepatu mahal untuk pamer, padahal uangnya terbatas. Sikap yang sesuai QS al-Furqan 25:67 adalah ...","options":["membeli juga agar tidak malu","menyarankan membeli yang sesuai kebutuhan","meminjam uang untuk membeli","membeli barang yang lebih mahal"],"answer":1,"explain":"Sikap moderat menempatkan kebutuhan di atas gengsi. Membeli sesuai kemampuan adalah wujud tidak israf."},{"level":3,"type":"scenario","q":"Kamu mendapat uang sisa. Sikap yang paling mencerminkan qana'ah adalah ...","options":["membeli barang mewah agar dihormati","mensyukuri dan membelanjakan untuk kebutuhan, bukan gengsi","menyimpan semua tanpa berbagi","membelanjakan semuanya sekaligus"],"answer":1,"explain":"Qana'ah adalah merasa cukup dan tidak memamerkan. Harta dipakai untuk kebutuhan dan kebaikan."},{"level":3,"type":"scenario","q":"Ada teman yang tidak punya buku. Tindakan yang paling sesuai ajaran Bab I adalah ...","options":["membiarkan karena bukan urusanmu","membantu meminjamkan buku tanpa mengumbar pujian","memberi buku tetapi meminta pujian","membeli buku untuk diri sendiri"],"answer":1,"explain":"Menyantuni dhuafa dilakukan dengan ikhlas dan tanpa riya. Membantu teman adalah wujud kepedulian."},{"level":3,"type":"scenario","q":"Kamu ingin bersedekah, tetapi harganya mahal. Sikap yang tepat adalah ...","options":["berhutang untuk bersedekah sebanyak mungkin","bersedekah sesuai kemampuan tanpa berlebih-lebihan","tidak bersedekah sama sekali","memberi semua harta hingga tidak cukup untuk diri sendiri"],"answer":1,"explain":"Sedekah tidak boleh sampai mengabaikan kebutuhan diri dan keluarga. Beri sesuai kemampuan."},{"level":4,"type":"analysis","q":"Perhatikan pernyataan: 'Aku membeli barang mahal agar dianggap kaya.' Analisis yang tepat adalah ...","options":["termasuk israf karena untuk gengsi, bukan kebutuhan","termasuk qana'ah karena membeli barang mahal","tidak ada masalah karena uang sendiri","termasuk sedekah karena membeli barang"],"answer":0,"explain":"Pembelian untuk pamer adalah israf. Ukuran kebutuhan dan kemampuan menjadi patokan."},{"level":4,"type":"analysis","q":"Mengapa Qarun disebut sebagai contoh orang yang tidak bersyukur?","options":["karena memamerkan harta dan lupa kepada Allah","karena tidak memiliki harta","karena tidak bekerja","karena tidak punya keluarga"],"answer":0,"explain":"Qarun memamerkan harta dan mengabaikan hak orang lain. uskan, bertawakal."},{"level":2,"type":"mcq","q":"Hadis 'setiap pemimpin akan dimintai pertanggungjawaban' mengajarkan bahwa ...","options":["kepemimpinan adalah amanah","pemimpin tidak boleh salah","rakyat tidak perlu ikut bertanggung jawab","kepemimpinan adalah hak istimewa"],"answer":0,"explain":"Kepemimpinan adalah amanah yang harus dipertanggungjawabkan di dunia dan akhirat."},{"level":3,"type":"scenario","q":"Rapat OSIS terbelah. Sikap yang tepat adalah ...","options":["memaksakan pendapat sendiri","mendengar semua dan mencari solusi terbaik","menunda tanpa keputusan","mengusir yang berbeda pendapat"],"answer":1,"explain":"Musyawarah yang sehat mendengar semua pihak dan mencari solusi terbaik. Memaksakan pendapat menutup ruang dialog."},{"level":3,"type":"scenario","q":"Pendapatmu tidak dipilih. Sikap yang tepat adalah ...","options":["keluar dari kelompok","menerima dengan lapang dada dan mendukung keputusan","menyebar fitnah","memaksa agar pendapatmu dipakai"],"answer":1,"explain":"Setelah musyawarah, keputusan bersama harus dijalankan dengan ikhlas dan tanggung jawab."},{"level":3,"type":"scenario","q":"Temanmu tidak terpilih dan kecewa. Sikap yang tepat adalah ...","options":["mengajaknya berkontribusi","menyebar berita bahwa ia tidak mampu","membiarkan","menghina"],"answer":0,"explain":"Pemimpin yang baik merangkul semua, termasuk yang tidak sependapat. Memberi peran yang bermakna adalah wujud kepedulian."},{"level":3,"type":"scenario","q":"Kamu dicalonkan menjadi ketua. Sikap yang tepat adalah ...","options":["menjanjikan hal muluk agar menang","menyampaikan program realistis dan mendengar masukan","tidak maju karena takut kalah","menyerang lawan"],"answer":1,"explain":"Kejujuran dan musyawarah adalah dasar kepemimpinan yang dipercaya. Janji palsu merusak kepercayaan."},{"level":4,"type":"analysis","q":"'Musyawarah bukan untuk mengalahkan' berarti ...","options":["mencari kebaikan bersama, bukan menang sendiri","harus selalu ada yang kalah","hanya untuk orang kuat","tidak perlu mendengar"],"answer":0,"explain":"Musyawarah mencari maslahat bersama, bukan mengalahkan pihak lain. Semua pihak dihargai."},{"level":4,"type":"analysis","q":"Mengapa perbedaan pendapat perlu dihargai?","options":["karena bisa membuka perspektif dan solusi","karena semua pendapat salah","karena tidak ada kebenaran","karena harus selalu sepakat"],"answer":0,"explain":"Perbedaan pendapat dapat membuka perspektif dan solusi yang lebih baik. Yang penting adalah adab dan tujuan bersama."},{"level":4,"type":"analysis","q":"Perhatikan pernyataan: 'Pemimpin yang baik adalah yang selalu menang.' Analisis yang tepat adalah ...","options":["salah; pemimpin baik mendengar dan mengayomi","benar; pemimpin harus menang","benar; rakyat harus takut","salah; pemimpin tidak perlu mendengar"],"answer":0,"explain":"Pemimpin yang baik mendengar, mengayomi, dan mengambil keputusan terbaik. Menang sendiri bukan tujuan musyawarah."},{"level":4,"type":"analysis","q":"Hubungan antara musyawarah dan amanah adalah ...","options":["musyawarah menghasilkan keputusan yang lebih baik, amanah menjaga pelaksanaannya","keduanya tidak berhubungan","musyawarah hanya untuk pemimpin","amanah hanya untuk rakyat"],"answer":0,"explain":"Musyawarah menghasilkan keputusan yang lebih baik; amanah menuntut pelaksanaan yang bertanggung jawab."},{"level":5,"type":"evaluation","q":"Program 'Rapat Kelas' yang paling efektif adalah ...","options":["semua siswa didengar, keputusan dicatat, dan dievaluasi","hanya guru yang menentukan","tanpa mencatat keputusan","tanpa evaluasi"],"answer":0,"explain":"Rapat yang efektif memberi ruang kepada semua, mencatat keputusan, dan mengevaluasi pelaksanaannya."},{"level":5,"type":"evaluation","q":"Kamu diminta membuat aturan kelas. Yang paling tepat adalah ...","options":["disusun bersama dan disepakati","hanya oleh guru","menguntungkan kelompok tertentu","tidak perlu aturan"],"answer":0,"explain":"Aturan yang baik disusun bersama dan disepakati. Ini melat  dan melarang keburukan."},{"level":1,"type":"mcq","q":"QS an-Nisa 4:105 melarang ...","options":["membela orang yang khianat","berlaku adil","mengadili dengan benar","mendengar bukti"],"answer":0,"explain":"Ayat melarang menjadi penantang karena membela orang yang khianat. Keadilan harus tetap ditegakkan."},{"level":1,"type":"mcq","q":"Hadis kejujuran membawa kebaikan riwayat ...","options":["Bukhari","Muslim","Abu Dawud","Tirmidzi"],"answer":1,"explain":"Hadis Abdullah r.a. riwayat Muslim. Kejujuran membawa kebaikan; dusta membawa keburukan."},{"level":2,"type":"mcq","q":"Makna adil adalah ...","options":["memberi hak kepada setiap pihak","memihak yang kuat","menghindari semua orang","mengikuti hawa nafsu"],"answer":0,"explain":"Adil adalah memberi hak kepada setiap pihak secara seimbang, tanpa memihak karena kedekatan."},{"level":2,"type":"mcq","q":"Makna jujur adalah ...","options":["mengatakan dan berbuat sesuai kebenaran","mengatakan yang menyenangkan","menyembunyikan kesalahan","mengikuti orang lain"],"answer":0,"explain":"Jujur adalah mengatakan dan berbuat sesuai kebenaran, meskipun tidak ada yang melihat."},{"level":2,"type":"mcq","q":"Mengapa dusta berbahaya?","options":["karena menyesatkan dan merusak kepercayaan","karena menambah ilmu","karena mendatangkan berkah","karena tidak ada dampak"],"answer":0,"explain":"Dusta menyesatkan dan merusak kepercayaan. Hadis menjelaskan bahwa dusta menuntun pada keburukan."},{"level":2,"type":"mcq","q":"Hadis 'Jujur itu membawa kepada kebaikan...' mengajarkan bahwa ...","options":["kejujuran membentuk karakter","kejujuran hanya untuk orang kaya","dusta tidak berdampak","kejujuran tidak perlu diamalkan"],"answer":0,"explain":"Kejujuran adalah jalan yang membentuk karakter. Dusta, sekecil apa pun, dapat menuntun pada keburukan."},{"level":3,"type":"scenario","q":"Kamu menemukan kunci ujian. Sikap yang tepat adalah ...","options":["menggunakan agar nilainya bagus","tidak menggunakannya dan melaporkan","menyimpannya tanpa
