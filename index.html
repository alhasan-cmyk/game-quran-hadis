function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function selectExamItems(c, mode) {
  const bank = (GAME_DATA.questionBank && GAME_DATA.questionBank[c.id]) || [];
  const perLevel = mode === 'latihan' ? 2 : 3;
  const byLevel = {};
  for (const q of bank) { (byLevel[q.level] = byLevel[q.level] || []).push(q); }
  const items = [];
  for (let level = 1; level <= 5; level++) {
    const group = shuffle(byLevel[level] || []);
    items.push(...group.slice(0, perLevel));
  }
  return items.sort((a, b) => a.level - b.level);
}

  const cost = isLatihan ? 5 : 10;

function renderMatch(item, picked, isLatihan) {

    return `<div class="note ${isLatihan ? (ok ? 'green' : 'rose') : ''}" style="margin-bottom:8px">${isLatihan ? (ok ? 'Semua pasangan tepat!' : 'Ada pasangan yang belum tepat. Perhatikan pasangan yang benar.') : 'Pencocokan selesai. Pembahasan muncul setelah ujian selesai.'}</div>${isLatihan ? `<div class="stack" style="gap:5px">${rows}</div><div class="feedback ${ok ? 'ok' : 'no'}"><b>${ok ? 'Tepat sekali!' : 'Belum tepat'}</b>${esc(item.explain)}</div>` : ''}`;

  }).join('');
  const meanings = matchState.meanings.map(pairIndex => {
    const matched = matchState.matched.includes(pairIndex);
    return `<button class="option ${matched ? 'correct' : ''}" data-action="match-meaning" data-index="${pairIndex}" ${matched ? 'disabled' : ''}><span class="option-letter">${matched ? '✓' : '?'}</span><span>${esc(pairs[pairIndex].b)}</span></button>`;
  }).join('');
  return `<div class="note" style="margin-bottom:8px">Pilih istilah di kolom kiri, lalu pilih maknanya di kolom kanan. Jika ada kesalahan, soal dinilai belum tepat.</div>
    <div class="grid-2" style="align-items:start"><div><div class="modal-label">Istilah</div><div class="options">${terms}</div></div><div><div class="modal-label">Makna</div><div class="options">${meanings}</div></div></div>

}
function handleMatchTerm(index) {
  if (!matchState || matchState.done) return;
  matchState.selected = Number(index); renderExam();
}
function handleMatchMeaning(pairIndex) {
  if (!matchState || matchState.done || matchState.selected === null) return;
  const selected = matchState.selected;
  if (Number(pairIndex) === selected) {
    matchState.matched.push(selected); matchState.selected = null;
    if (matchState.matched.length === matchState.item.pairs.length) {
      matchState.done = true;
      exam.answers[exam.index] = { match: true, correct: matchState.wrong === 0 };
      sfx(matchState.wrong === 0 ? 'ok' : 'no');

function finishExam() {
  const c = GAME_DATA.chapters.find(x => x.id === exam.chapterId); if (!c) return;
  const isLatihan = exam.mode === 'latihan';
  const items = exam.items;
  const correct = items.reduce((a, item, i) => {
    const v = exam.answers[i];
    if (item.type === 'match') return a + (v && v.correct ? 1 : 0);
    return a + (v === item.answer ? 1 : 0);
  }, 0);
  const pct = Math.round(correct / items.length * 100);
  const levelStats = [1, 2, 3, 4, 5].map(level => {
    const group = items.map((it, i) => ({ it, i })).filter(x => x.it.level === level);
    const c2 = group.filter(x => {
      const v = exam.answers[x.i];
      return x.it.type === 'match' ? (v && v.correct) : v === x.it.answer;
    }).length;
    return { level, total: group.length, correct: c2 };
  });

  const passed = pct >= 80 && levelPass;
  exam.correct = correct; exam.pct = pct; exam.passed = passed; exam.levelStats = levelStats; exam.finished = true;
  if (isLatihan) {
    const prev = state.latihan[c.id] || { best: 0, attempts: 0 };
    state.latihan[c.id] = { ...prev, best: Math.max(prev.best || 0, correct), total: items.length, attempts: (prev.attempts || 0) + 1, lastPct: pct, lastLevelStats: levelStats };

  } else {
    const prev = state.exams[c.id] || { passed: false, best: 0, attempts: 0 };
    exam.previouslyPassed = !!prev.passed;
    state.exams[c.id] = { ...prev, passed: prev.passed || passed, best: Math.max(prev.total === items.length ? (prev.best || 0) : 0, correct), total: items.length, attempts: (prev.attempts || 0) + 1, lastPct: pct, lastLevelStats: levelStats };
    if (passed && !prev.passed) state.reviews[c.id] = { started: Date.now(), completed: [] };
    state.unlocked = computeUnlocked();
    if (passed && !prev.passed) {
      state.quests.examsPassed = computeExamsPassed();
      addXp(100); addCoins(50);
      toast(`🎉 Lulus ${c.bab}! ${c.id < 8 ? 'Rumah Ilmu ' + (c.id + 1) + ' terbuka.' : 'Semua rumah terbuka!'}`);
      confetti(80); sfx('level');
    } else if (passed) { addXp(20); toast('Ujian diulang. Skor terbaikmu tersimpan.'); }
    else { addXp(10); toast('Belum lulus. Baca buku dan coba lagi, ya.'); sfx('no'); }
    if (c.id === 8 && passed) state.flags.final = true;
  }

/* ---------------- Quest log ---------------- */
function openQuestLog() { currentModal = 'quests'; modalOpen = true; renderQuestLog(); }
function questProgress(metric) {
  if (metric === 'planted') return state.quests.planted;
  if (metric === 'harvested') return state.quests.harvested;
  if (metric === 'talked') return state.quests.talked;
  if (metric === 'booksRead') return state.quests.booksRead;
  if (metric === 'examsPassed') return computeExamsPassed();
  return 0;
}
function checkQuests() {
  for (const q of GAME_DATA.quests) {
    if (questProgress(q.metric) >= q.target && !state.quests.claimed[q.id] && !state.quests.notified[q.id]) {
      state.quests.notified[q.id] = true;
      toast(`Misi selesai: ${q.title}. Klaim di Papan Misi.`);
      saveGame(true);
    }
  }
}
function claimQuest(id) {
  const q = GAME_DATA.quests.find(x => x.id === id); if (!q) return;
  if (state.quests.claimed[id]) { toast('Misi ini sudah diklaim.'); return; }
  if (questProgress(q.metric) < q.target) { toast('Misi belum selesai.'); return; }
  state.quests.claimed[id] = true;
  if (q.coins) addCoins(q.coins);
  if (q.xp) addXp(q.xp);
  toast(`Hadiah misi: ${q.coins ? `🪙 ${q.coins}` : `+${q.xp} XP`}`); sfx('coin');
  saveGame(true); renderHUD();
  if (currentModal === 'quests') renderQuestLog();
}
function renderQuestLog() {
  const passed = computeExamsPassed();
  const chapters = GAME_DATA.chapters.map(c => {
    const ex = state.exams[c.id], unlocked = isUnlocked(c.id), ok = !!(ex && ex.passed);
    const status = ok ? '✓ Lulus' : unlocked ? 'Tersedia' : '🔒 Terkunci';
    return `<div class="chapter-row"><span class="emoji">${c.emoji}</span><div class="c-main"><b>${esc(c.bab)} · ${esc(c.title)}</b><small>${esc(c.teacher)} · ${status}</small></div><div class="c-actions"><button class="btn btn-sm btn-ghost" data-action="open-book" data-id="${c.id}">Baca</button>${unlocked ? `<button class="btn btn-sm btn-ghost" data-action="open-exam" data-id="${c.id}" data-mode="latihan">Latihan</button><button class="btn btn-sm btn-primary" data-action="open-exam" data-id="${c.id}" data-mode="ujian">${ok ? 'Ulangi' : 'Ujian'}</button>` : `<button class="btn btn-sm" disabled>Terkunci</button>`}</div></div>`;
  }).join('');
  const quests = GAME_DATA.quests.map(q => {
    const prog = Math.min(questProgress(q.metric), q.target), done = prog >= q.target, claimed = !!state.quests.claimed[q.id];
    return `<div class="quest-row"><span class="ico">${q.icon}</span><div class="q-main"><b>${esc(q.title)}</b><small>${esc(q.desc)} · ${prog}/${q.target} · hadiah ${q.coins ? `🪙 ${q.coins}` : `+${q.xp} XP`}</small><div class="progress" style="margin-top:4px"><i style="width:${(prog / q.target) * 100}%"></i></div></div>${claimed ? '<span class="chip green">Selesai</span>' : done ? `<button class="btn btn-sm btn-primary" data-action="claim-quest" data-id="${q.id}">Klaim</button>` : `<span class="chip">${prog}/${q.target}</span>`}</div>`;
  }).join('');
  const html = `<div class="modal-head"><div class="modal-icon">📜</div><div><h3 class="modal-title">Papan Misi</h3><div class="modal-sub">Lulus ujian untuk membuka rumah berikutnya</div></div></div>
    <div class="book-card"><div class="spread"><h4>🎯 Misi Utama: Lulus 8 Ujian Rumah Ilmu</h4><span class="chip gold">${passed}/8</span></div><div class="progress" style="margin-top:6px"><i style="width:${(passed / 8) * 100}%"></i></div><p style="margin-top:6px">${passed >= 8 ? 'Semua rumah tuntas! Kamu bisa membuka sertifikat.' : 'Setiap rumah yang lulus membuka rumah berikutnya. Baca buku, latihan, lalu hadapi ujian.'}</p></div>
    <div class="modal-section"><div class="modal-label">Rumah Ilmu</div>${chapters}</div>
    <div class="modal-section"><div class="modal-label">Misi Sampingan</div>${quests}</div>
    <div class="modal-actions">${passed >= 8 ? `<button class="btn btn-green" data-action="certificate">🎓 Buka Sertifikat</button>` : ''}<button class="btn btn-ghost" data-action="close-modal">Tutup</button></div>`;
  openModal(html, 'quests', { wide: true });
}

      <div class="help-card"><b>💬 Interaksi</b><span>Tekan <span class="keycap">E</span> / <span class="keycap">Spasi</span> atau tombol <b>A</b> di dekat NPC, pintu, atau lahan.</span></div>
      <div class="help-card"><b>🎒 Inventaris</b><span>Tekan <span class="keycap">I</span> untuk makan, membaca buku, atau memakai air siram.</span></div>
      <div class="help-card"><b>📜 Misi</b><span>Tekan <span class="keycap">Q</span> untuk melihat misi utama dan sampingan.</span></div>
      <div class="help-card"><b>🏆 Latihan &amp; Ujian</b><span><b>Latihan:</b> 10 soal (2 per level), umpan balik langsung. <b>Ujian:</b> 15 soal (3 per level). Lulus jika ≥ 80% dan minimal 60% di setiap level. Boleh mengulang dengan soal acak baru.</span></div>
      <div class="help-card"><b>🌱 Bertani</b><span>Tanam benih → siram → tidur → panen. Hasil panen bisa dijual di warung.</span></div>
      <div class="help-card"><b>⚡ Energi</b><span>Bergerak dan bekerja mengurangi energi. Makan, istirahat, atau tidur untuk memulihkan.</span></div>
      <div class="help-card"><b>🌙 Waktu</b><span>Hari berjalan sampai pukul 22.00. Tidur di rumah atau masjid untuk memulai hari baru.</span></div>
    </div>
    <div class="note gold" style="margin-top:12px">🎯 <b>Tujuan:</b> lulus 8 ujian Rumah Ilmu, kumpulkan XP, dan buka sertifikat Penjaga Hikmah. Bank soal: <b>176 soal</b> (22 per bab) dengan 5 level kognitif. Setiap rumah adalah satu bab Al-Qur'an Hadis.</div>
    <div class="note" style="margin-top:8px">📚 Sumber: Al-Qur'an Hadis MA Kelas XII (KSKK 2020, Kemenag RI). Teks ayat: mushaf Utsmani + terjemahan Kemenag. Hadis: terjemah beserta sumber.</div>
    <div class="note gold" style="margin-top:8px">🧭 <b>Struktur 7 fase:</b> orientasi → eksplorasi → latihan → misi RPG → simulasi → asesmen penguasaan → refleksi. <a href="Nusa-Quran-Quest.html" target="_blank" style="color:#ffe6a8;text-decoration:underline">Buka aplikasi pendamping (dasbor guru)</a>.</div>
    <div class="modal-actions"><button class="btn btn-danger btn-sm" data-action="reset">↺ Reset Permainan</button><button class="btn btn-primary" data-action="close-modal">Mengerti</button></div>`;
  openModal(html, 'help', { wide: true });
}
function confirmReset() {
  const html = `<div class="modal-head"><div class="modal-icon">⚠️</div><div><h3 class="modal-title">Reset permainan?</h3><div class="modal-sub">Semua progres di perangkat ini akan dihapus.</div></div></div><p class="modal-body">XP, level, lencana, ujian, pertanian, dan jurnal akan dihapus. Tindakan ini tidak dapat dibatalkan.</p><div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Batal</button><button class="btn btn-danger" data-action="confirm-reset">Ya, Reset</button></div>`;
  openModal(html, 'confirm', { narrow: true, closable: false });
}
function resetGame() {
  const name = state.playerName || 'Penjaga Hikmah';
  stopGame();
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  newGame(); modalOpen = false; currentModal = null; exam = null; currentBook = null;
  startGame(false, name);
}
function openCertificate() { currentModal = 'certificate'; modalOpen = true; renderCertificate(); }
function renderCertificate() {
  const passed = computeExamsPassed(), all = passed >= 8, li = levelInfo();
  const chapters = GAME_DATA.chapters.map(c => `<div class="chapter-row"><span class="emoji">${c.emoji}</span><div class="c-main"><b>${esc(c.bab)} · ${esc(c.title)}</b><small>${state.exams[c.id] && state.exams[c.id].passed ? '✓ Lulus' : 'Belum lulus'}</small></div><span class="chip ${state.exams[c.id] && state.exams[c.id].passed ? 'green' : ''}">${state.exams[c.id] && state.exams[c.id].passed ? 'Lulus' : '—'}</span></div>`).join('');
  const html = all
    ? `<div class="certificate"><div class="cert-seal">📜</div><div class="cert-title">Sertifikat Penjaga Hikmah</div><div class="cert-name">${esc(state.playerName || 'Penjaga Hikmah')}</div><p class="cert-sub">telah menyelesaikan perjalanan Nusa Qur'an Quest — RPG &amp; Simulasi Desa Nusantara, dengan lulus 8 ujian Rumah Ilmu dan lulus asesmen dalam permainan. Sertifikat ini bukan bukti penguasaan yang terverifikasi guru.</p><div class="cert-grid"><div class="cert-cell"><b>${state.stats.xp}</b><small>Total XP</small></div><div class="cert-cell"><b>${li.level}</b><small>Level</small></div><div class="cert-cell"><b>${passed}/8</b><small>Rumah tuntas</small></div></div><p class="cert-sub" style="margin-bottom:0">Diterbitkan pada ${fmtDate()} di Desa Nusantara.</p></div><div class="modal-actions no-print"><button class="btn btn-ghost" data-action="close-modal">Tutup</button><button class="btn btn-primary" data-action="print-cert">🖨️ Cetak / Simpan PDF</button></div>`
    : `<div class="modal-head"><div class="modal-icon">🎓</div><div><h3 class="modal-title">Menuju Sertifikat</h3><div class="modal-sub">${passed}/8 rumah tuntas</div></div></div><p class="modal-body">Sertifikat terbuka setelah kamu lulus 8 ujian Rumah Ilmu. Ini posisimu sekarang:</p><div class="modal-section">${chapters}</div><div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Tutup</button><button class="btn btn-primary" data-action="quests">Buka Papan Misi</button></div>`;
  openModal(html, 'certificate', { wide: true });
}
function showWelcome() {
  const html = `<div class="modal-head"><div class="modal-icon">👋</div><div><h3 class="modal-title">Selamat datang, ${esc(state.playerName || 'Penjaga Hikmah')}!</h3><div class="modal-sub">Desa Nusantara menunggu</div></div></div>
    <p class="modal-body">Kamu adalah <b>Penjaga Hikmah</b>. Jelajahi desa, bicara dengan para guru, dan lulus ujian untuk membuka 8 Rumah Ilmu.</p>
    <div class="help-grid"><div class="help-card"><b>1. Jelajahi</b><span>Gunakan WASD / panah atau D-pad. Dekati NPC dan tekan E / A.</span></div><div class="help-card"><b>2. Bicara dengan guru</b><span>Setiap guru memberi materi singkat dan membuka ujian babnya.</span></div><div class="help-card"><b>3. Lulus ujian</b><span>Skor ≥ 80% membuka rumah berikutnya. Boleh mengulang.</span></div></div>
    <div class="note gold" style="margin-top:10px">💡 Kamu juga bisa bertani, membeli buku, makan, dan tidur. Energi dan waktu adalah bagian dari permainan.</div>
    <div class="modal-actions"><button class="btn btn-ghost" data-action="help">Cara Bermain</button><button class="btn btn-primary" data-action="close-modal">Mulai →</button></div>`;
  openModal(html, 'welcome', { narrow: true, closable: false });
}

/* ---------------- Portfolio penguasaan ---------------- */
const REFLECTION_PROMPTS = [
 'Temanmu kesulitan memenuhi kebutuhan sekolah. Bagaimana kamu membantu dengan sederhana dan menjaga martabatnya? Jelaskan alasan berdasarkan materi bab.',
 'Ketika gagal mencapai target, bagaimana kamu bersikap positif dan sabar? Jelaskan langkah nyata dan alasan berdasarkan materi bab.',
 'Lingkungan sekolah penuh sampah. Rancang tindakan yang bisa dilakukan bersama dan jelaskan kaitannya dengan ajaran bab.',
 'Bagaimana kamu menggunakan ilmu dan teknologi secara bertanggung jawab? Beri contoh serta alasan berdasarkan materi bab.',
 'Seseorang berbeda pendapat tentang agama. Bagaimana berdakwah dengan ramah? Beri contoh dan alasan berdasarkan materi bab.',
 'Temanmu melakukan kesalahan di depan umum. Bagaimana mengajak kepada kebaikan tanpa mempermalukannya? Jelaskan alasanmu.',
 'Kelompokmu berselisih saat menentukan keputusan. Bagaimana kamu menerapkan musyawarah dan menghormati hasilnya?',
 'Kamu menemukan barang berharga yang bukan milikmu. Apa tindakan yang adil dan jujur? Jelaskan alasan berdasarkan materi bab.'
];
const SKILL_NAMES = ['Mengingat','Memahami','Menerapkan','Menganalisis','Mengevaluasi'];
const REMEDIES = ['tinjau istilah dan fakta','jelaskan kembali ayat atau hadis dengan kata sendiri','coba kasus penerapan','bandingkan alasan dan hubungan gagasan','nilai pilihan dan jelaskan alasannya'];
function openStats() {
  const passed = computeExamsPassed();
  const sections = [[1,5],[6,8]].map(([lo,hi],idx) => {
    const rows = GAME_DATA.chapters.filter(c => c.id >= lo && c.id <= hi).map(c => {
      const l = state.latihan[c.id], e = state.exams[c.id], r = state.reflections[c.id], rev = state.reviews[c.id];
      const unlocked = isUnlocked(c.id);
      const score = x => !x ? 'Belum dikerjakan' : `${x.best}/${x.total || '?'} terbaik · ${x.attempts || 0} percobaan${x.lastPct != null ? ` · terakhir ${x.lastPct}%` : ' · data lama'}`;
      const skills = e && e.lastLevelStats || l && l.lastLevelStats;
      const weak = skills && skills.filter(x => x.total && x.correct / x.total < .8);
      let review = 'Terbuka setelah ujian lulus';
      if (e && e.passed && !rev) review = 'Lulus pada versi lama; jadwal ulang belum tersedia.';
      if (rev) {
        const stages = [1,3,7], done = rev.completed || [];
        review = stages.map((days,i) => {
          const due = rev.started + days*86400000, ready = Date.now() >= due;
          return done.includes(i) ? `✓ Hari ${days}` : ready ? `<button class="btn btn-sm" data-action="review-done" data-id="${c.id}" data-stage="${i}">Tandai ulasan hari ${days}</button>` : `Hari ${days}: ${esc(fmtDate(new Date(due)))}`;
        }).join(' · ');
      }
      return `<div class="book-card" style="margin:8px 0"><div class="spread"><h4>${esc(c.bab)} · ${esc(c.title)}</h4><span class="chip">${!unlocked ? '🔒 Terkunci' : e && e.passed ? '✓ Ujian lulus' : 'Dalam perjalanan'}</span></div>
        <p>📖 Buku: ${state.read[c.id] ? 'Pernah dibuka' : 'Belum dibuka'} · ✍️ Refleksi: ${r ? 'Tersimpan (penilaian guru belum tersedia)' : 'Belum dibuat'}</p>
        <p>🧩 Latihan: ${score(l)}<br>🎯 Ujian: ${score(e)}</p>
        <p>🧭 Kompetensi terakhir ${skills ? `(${e && e.lastLevelStats ? 'ujian' : 'latihan'}): ${skills.map(x => `${SKILL_NAMES[x.level-1]} ${x.correct}/${x.total}`).join(' · ')}` : 'belum ada data per level'}</p>
        ${weak && weak.length ? `<p>💡 Penguatan: ${weak.map(x => REMEDIES[x.level-1]).join('; ')}.</p>` : ''}
        <p>🗓️ Ulang berkala (tanggal nyata): ${review}</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-sm" data-action="open-book" data-id="${c.id}">Buku</button>${unlocked ? `<button class="btn btn-sm" data-action="open-exam" data-id="${c.id}" data-mode="latihan">Latihan</button><button class="btn btn-sm" data-action="open-exam" data-id="${c.id}" data-mode="ujian">Ujian</button><button class="btn btn-sm" data-action="reflection" data-id="${c.id}">Refleksi / kasus</button>` : ''}</div></div>`;
    }).join('');
    return `<div class="modal-section"><div class="modal-label">Semester ${idx+1} · Bab ${lo}–${hi}</div>${rows}</div>`;
  }).join('');
  const li = levelInfo();
  openModal(`<div class="modal-head"><div class="modal-icon">📊</div><div><h3 class="modal-title">Statistik &amp; Portofolio</h3><div class="modal-sub">${esc(state.playerName)} · Level ${li.level} · ${state.stats.xp} XP · ${passed}/8 ujian lulus</div></div></div>
    <div class="note gold">Alur belajar berbasis kompetensi: tujuan → belajar → latihan dan umpan balik → ujian → penerapan dan refleksi → ulang berkala. Terinspirasi praktik asesmen formatif; bukan program atau sertifikasi Cambridge resmi.</div>
    <p class="modal-body">Lulus ujian = ≥80% keseluruhan dan ≥60% setiap level. Angka ini adalah hasil tes, bukan jaminan 80% pemahaman. Pembukaan buku, refleksi, dan ulasan adalah catatan aktivitas, bukan bukti dinilai guru. Semester dikelompokkan sesuai permintaan; buku sumber membagi Bab I–IV dan V–VIII.</p>${sections}<div class="modal-actions"><button class="btn btn-primary" data-action="close-modal">Tutup</button></div>`, 'stats', {wide:true});
}
function openReflection(id) {
  const c = GAME_DATA.chapters.find(x => x.id === id);
  if (!c || !isUnlocked(id)) return;
  const r = state.reflections[id] || {};
  openModal(`<div class="modal-head"><div class="modal-icon">📝</div><div><h3 class="modal-title">Refleksi &amp; kasus · ${esc(c.bab)}</h3><div class="modal-sub">Tulis jawabanmu, lalu diskusikan dengan guru.</div></div></div><p class="modal-body">${esc(REFLECTION_PROMPTS[id-1])}</p><p>Jelaskan tindakan, alasan, dan kaitan dengan materi. Tulisan tidak dinilai otomatis.</p><label for="reflection-text">Jawaban / rencana tindakan</label><textarea id="reflection-text" maxlength="3000" style="display:block;width:100%;min-height:150px;padding:10px;margin:8px 0;color:#172333;background:white;border-radius:8px">${esc(r.text || '')}</textarea><label for="reflection-confidence">Keyakinan diri (bukan nilai)</label><select id="reflection-confidence" style="display:block;padding:8px;margin:8px 0;color:#172333;background:white">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(r.confidence || 3)===n?'selected':''}>${n}/5</option>`).join('')}</select><div class="modal-actions"><button class="btn" data-action="stats">Kembali</button><button class="btn btn-primary" data-action="save-reflection" data-id="${id}">Simpan refleksi</button></div>`, 'reflection', {wide:true});
}
function saveReflection(id) {
  if (!isUnlocked(id) || !GAME_DATA.chapters.some(c=>c.id===id)) return;
  const text = ($('#reflection-text')?.value || '').trim();
  if (text.length < 20) { toast('Tuliskan setidaknya 20 karakter agar refleksimu bermakna.'); return; }
  state.reflections[id] = {text, confidence:Number($('#reflection-confidence').value), savedAt:Date.now()};
  saveGame(true); toast('Refleksi tersimpan di perangkat ini.'); openStats();
}
function completeReview(id, stage) {
  const rev = state.reviews[id], days = [1,3,7];
  if (!rev || !Number.isInteger(stage) || stage < 0 || stage > 2 || Date.now() < rev.started + days[stage]*86400000) return;
  if (!rev.completed) rev.completed = [];
  if (!rev.completed.includes(stage)) rev.completed.push(stage);
  saveGame(true); toast('Ulasan dicatat berdasarkan pengakuanmu; latihan ulang disarankan.'); openStats();
}
/* ---------------- Events ---------------- */
let pendingStartName = null;
function handleAction(action, el, e) {
  switch (action) {
    case 'start-new': {
      const input = $('#player-name');
      const name = input && input.value.trim() ? input.value.trim() : 'Penjaga Hikmah';
      if (hasSave()) {
        pendingStartName = name;
        openModal(`<div class="modal-head"><div class="modal-icon">🌱</div><div><h3 class="modal-title">Mulai baru?</h3><div class="modal-sub">Progres lama akan diganti.</div></div></div><p class="modal-body">Kamu akan memulai perjalanan baru sebagai <b>${esc(name)}</b>. Progres yang tersimpan di perangkat ini akan dihapus.</p><div class="modal-actions"><button class="btn btn-ghost" data-action="close-modal">Batal</button><button class="btn btn-primary" data-action="confirm-start-new">Ya, Mulai Baru</button></div>`, 'confirm', { narrow: true, closable: false });
      } else startGame(false, name);
      return;
    }
    case 'confirm-start-new': { const name = pendingStartName || 'Penjaga Hikmah'; pendingStartName = null; startGame(false, name); return; }
    case 'start-continue': startGame(true); return;
    case 'start-help': openHelp(); return;
    case 'inventory': openInventory(); return;
    case 'quests': openQuestLog(); return;
    case 'stats': openStats(); return;
    case 'reflection': openReflection(Number(el.dataset.id)); return;
    case 'save-reflection': saveReflection(Number(el.dataset.id)); return;
    case 'review-done': completeReview(Number(el.dataset.id), Number(el.dataset.stage)); return;
    case 'certificate': openCertificate(); return;
    case 'save': saveGame(false); return;
    case 'help': openHelp(); return;
    case 'sound': toggleSound(); return;
    case 'interact': interact(); return;
    case 'close-modal': closeModal(); return;
    case 'modal-bg': if (e && e.target === el) closeModal(); return;
    case 'exam-answer': answerExam(Number(el.dataset.index)); return;
    case 'answer-quiz': answerExam(Number(el.dataset.index)); return;
    case 'exam-next': nextExam(); return;
    case 'next-exam': nextExam(); return;
    case 'match-term': handleMatchTerm(Number(el.dataset.index)); return;
    case 'match-meaning': handleMatchMeaning(Number(el.dataset.index)); return;
    case 'exam-retry': { const id = exam ? exam.chapterId : currentBook; const mode = el.dataset.mode || (exam ? exam.mode : 'ujian'); if (id) startExam(id, mode); return; }
    case 'exam-from-book': { const id = Number(el.dataset.id); const mode = el.dataset.mode || 'ujian'; closeModal(); startExam(id, mode); return; }
    case 'open-exam': { const id = Number(el.dataset.id); const mode = el.dataset.mode || 'ujian'; closeModal(); startExam(id, mode); return; }
    case 'open-book': openBook(Number(el.dataset.id)); return;
    case 'buy': buyItem(el.dataset.key); return;
    case 'sell-crop': sellCrop(); return;
    case 'sell-all': sellAllCrops(); return;
    case 'use-item': useItem(el.dataset.key); return;
    case 'claim-quest': claimQuest(el.dataset.id); return;
    case 'read-book-item': readBookItem(); return;
    case 'sleep': sleep(); return;
    case 'rest': rest(); return;
    case 'wisdom': showWisdom(); return;
    case 'reset': confirmReset(); return;
    case 'confirm-reset': resetGame(); return;
    case 'print-cert': window.print(); return;
    case 'close-dialogue': closeDialogue(); return;
    case 'close-exam': closeExam(); return;
    case 'open-shop': openShop(); return;
    case 'open-library': openLibrary(); return;
    case 'open-house': openHouse(); return;
    case 'open-masjid': openMasjid(); return;
    case 'open-quests': openQuestLog(); return;
    case 'open-inventory': openInventory(); return;
    case 'open-help': openHelp(); return;
    case 'open-certificate': openCertificate(); return;
    default: break;
  }
}
document.addEventListener('click', (e) => {
  if (e.target.closest('#dialogue') && !e.target.closest('button')) {
    const t = $('#dlg-text');
    if (t && typeTimer) { clearInterval(typeTimer); typeTimer = null; t.textContent = t.dataset.full || ''; }
  }
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) handleAction(actionEl.dataset.action, actionEl, e);
  const choiceEl = e.target.closest('[data-choice]');
  if (choiceEl) handleChoice(choiceEl.dataset.choice);
});
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'escape') {
    if (modalOpen) { closeModal(); return; }
    if (dialogueOpen) { closeDialogue(); return; }
    if (running) { openHelp(); return; }
  }
  if (!running || modalOpen || dialogueOpen) return;
  if (k === 'arrowup' || k === 'w') { keys.up = true; e.preventDefault(); }
  else if (k === 'arrowdown' || k === 's') { keys.down = true; e.preventDefault(); }
  else if (k === 'arrowleft' || k === 'a') { keys.left = true; e.preventDefault(); }
  else if (k === 'arrowright' || k === 'd') { keys.right = true; e.preventDefault(); }
  else if (k === 'e' || k === ' ' || k === 'enter') { interact(); e.preventDefault(); }
  else if (k === 'i') { openInventory(); e.preventDefault(); }
  else if (k === 'p') { openStats(); e.preventDefault(); }
  else if (k === 'q') { openQuestLog(); e.preventDefault(); }
  else if (k === 'm') { openHelp(); e.preventDefault(); }
});
document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') keys.up = false;
  else if (k === 'arrowdown' || k === 's') keys.down = false;
  else if (k === 'arrowleft' || k === 'a') keys.left = false;
  else if (k === 'arrowright' || k === 'd') keys.right = false;
});
window.addEventListener('blur', () => { keys = { up: false, down: false, left: false, right: false }; touch = { up: false, down: false, left: false, right: false }; });
document.addEventListener('pointerdown', (e) => {
  const dirEl = e.target.closest('[data-dir]');
  if (dirEl) { touch[dirEl.dataset.dir] = true; e.preventDefault(); }
});
document.addEventListener('pointerup', (e) => {
  const dirEl = e.target.closest('[data-dir]');
  if (dirEl) touch[dirEl.dataset.dir] = false;
});
document.addEventListener('pointercancel', (e) => {
  const dirEl = e.target.closest('[data-dir]');
  if (dirEl) touch[dirEl.dataset.dir] = false;
});
document.addEventListener('pointerout', (e) => {
  const dirEl = e.target.closest('[data-dir]');
  if (dirEl && !dirEl.contains(e.relatedTarget)) touch[dirEl.dataset.dir] = false;
});
window.addEventListener('resize', () => { if (running) resizeCanvas(); });

/* ---------------- Debug hook (untuk pengujian & pengembangan) ---------------- */
window.__nq = {
  get state() { return state; },
  get exam() { return exam; },
  get matchState() { return matchState; },
  GAME_DATA, startGame, stopGame, startExam, renderExam, openBook, openShop, openLibrary, openQuestLog,
  openInventory, openHelp, openCertificate, openStats, openReflection, interact, saveGame, loadGame, newGame, sleep, renderHUD
};

/* ---------------- Init ---------------- */
renderStart();

</script>
